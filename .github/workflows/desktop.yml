name: Logiciel de bureau

on:
  push:
    branches: [claude/library-dashboard-design-11rghh, main]
    paths: ["app/**", "desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: npx electron-builder --mac dmg zip --universal -c.mac.identity=-
            files: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
          - os: windows-latest
            cmd: npx electron-builder --win nsis portable --x64
            files: desktop/dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install pillow
      - run: python app/build.py
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - run: ${{ matrix.cmd }}
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: Bibliotheque-KIS-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
