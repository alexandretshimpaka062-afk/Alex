name: Logiciel de bureau

on:
  push:
    branches: [claude/library-dashboard-design-11rghh, main]
    paths: ["app/**", "desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install pillow
      - run: python app/build.py
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - name: Fabrication (.dmg et .zip universels)
        run: npx electron-builder --mac dmg zip --universal
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - name: Diagnostic — application non signée par nous et variantes
        working-directory: desktop
        continue-on-error: true
        run: |
          set -x
          ls dist
          APP=$(ls -d dist/mac-universal/*.app)
          plutil -p "$APP/Contents/Info.plist" | head -40
          codesign -dvvv "$APP" 2>&1 | head -20
          codesign -d --entitlements - "$APP" 2>&1 | head -20
          EXE=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f | head -1)
          ELECTRON_ENABLE_LOGGING=1 ELECTRON_ENABLE_STACK_DUMPING=1 KIV_DATA_DIR="$RUNNER_TEMP/d0" "$EXE" --smoke-test --enable-logging 2>&1 | tail -40
          sleep 3
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5
          F=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1); [ -n "$F" ] && head -c 6000 "$F"
          echo "— Electron d'origine (sans notre application)"
          E=node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
          "$E" --version
          KIV_DATA_DIR="$RUNNER_TEMP/d1" "$E" . --smoke-test 2>&1 | tail -15
      - name: Vérification — installation depuis le .dmg et lancement
        working-directory: desktop
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint /tmp/kivdmg
          APP=$(ls -d /tmp/kivdmg/*.app)
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p "$RUNNER_TEMP/Applications"
          ditto "$APP" "$RUNNER_TEMP/Applications/$(basename "$APP")"
          hdiutil detach /tmp/kivdmg
          APP="$(ls -d "$RUNNER_TEMP"/Applications/*.app)"
          EXE=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f | head -1)
          lipo -archs "$EXE"
          echo "— puce Apple (arm64)"
          KIV_DATA_DIR="$RUNNER_TEMP/data-arm" "$EXE" --smoke-test
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "— Mac Intel (x86_64, via Rosetta)"
            KIV_DATA_DIR="$RUNNER_TEMP/data-x64" arch -x86_64 "$EXE" --smoke-test
          else
            echo "Rosetta absent sur cette machine : test Intel ignoré"
          fi
          spctl --assess --type execute -vv "$APP" || echo "(normal : application non notariée par Apple)"
      - name: Rapport de plantage éventuel
        if: failure()
        run: |
          F=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1); [ -n "$F" ] && head -c 8000 "$F" || echo "aucun rapport"
      - uses: actions/upload-artifact@v4
        with:
          name: Kivutheque-macOS
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install pillow
      - run: python app/build.py
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - name: Fabrication (installateur et version portable)
        run: npx electron-builder --win nsis portable --x64
        working-directory: desktop
      - name: Diagnostic — installateur 1.1.0 publié, sur la même machine
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest "https://github.com/alexandretshimpaka062-afk/Alex/releases/download/kivutheque-v1.1.0/Kivutheque-1.1.0-win-x64.exe" -OutFile "$env:RUNNER_TEMP\old.exe"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\old.exe" -ArgumentList "/S", "/D=$env:RUNNER_TEMP\OldInstall" -Wait -PassThru
          Write-Host "1.1.0 : code $($p.ExitCode)"
          Start-Sleep -Seconds 20
          Get-ChildItem "$env:RUNNER_TEMP\OldInstall" -ErrorAction SilentlyContinue | Select-Object -First 5 | Out-String | Write-Host
          Get-WinEvent -LogName Application -MaxEvents 15 -ErrorAction SilentlyContinue | Where-Object { $_.LevelDisplayName -eq "Error" } | Format-List TimeCreated, ProviderName, Message | Out-String -Width 300 | Write-Host
      - name: Vérification — installation silencieuse et lancement
        shell: pwsh
        working-directory: desktop
        run: |
          $ErrorActionPreference = "Stop"
          function Smoke($exe, $data) {
            $env:KIV_DATA_DIR = $data
            $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
            Write-Host "$exe -> code $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "Le lancement a échoué : $exe" }
            if (-not (Test-Path (Join-Path $data "donnees.json"))) { throw "Données non enregistrées : $exe" }
          }
          $setup = Get-ChildItem dist -Filter "Kivutheque-*-win-x64.exe" | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP "KivuthequeInstall"
          Write-Host "Installateur : $($setup.FullName) ($([math]::Round($setup.Length/1MB)) Mo)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$dest" -Wait -PassThru
          Write-Host "Installateur terminé, code $($p.ExitCode)"
          # l'installateur NSIS peut se relancer lui-même : on attend que l'exécutable apparaisse
          $installed = $null
          for ($i = 0; $i -lt 150 -and -not $installed; $i++) {
            Start-Sleep -Seconds 2
            $installed = Get-ChildItem $dest, "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Depth 2 -Filter "Kivuth*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike "Uninstall*" } | Select-Object -First 1
          }
          if (-not $installed) {
            Write-Host "--- contenu de $dest"; Get-ChildItem $dest -Recurse -Depth 1 -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300 | Write-Host
            Write-Host "--- programmes utilisateur"; Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Out-String | Write-Host
            Write-Host "--- processus"; Get-Process | Where-Object { $_.Name -like "*Kivu*" -or $_.Name -like "*setup*" -or $_.Name -like "*nsis*" } | Out-String | Write-Host
            Get-WinEvent -LogName Application -MaxEvents 15 -ErrorAction SilentlyContinue | Where-Object { $_.LevelDisplayName -eq "Error" } | Format-List TimeCreated, ProviderName, Message | Out-String -Width 300 | Write-Host
            throw "Installation introuvable"
          }
          Start-Sleep -Seconds 5
          Write-Host "Installé : $($installed.FullName)"
          Smoke $installed.FullName "$env:RUNNER_TEMP\data-installe"
          $portable = Get-ChildItem dist -Filter "*portable.exe" | Select-Object -First 1
          Smoke $portable.FullName "$env:RUNNER_TEMP\data-portable"
      - uses: actions/upload-artifact@v4
        with:
          name: Kivutheque-Windows
          path: |
            desktop/dist/Kivutheque-*-win-x64.exe
            desktop/dist/*portable.exe
          if-no-files-found: error

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: kivutheque-v${{ steps.v.outputs.version }}
          name: Kivuthèque ${{ steps.v.outputs.version }} — Mac et Windows
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: desktop/RELEASE.md
          files: out/*
