.ta-meta .ic{width:13px;height:13px;vertical-align:-2px;display:inline-block}
@keyframes taPulse{50%{opacity:.6}}
@media (max-width:700px){.hide-sm{display:none}.cons-row{grid-template-columns:auto minmax(0,1fr)}.cons-stats,.cons-act{grid-column:1/-1}.cons-stats div{align-items:flex-start}.task-alert{padding:12px 14px}}
.goal-pick{display:flex;flex-wrap:wrap;gap:10px}
/* « Mon année de lecture » */
.wr{position:fixed;inset:0;z-index:250;background:#03070C;color:#fff;overflow:hidden;animation:inFade .35s ease both}
.wr.out{animation:fadeOut .3s ease both}
.wr-bars-top{position:absolute;top:14px;left:16px;right:64px;z-index:5;display:flex;gap:6px}
.wr-bars-top i{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
.wr-bars-top i b{display:block;height:100%;width:0;background:#fff}
.wr-bars-top i.done b{width:100%}.wr-bars-top i.run b{animation:wrBar 5.5s linear both}
@keyframes wrBar{to{width:100%}}
.wr-x{position:absolute;top:24px;right:16px;z-index:6;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer}
.wr-x .ic{width:18px;height:18px}
.wr-prev,.wr-next{position:absolute;top:60px;bottom:0;z-index:4;border:0;background:transparent;cursor:pointer}
.wr-prev{left:0;width:30%}.wr-next{right:0;width:70%}
.wr-s{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:70px 24px 40px;text-align:center;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
.wr-s.on{opacity:1;visibility:visible}
.wr-s.on>*{animation:wrIn .8s var(--spring) both}.wr-s.on>:nth-child(2){animation-delay:.12s}.wr-s.on>:nth-child(3){animation-delay:.24s}.wr-s.on>:nth-child(4){animation-delay:.36s}
@keyframes wrIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
.wr-s h1{margin:0;font:800 clamp(34px,6vw,64px)/1.05 var(--display);letter-spacing:-.03em;max-width:820px;text-wrap:balance}
.wr-s h2{margin:0;font:700 clamp(22px,3.4vw,34px) var(--display)}.wr-s h2 .ic{width:28px;height:28px;vertical-align:-4px;color:#FF8A3D;display:inline-block}
.wr-s p{margin:0;font-size:18px;opacity:.85;max-width:560px}
.wr-k{font:700 13px var(--body);letter-spacing:.24em;text-transform:uppercase;color:#9BE3FF}
.wr-big{font:900 clamp(110px,22vw,220px)/.9 var(--display);letter-spacing:-.06em;background:linear-gradient(180deg,#fff,#9BE3FF 60%,#39B54A);-webkit-background-clip:text;background-clip:text;color:transparent}
.wr-s.c1{background:radial-gradient(80% 60% at 50% 40%,#0A6FA8,#03070C)}.wr-s.c2{background:linear-gradient(160deg,#03263D,#0A6FA8)}
.wr-s.c3{background:linear-gradient(160deg,#0B3D1E,#1E8E3E)}.wr-s.c4{background:linear-gradient(160deg,#3A1155,#8E3BB5)}
.wr-s.c5{background:linear-gradient(160deg,#4A2508,#D97A1E)}.wr-s.c6{background:linear-gradient(160deg,#4A0A0A,#C2361F)}
.wr-s.c7{background:linear-gradient(160deg,#5A3B00,#F2A900)}.wr-s.c8{background:radial-gradient(90% 70% at 50% 30%,#0A6FA8,#03263D)}
.wr-av .in-img{width:140px;height:140px;border-radius:50%;border:5px solid rgba(255,255,255,.85);display:grid;place-items:center;font:800 54px var(--display);object-fit:cover}
.wr-covers{display:flex;justify-content:center;margin-top:10px}
.wr-covers .cover{width:110px;margin:0 -12px;transform:rotate(var(--r));box-shadow:0 20px 40px -14px rgba(0,0,0,.7)}.wr-covers .cv-title{font-size:11px}
.wr-bars{display:flex;align-items:flex-end;gap:8px;height:160px;margin-top:10px}
.wr-bars div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wr-bars i{width:22px;height:var(--h);min-height:3px;border-radius:6px 6px 2px 2px;background:linear-gradient(#FFD45C,#F2A900);animation:barUp 1s var(--ease) .3s both}
.wr-bars span{font-size:11px;opacity:.7}
@keyframes barUp{from{height:0}}
.wr-card{width:min(360px,86vw);padding:26px;border-radius:26px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;gap:6px}
.wr-logo{height:70px;margin-bottom:6px}.wr-card>b{font:800 22px var(--display)}.wr-card>span{font-size:13px;opacity:.75}
.wr-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:12px}
.wr-stats div{padding:12px;border-radius:16px;background:rgba(255,255,255,.1)}.wr-stats b{display:block;font:800 22px var(--display)}.wr-stats span{font-size:11.5px;opacity:.75}
.wr-s .btn{position:relative;z-index:6}
/* défis, badges, notes */
.defi-top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
@media(max-width:900px){.defi-top{grid-template-columns:1fr}}
.defi-goal{display:flex;gap:22px;align-items:center}
.defi-goal h2{font-size:clamp(20px,2.4vw,26px);letter-spacing:-.02em}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring-bg{stroke:var(--line)}.ring-fg{stroke:url(#none);stroke:var(--accent);transition:stroke-dasharray 1s var(--ease)}
.ring>div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font:800 36px/1 var(--display)}.ring span{font-size:12px;color:var(--ink-3)}
.defi-place{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:center}
.defi-place>div{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line)}
.defi-place span{font-size:12px;color:var(--ink-3)}.defi-place b{font:800 28px var(--display)}.defi-place small{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badges.mini{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 10px;border-radius:18px;border:1px dashed var(--line-2);opacity:.55;filter:grayscale(1)}
.badge.got{opacity:1;filter:none;border-style:solid;border-color:#FFC83D;background:linear-gradient(160deg,rgba(255,200,61,.18),transparent)}
.badge b{font-size:13.5px}.badge small{font-size:11.5px;color:var(--ink-3)}
.badge-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.badge.got .badge-ic{background:linear-gradient(135deg,#FFD45C,#F2A900);color:#5A3B00;box-shadow:0 8px 18px -8px rgba(242,169,0,.8)}
.badge-ic .ic{width:22px;height:22px}
.badges.mini .badge{padding:10px 6px}.badges.mini .badge-ic{width:34px;height:34px}.badges.mini small{display:none}
.rk{grid-template-columns:34px auto minmax(0,1fr) auto!important}
.rk.me{background:var(--accent-soft);border-radius:12px}
.rk-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--display);background:var(--line);color:var(--ink-2)}
.rk-n.p1{background:linear-gradient(135deg,#FFD45C,#F2A900);color:#5A3B00}.rk-n.p2{background:linear-gradient(135deg,#E5ECF2,#A9B8C6);color:#24384A}.rk-n.p3{background:linear-gradient(135deg,#F2C29B,#C27A43);color:#4A2508}
.cls-row{grid-template-columns:34px minmax(0,1fr) auto!important}
.cls-row .meter{margin-top:6px}
.defi-mini{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px}
.defi-mini b{display:block;font-size:14px;margin-bottom:6px}.defi-mini small{display:block;font-size:12px;color:var(--ink-3);margin-top:4px}
.defi-mini>.ic{width:16px;height:16px;color:var(--ink-3)}
.stars{color:var(--line-2);letter-spacing:1px;font-size:16px}.stars i{font-style:normal}.stars i.on{color:#F2A900}.stars i.half{background:linear-gradient(90deg,#F2A900 50%,var(--line-2) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.stars.sm{font-size:11px}
.rd-rate{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.my-rate{display:flex;align-items:center;gap:2px}
.star-btn{all:unset;cursor:pointer;font-size:24px;color:var(--line-2);padding:0 2px;transition:transform .15s}
.star-btn:hover{transform:scale(1.2)}.star-btn.on{color:#F2A900}
.nf-track.mini{grid-auto-columns:110px;gap:12px}.nf-track.mini .cv-title{font-size:12px}
.lib-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.lib-act{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:18px;border:1px solid var(--line-2);background:linear-gradient(135deg,var(--accent-soft),var(--green-soft));color:inherit;font:inherit;cursor:pointer;transition:transform .2s var(--ease),border-color .2s}
.lib-act:hover{transform:translateY(-2px);border-color:var(--accent)}
.lib-act .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass-strong);color:var(--accent);flex:none}
.lib-act .ic svg{width:20px;height:20px}
.lib-act b{display:block;font-size:14.5px}
.lib-act small{display:block;font-size:12.5px;color:var(--ink-3)}
.ni-item{display:flex;flex-direction:column;gap:8px}
.ni-form{padding:12px;border-radius:14px;border:1px dashed var(--accent);display:flex;flex-direction:column;gap:10px}
.ni-btns{display:flex;gap:8px;flex-wrap:wrap}
.lk.lk-done{border-color:var(--green);background:var(--green-soft)}
.lk.lk-done .btn{background:var(--green)}
.cover-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cp-head{display:flex;gap:12px;align-items:center}
.cp-head .t{font-weight:650}
.cp-head .s{font-size:12.5px;color:var(--ink-3)}
.cp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;min-height:60px}
.cp-item{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;border-radius:10px;padding:6px;transition:background .2s,transform .2s}
.cp-item:hover,.cp-item:focus-visible{background:var(--accent-soft);transform:translateY(-2px)}
.cp-item img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:4px 8px 8px 4px;box-shadow:0 8px 18px -8px rgba(0,0,0,.5);background:var(--line)}
.cp-item span{font-size:11px;color:var(--ink-3)}
.cp-actions{display:flex;gap:8px;flex-wrap:wrap}
.cv-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.cv-stats div{padding:12px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line)}
.cv-stats b{display:block;font:800 24px var(--display)}
.cv-stats span{font-size:12px;color:var(--ink-3)}
.ok-box{background:var(--green-soft);color:var(--green)}
.lookup{border:1px solid var(--line-2);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,rgba(0,174,239,.07),rgba(46,177,74,.06))}
.lookup-h{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13.5px}
.lookup-h .ic{width:18px;height:18px;flex:none;color:var(--accent)}
.lk-msg .ic{width:15px;height:15px;vertical-align:-3px;color:var(--green)}
.lookup-bar .btn{flex:none}
.lookup-h small{font-weight:500;color:var(--ink-3);margin-left:auto}
.lookup-bar{display:flex;gap:8px}
.lookup-bar .field-search{flex:1;min-width:0}
.lk-results{display:flex;flex-direction:column;gap:6px;max-height:330px;overflow-y:auto}
.lk-results:empty{display:none}
.lk{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:8px;border-radius:14px;border:1px solid var(--line);background:var(--glass-strong);cursor:pointer;color:inherit;font:inherit;width:100%}
.lk:hover,.lk:focus-visible{border-color:var(--accent);outline:none}
.lk img,.lk .ph{width:44px;height:62px;border-radius:4px 7px 7px 4px;object-fit:cover;background:var(--line);box-shadow:0 4px 10px -5px rgba(0,0,0,.4)}
.lk .t{font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lk .s{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-msg{font-size:13px;color:var(--ink-3);padding:4px 2px}
.cover-pick{display:flex;gap:12px;align-items:center}
.cover-pick img{width:54px;height:78px;object-fit:cover;border-radius:4px 8px 8px 4px;box-shadow:0 6px 14px -6px rgba(0,0,0,.45)}
.cover .cv-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
img.mini-cover{object-fit:cover}
.scan{position:fixed;inset:0;z-index:120;background:rgba(3,10,18,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px 16px;color:#fff;animation:scanIn .25s both}
.scan-box{position:relative;width:min(560px,100%);aspect-ratio:4/3;border-radius:24px;overflow:hidden;background:#000;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
.scan-box video{width:100%;height:100%;object-fit:cover}
.scan-frame{position:absolute;left:12%;right:12%;top:30%;bottom:30%;border:3px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.scan-frame::after{content:"";position:absolute;left:4%;right:4%;top:50%;height:2px;background:#FF3B30;box-shadow:0 0 12px #FF3B30;animation:laser 1.6s ease-in-out infinite alternate}
@keyframes laser{from{transform:translateY(-30px)}to{transform:translateY(30px)}}
.scan-box.hit .scan-frame{border-color:#34C759;box-shadow:0 0 0 2000px rgba(0,0,0,.35),0 0 30px #34C759}
.scan p{margin:0;text-align:center;max-width:520px;font-size:14.5px;opacity:.9}
.scan-manual{display:flex;gap:8px;width:min(420px,100%)}
.scan-manual input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;padding:0 12px;font:inherit}
.scan .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
@keyframes scanIn{from{opacity:0}to{opacity:1}}
.auth code{font:600 12.5px var(--mono);background:var(--line);padding:1px 6px;border-radius:6px}
/* rapports */
.report-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.rtab{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--glass);border:1px solid var(--line);text-align:left;transition:transform .3s var(--spring),border-color .2s,background .2s}
.rtab:hover{transform:translateY(-2px);border-color:var(--line-2)}
.rtab[aria-pressed="true"]{background:var(--glass-strong);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rtab .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.rtab .ic svg{width:19px;height:19px}
.rtab b{display:block;font-size:14.5px}
.rtab small{display:block;color:var(--ink-3);font-size:12px}
.paper .p-brand{font:800 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:#00AEEF}

/* palette ⌘K */
.palette{position:fixed;inset:0;z-index:70;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.palette .backdrop{opacity:1;animation:none}
.pal{position:relative;width:min(640px,100%);border-radius:22px;background:var(--glass-strong);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);overflow:hidden;animation:pop .35s var(--spring) both}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-8px)}}
.pal-in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;border:0;background:transparent;outline:0;font-size:19px;min-width:0}
.pal-in svg{width:22px;height:22px;color:var(--accent)}
.pal-list{max-height:52vh;overflow-y:auto;padding:8px}
.pal-group{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:10px 10px 4px}
.pal-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:12px;text-align:left}
.pal-item[aria-selected="true"]{background:var(--accent-soft)}
.pal-item .t{font-weight:620}
.pal-item .s{font-size:12.5px;color:var(--ink-3)}
.pal-item .end{margin-left:auto}

/* toasts */
.toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:11px 16px 11px 12px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);font-weight:600;font-size:14px;animation:toastIn .5s var(--spring) both}
.toast .ic{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.toast.err .ic{background:var(--danger-soft);color:var(--danger)}
.toast .ic svg{width:16px;height:16px}
.toast.out{animation:toastOut .3s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.95)}}

/* accueil vide / chargement */
.welcome{display:grid;place-items:center;min-height:60vh}
.welcome .card{max-width:620px;padding:34px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.welcome h2{font-size:34px}
.welcome p{color:var(--ink-2);margin:0;max-width:46ch}
.progress{width:100%;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .2s}
.skeleton{height:120px;border-radius:var(--r-lg);background:linear-gradient(90deg,var(--glass),var(--glass-strong),var(--glass));background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* rapport (papier) */
.paper{background:#fff;color:#0B2235;border-radius:8px;box-shadow:var(--shadow-lg);padding:40px 44px;max-width:860px;width:100%;margin:0 auto;font-size:13px}
.paper h1{font:800 24px var(--display);color:#0B3C5D;letter-spacing:-.01em}
.paper h2{font:700 15px var(--display);color:#0B3C5D;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid #00AEEF}
.paper .p-head{display:flex;gap:18px;align-items:center}
.paper .p-head img{width:70px}
.paper .p-sub{color:#0089BF;font-weight:650;margin-top:2px}
.paper .p-meta{color:#7A8B9A;font-size:12px;margin-top:4px}
.paper .p-bar{height:4px;background:linear-gradient(90deg,#00AEEF 0 70%,#39B54A 70%);margin:16px 0 0;border-radius:2px}
.paper .p-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.paper .p-kpi{border:1px solid #D6E9F3;background:#F7FBFE;border-radius:8px;padding:8px 10px}
.paper .p-kpi span{display:block;font-size:10.5px;color:#7A8B9A;font-weight:650}
.paper .p-kpi b{font:750 19px var(--display);color:#0B3C5D}
.paper table{min-width:0;font-size:12px}
.paper th{background:#0B3C5D;color:#fff;letter-spacing:.02em;text-transform:none;font-size:11px;padding:7px 8px;border:0}
.paper td{padding:6px 8px;border-bottom:1px solid #E3E8EE;color:#1F3346}
.paper tbody tr:hover{background:none}
.paper tfoot td{font-weight:750;background:#E3F6FD;border-top:2px solid #0B3C5D;color:#0B3C5D}
.paper .pill{height:20px;font-size:11px}
.paper .pill.ok{background:#E7F6E9;color:#1E7B34}.paper .pill.warn{background:#FFF4DF;color:#A15C00}.paper .pill.bad{background:#FDECEC;color:#C62828}
.paper .sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:28px}
.paper .sign div{border-bottom:1px solid #7A8B9A;height:70px;font-weight:650;color:#0B3C5D}
.paper .sign small{display:block;color:#7A8B9A;font-weight:400;font-style:italic;margin-top:4px}
.paper .obs{border:1px solid #C9D3DC;border-radius:6px;min-height:80px}
.paper .p-break{break-before:page}
@media (max-width:700px){.paper{padding:22px 18px}.paper .p-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* réglages */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:99px;background:var(--glass-strong);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.chip button:hover{background:var(--danger-soft);color:var(--danger)}
.chip button svg{width:13px;height:13px}
.add-inline{display:flex;gap:8px;margin-top:10px}
.add-inline input{flex:1;height:36px;border-radius:11px;border:1px solid var(--line-2);background:var(--solid);padding:0 12px;min-width:0}

/* mobile */
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = (n, l = 2) => String(n).padStart(l, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const fmtD = s => { if (!s) return "—"; const d = parse(s); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear(); };
const MOIS_C = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const fmtShort = s => { const d = parse(s); return d.getDate() + " " + MOIS_C[d.getMonth()]; };
const fmtLong = s => { const d = parse(s); return JOURS[d.getDay()] + " " + d.getDate() + " " + MOIS[d.getMonth()] + " " + d.getFullYear(); };
const nf = n => new Intl.NumberFormat("fr-FR").format(Math.round(n || 0)).replace(/\u202f/g, "\u00a0");
const fc = n => nf(n) + " FC";
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const initials = s => String(s).replace(/^(M\.|Mme)\s+/, "").split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const COLS = ["livres", "membres", "emprunts", "fournitures", "mouvements"];
const LS_KEY = "kis-bibliotheque-v1";
const S = { livres: [], membres: [], emprunts: [], fournitures: [], mouvements: [], params: null, reservations: [] };
const store = { mode: "loading", db: null, loaded: new Set(), ready: false };

const DESKTOP = window.desktop || null;
function lsRead() { if (DESKTOP) { try { return DESKTOP.load(); } catch { return null; } } try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch { return null; } }
function lsWrite() {
  if (store.mode !== "local") return;
  if (DESKTOP) {
    Promise.resolve(DESKTOP.save(JSON.stringify(S))).then(r => {
      if (!r || r.ok !== false) return;
      toast(r.error || "La modification n'a pas été enregistrée.", true);
      const d = lsRead(); if (!d) return location.reload();
      COLS.forEach(c => S[c] = d[c] || []); S.params = d.params || null; onData(true);
    });
    return;
  } try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch { toast("Impossible d'enregistrer dans ce navigateur", true); } }

async function initStore() {
  if (KIOSK) return kioskBoot();
  if (CLOUD) return cloudBoot();
  if (LOCAL_AUTH) return localBoot();
  let db = null;
  if (window.claude && typeof window.claude.use === "function") { try { db = await window.claude.use("db"); } catch { db = null; } }
  if (db) {
    store.mode = "db"; store.db = db;
    COLS.forEach(c => db.collection(c).onSnapshot(snap => {
      S[c] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      store.loaded.add(c); onData();
    }, e => { store.loaded.add(c); onData(); if (e && e.code !== "not_granted") toast("Synchronisation interrompue : " + e.message, true); }));
    db.doc("config/params").onSnapshot(snap => { S.params = snap.exists ? snap.data() : null; store.loaded.add("params"); onData(); },
      () => { store.loaded.add("params"); onData(); });
  } else {
    store.mode = "local";
    const saved = lsRead();
    if (saved) { Object.assign(S, saved); if (renumberMembers(S)) lsWrite(); }
    store.loaded = new Set([...COLS, "params"]); onData();
  }
}

async function put(col, obj) {
  const i = S[col].findIndex(x => x.id === obj.id);
  if (i >= 0) S[col][i] = obj; else S[col].push(obj);
  onData(true);
  if (store.mode === "cloud") { const { id, ...data } = obj; const { error } = await auth.sb.from(col).upsert({ id, data }); if (error) { toast(cloudError(error), true); cloudResync(col); } }
  else if (store.mode === "db") { const { id, ...data } = obj; try { await store.db.collection(col).doc(id).set(data); } catch (e) { writeError(e); } }
  else lsWrite();
}
async function del(col, id) {
  S[col] = S[col].filter(x => x.id !== id); onData(true);
  if (store.mode === "cloud") { const { error } = await auth.sb.from(col).delete().eq("id", id); if (error) { toast(cloudError(error), true); cloudResync(col); } return; }
  if (store.mode === "db") { try { await store.db.collection(col).doc(id).delete(); } catch (e) { writeError(e); } } else lsWrite();
}
async function saveParams(p) {
  S.params = p; onData(true);
  if (store.mode === "cloud") { const { error } = await auth.sb.from("reglages").upsert({ id: "params", data: p }); if (error) toast(cloudError(error), true); return; }
  if (store.mode === "db") { try { await store.db.doc("config/params").set(p); } catch (e) { writeError(e); } } else lsWrite();
}
function writeError(e) {
  const msg = e && (e.code === "not_granted" || e.code === "revoked") ? "Vous avez un accès en lecture seule : la modification n'a pas été enregistrée."
    : e && e.code === "quota_exceeded" ? "L'espace de stockage est plein : supprimez d'anciens enregistrements."
    : "La modification n'a pas pu être enregistrée. Réessayez.";
  toast(msg, true);
}
async function bulkReplace(data, label) {
  const ops = [];

  const params = { ...(S.params || DEFAULT_PARAMS), ...(data.params || {}), initialized: true };
  if (store.mode === "local") { COLS.forEach(c => S[c] = (data[c] || []).slice()); S.params = params; lsWrite(); onData(true); return; }
  if (store.mode === "cloud") {
    if (!guard("admin")) return;
    const ov = progressOverlay(label); const steps = COLS.length * 2 + 1; let k = 0;
    try {
      for (const c of COLS) { const { error } = await auth.sb.from(c).delete().neq("id", "\u0000"); if (error) throw error; ov.set(++k / steps); }
      for (const c of COLS) { const rows = (data[c] || []).map(({ id, ...d }) => ({ id, data: d }));
        for (let i = 0; i < rows.length; i += 400) { const { error } = await auth.sb.from(c).upsert(rows.slice(i, i + 400)); if (error) throw error; }
        S[c] = (data[c] || []).slice(); ov.set(++k / steps); }
      const { error } = await auth.sb.from("reglages").upsert({ id: "params", data: params }); if (error) throw error;
      S.params = params; ov.close(); onData(true); toast(label.replace("…", "") + " : terminé");
    } catch (e) { ov.close(); toast(cloudError(e), true); COLS.forEach(cloudResync); }
    return;
  }
  const ov = progressOverlay(label);
  let done = 0; const total = ops.length;
  const run = async op => {
    const [kind, c, x] = op;
    try { if (kind === "del") await store.db.collection(c).doc(x).delete(); else { const { id, ...d } = x; await store.db.collection(c).doc(id).set(d); } }
    catch (e) { if (e && (e.code === "resource_exhausted" || e.code === "unavailable")) { await new Promise(r => setTimeout(r, 800)); return run(op); } throw e; }
    ov.set(++done / total);
  };
  try {
    const queue = ops.slice(); const workers = Array.from({ length: 5 }, async () => { while (queue.length) await run(queue.shift()); });
    await Promise.all(workers);
    await store.db.doc("config/params").set(params);
    ov.close(); toast(label.replace("…", "") + " : terminé");
  } catch (e) { ov.close(); writeError(e); }
}

async function cloudBoot() {
  if (!window.supabase || !CLOUD_CFG.supabaseUrl || !CLOUD_CFG.supabaseKey || /VOTRE|xxx/i.test(CLOUD_CFG.supabaseUrl)) return showAuth("config");
  auth.sb = window.supabase.createClient(CLOUD_CFG.supabaseUrl, CLOUD_CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  let recovering = /type=recovery/.test(location.hash);
  auth.sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") { recovering = true; showAuth("newpass"); } });
  const { data } = await auth.sb.auth.getSession();
  if (recovering) return showAuth("newpass");
  if (!data.session) return showAuth("login");
  await afterLogin(data.session.user);
}
async function afterLogin(user) {
  auth.user = user;
  const { data: prof, error } = await auth.sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if (error) return showAuth("login", "") || toast(cloudError(error), true);
  auth.profile = prof || { role: "en_attente", nom: user.email };
  if (["en_attente", "desactive"].includes(roleOf())) return showAuth("pending");
  clearInterval(auth.poll);
  if (roleOf() === "consultation") auth.profile.role = "direction";
  if (shouldIntro() && !store.cloudLoaded) playIntro();   // pendant l'animation, les données se chargent
  hideAuth(); store.mode = "cloud"; applyPerms(); buildNav(); buildAccountNav();
  if (isReader() && !navViews().some(v => v.id === ui.view)) ui.view = readerHome();
  if (!store.cloudLoaded) { store.cloudLoaded = true; await cloudLoad(); } else render();
}
async function cloudFetch(t) {
  let rows = [], from = 0;
  for (;;) {
    const { data, error } = await auth.sb.from(t).select("id,data").order("id").range(from, from + 999);
    if (error) throw error;
    rows = rows.concat(data); if (data.length < 1000) break; from += 1000;
  }
  return rows;
}
async function cloudLoad() {
  try {
    await Promise.all([...COLS, "reglages"].map(async t => {
      const rows = await cloudFetch(t);
      if (t === "reglages") { const p = rows.find(r => r.id === "params"); S.params = p ? p.data : null; store.loaded.add("params"); }
      else { S[t] = rows.map(r => ({ ...r.data, id: r.id })); store.loaded.add(t); }
    }));
  } catch (e) { toast(cloudError(e), true); }
  if (isReader()) await Promise.all([loadDispo(), loadMesRes(), loadReaderExtras(), loadClassData(), loadSocial()]); else await Promise.all([loadReservations(), loadNotes(), loadClassData(), loadSocial()]);
  onData();
  if (can("comptes")) loadAccounts();
  auth.channel = auth.sb.channel("kivutheque").on("postgres_changes", { event: "*", schema: "public" }, payload => {
    const t = payload.table, row = payload.new && payload.new.id ? payload.new : null, oldId = payload.old && payload.old.id;
    if (COLS.includes(t)) {
      if (payload.eventType === "DELETE") S[t] = S[t].filter(x => x.id !== oldId);
      else { const o = { ...row.data, id: row.id }; const i = S[t].findIndex(x => x.id === o.id); if (i >= 0) S[t][i] = o; else S[t].push(o); }
      onData();
      if (t === "emprunts" && isReader()) loadDispo().then(() => onData());
    } else if (t === "reglages" && row && row.id === "params") { S.params = row.data; onData(); }
    else if (t === "reservations") { (isReader() ? Promise.all([loadMesRes(), loadDispo()]) : loadReservations()).then(() => onData()); }
    else if (t === "avis") { Promise.all([isReader() ? loadReaderExtras() : loadNotes(), loadSocial()]).then(() => onData()); }
    else if (["consignes", "consigne_vues", "objectifs_classe"].includes(t)) {
      const fresh = t === "consignes" && payload.eventType === "INSERT" && roleOf() === "eleve" && row && !(store.consignes || []).some(c => c.id === row.id);
      loadClassData().then(() => { onData(); if (fresh && mesConsignes().some(c => c.id === row.id)) { const b = D.livres.get(row.livre); toast(`Nouvelle lecture donnée par ${row.auteur_nom || "ton enseignant"} : « ${b ? b.titre : ""} »`); } }); }
    else if (t === "profiles") {
      if (row && row.id === auth.user.id) {
        const changed = row.role !== roleOf(), clsChanged = JSON.stringify(row.classes || []) !== JSON.stringify(auth.profile.classes || []); auth.profile = { ...auth.profile, ...row };
        if (clsChanged && roleOf() === "enseignant") { Promise.all([cloudResync("membres"), cloudResync("emprunts"), loadClassData()]).then(() => { toast("Vos classes ont été mises à jour par l'administrateur"); onData(); }); }
        if (changed) { if (["en_attente", "desactive"].includes(row.role)) return showAuth("pending"); location.reload(); return; }
        buildAccountNav(); render();
      }
      if (can("comptes")) loadAccounts();
    }
  }).subscribe();
}

/* ---------- le son de l'ouverture (« ta-dum » composé ici, sans fichier) ---------- */
const soundOn = () => { try { return localStorage.getItem("kiv-son") !== "0"; } catch { return true; } };
let introAC = null;
/* à appeler pendant un clic : les navigateurs n'autorisent le son qu'après un geste */
function unlockAudio() {
  if (!soundOn()) return;
  try { const A = window.AudioContext || window.webkitAudioContext; if (!A) return; introAC = introAC || new A(); if (introAC.state !== "running") introAC.resume(); } catch {}
}
function introSound(ac, out, t0) {
  const noise = sec => { const b = ac.createBuffer(1, Math.ceil(ac.sampleRate * sec), ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; };
  /* réverbération douce : une queue de bruit qui s'éteint */
  const verb = ac.createConvolver(), ir = ac.createBuffer(2, ac.sampleRate * 2.6, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.6); }
  verb.buffer = ir; const wet = ac.createGain(); wet.gain.value = .32; verb.connect(wet).connect(out);
  const bus = ac.createGain(); bus.connect(out); bus.connect(verb);
  const env = (g, t, a, peak, d, end = 0.0001) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(end, t + a + d); };
  /* coup grave : sinus qui plonge, avec un peu de bruit pour l'attaque */
  const hit = (t, f0, f1, peak, dur) => {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur * .6);
    env(g, t, .006, peak, dur); o.connect(g).connect(bus); o.start(t); o.stop(t + dur + .05);
    const n = ac.createBufferSource(), nf = ac.createBiquadFilter(), ng = ac.createGain(); n.buffer = noise(.2); nf.type = "lowpass"; nf.frequency.value = 900;
    env(ng, t, .002, peak * .35, .12); n.connect(nf).connect(ng).connect(bus); n.start(t);
  };
  hit(t0 + .42, 140, 70, .55, .32);           // « ta »
  hit(t0 + .62, 120, 42, 1, 1.1);              // « dum »
  /* accord qui s'ouvre (do majeur 9) : dents de scie légèrement désaccordées, filtre qui s'ouvre */
  const lp = ac.createBiquadFilter(), cg = ac.createGain(); lp.type = "lowpass"; lp.Q.value = 3;
  lp.frequency.setValueAtTime(220, t0 + .6); lp.frequency.exponentialRampToValueAtTime(2600, t0 + 1.7); lp.frequency.exponentialRampToValueAtTime(700, t0 + 3.4);
  cg.gain.setValueAtTime(0.0001, t0 + .6); cg.gain.exponentialRampToValueAtTime(.16, t0 + .85); cg.gain.setValueAtTime(.16, t0 + 2.2); cg.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.6);
  lp.connect(cg).connect(bus);
  [65.41, 130.81, 196, 261.63, 329.63, 392, 587.33].forEach((f, i) => [-6, 6].forEach(cents => {
    const o = ac.createOscillator(); o.type = i < 2 ? "triangle" : "sawtooth"; o.frequency.value = f; o.detune.value = cents;
    const g = ac.createGain(); g.gain.value = i < 2 ? .5 : .22; o.connect(g).connect(lp); o.start(t0 + .6); o.stop(t0 + 3.7);
  }));
  /* petites notes cristallines pendant que les lettres montent */
  [1046.5, 1318.5, 1568, 2093, 1568, 2637, 2093, 3136, 2637, 3520].forEach((f, i) => {
    const t = t0 + 1.08 + i * .055, o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.value = f;
    env(g, t, .004, .05, .5); o.connect(g).connect(bus); o.start(t); o.stop(t + .6);
  });
  /* souffle du zoom final */
  const w = ac.createBufferSource(), bp = ac.createBiquadFilter(), wg = ac.createGain(); w.buffer = noise(1.1); bp.type = "bandpass"; bp.Q.value = 1.2;
  bp.frequency.setValueAtTime(300, t0 + 2.55); bp.frequency.exponentialRampToValueAtTime(5000, t0 + 3.4);
  wg.gain.setValueAtTime(0.0001, t0 + 2.55); wg.gain.exponentialRampToValueAtTime(.4, t0 + 3.2); wg.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.55);
  w.connect(bp).connect(wg).connect(bus); w.start(t0 + 2.55);
  hit(t0 + 3.3, 90, 40, .45, .6);              // petit impact quand les bandes arrivent
}
/* joue le son en direct ; renvoie une fonction pour couper */
function playIntroSound() {
  if (!soundOn() || !introAC || introAC.state !== "running") return () => {};
  const master = introAC.createGain(), comp = introAC.createDynamicsCompressor(); master.gain.value = .7;
  master.connect(comp).connect(introAC.destination);
  try { introSound(introAC, master, introAC.currentTime + .05); } catch {}
  return () => { try { master.gain.setTargetAtTime(0, introAC.currentTime, .08); } catch {} };
}

/* ============================================================ ouverture animée (motion design) et choix du profil
   Une fois par visite : le logo s'anime comme à l'ouverture de Netflix, puis « Qui lit aujourd'hui ? ». */

    <div class="in-profiles" hidden>
      <h1>Qui lit aujourd'hui ?</h1>
      <div class="in-plist">
        <button class="in-prof" type="button" id="inMe"><span class="in-av">${personAvatar({ ...P, id: (auth.user || {}).id || "moi" }, "in-img")}</span><b>${esc(prenom)}</b><small>${esc(role)}</small></button>
        <button class="in-prof other" type="button" id="inOut"><span class="in-av">${ic("logout")}</span><b>Changer de compte</b><small>Se déconnecter</small></button>
      </div>
      <p class="in-hint">Clique sur ton profil pour accéder à ta bibliothèque</p>
      <button class="in-manage" type="button" id="inManage">Gérer mon profil</button>
    </div>
    <button class="in-skip" type="button" id="inSkip">Passer ›</button>
    <button class="in-sound" type="button" id="inSound" aria-label="Son" title="Activer ou couper le son">${ic(soundOn() ? "sound" : "mute")}</button>
    <button class="in-tap" type="button" id="inTap" hidden><img src="${LOGO_HD}" alt=""><span>Touche l'écran pour entrer</span></button>`;
  document.body.appendChild(el);
  return new Promise(resolve => {
    const timers = [], showProfiles = () => {
      timers.forEach(clearTimeout); if (el.classList.contains("choose")) return;
      el.classList.add("choose"); $(".in-profiles", el).hidden = false; $("#inSkip", el).hidden = true; setTimeout(() => $("#inMe", el).focus(), 400);
    };
    const enter = then => {
      if (el.classList.contains("leaving")) return;
      const tile = $("#inMe .in-av", el), r = tile.getBoundingClientRect();
      el.style.setProperty("--zx", (innerWidth / 2 - (r.left + r.width / 2)) + "px"); el.style.setProperty("--zy", (innerHeight / 2 - (r.top + r.height / 2)) + "px");
      el.classList.add("leaving");
      setTimeout(() => { el.remove(); resolve(); if (then) then(); }, reduced ? 50 : 900);
    };
    $("#inSkip", el).onclick = showProfiles;
    $("#inMe", el).onclick = () => enter();
    $("#inManage", el).onclick = () => enter(() => setTimeout(profileSheet, 100));
    $("#inOut", el).onclick = () => { el.remove(); try { sessionStorage.removeItem("kiv-intro"); } catch {} signOut(); };
    el.addEventListener("keydown", e => { if (e.key === "Escape") { e.stopPropagation(); el.classList.contains("choose") ? enter() : showProfiles(); } });
    let stopSound = () => {};
    const start = () => {
      $("#inTap", el).hidden = true; stopSound = playIntroSound();
      if (reduced) return showProfiles();
      requestAnimationFrame(() => el.classList.add("play"));
      timers.push(setTimeout(() => el.classList.add("zoom"), 2700), setTimeout(showProfiles, 3500));
    };
    const snd = $("#inSound", el); snd.onclick = () => { const on = !soundOn(); try { localStorage.setItem("kiv-son", on ? "1" : "0"); } catch {} snd.innerHTML = ic(on ? "sound" : "mute"); if (!on) stopSound(); };
    const oldSkip = showProfiles; $("#inSkip", el).onclick = () => { stopSound(); oldSkip(); };
    /* le navigateur bloque le son tant qu'on n'a pas cliqué : on propose alors de toucher l'écran, comme sur une télévision */
    if (soundOn() && !reduced && (!introAC || introAC.state !== "running")) {
      const tap = $("#inTap", el); tap.hidden = false; el.classList.add("waiting"); tap.focus();
      tap.onclick = () => { el.classList.remove("waiting"); unlockAudio(); setTimeout(start, 60); };
    } else start();
  });
}

/* fiches de membre les plus proches d'une demande (nom, classe, e-mail) */
function memberMatches(p) {
  const linked = new Set(auth.accounts.filter(a => a.membre_id).map(a => a.membre_id));
  const toks = norm(p.nom).split(/\s+/).filter(t => t.length > 1);
  return S.membres.filter(m => !linked.has(m.id)).map(m => {
    const words = norm(m.nom).replace(/^(m\.|mme)\s+/, "").split(/\s+/), hit = toks.filter(t => words.includes(t)).length;
    let sc = hit * 2; if (p.classe && norm(m.classe) === norm(p.classe)) sc += 1;
    const sure = (m.email && norm(m.email) === norm(p.email)) || (toks.length >= 2 && hit === toks.length);  // même e-mail, ou nom complet identique
    if (sure) sc += 10;
    return [m, sc];
  }).sort((a, b) => b[1] - a[1] || a[0].nom.localeCompare(b[0].nom, "fr"));
}
const since = iso => { const d = diffDays(todayISO(), String(iso).slice(0, 10)); return d <= 0 ? "aujourd'hui" : d === 1 ? "hier" : `il y a ${d} jours`; };

    return `<div class="pend-row${mine ? "" : " muted"}">${personAvatar(p)}<div class="pend-who"><div class="t">${esc(p.nom || "")}</div><div class="s">${esc(p.email)} · ${since(p.created_at)}</div>

  };

}
async function acceptAccount(id, role) {
  const p = auth.accounts.find(x => x.id === id); if (!p) return;
  let membre = null;
  if (READER_ROLES.includes(role)) {
    const sel = $("#lk-" + id); membre = sel ? sel.value : "new";
    if (membre === "new") {
      const fiche = { nom: p.nom, type: role === "enseignant" ? "Enseignant" : "Élève", classe: role === "enseignant" ? "Personnel" : (p.classe || ""), sexe: "", inscription: todayISO(), email: p.email };
      const { data, error } = await auth.sb.rpc("kiv_nouveau_membre", { fiche });
      if (error) return toast(cloudError(error), true);
      membre = data;
    }
  }
  const { error } = await auth.sb.rpc("kiv_valider", { target: id, new_role: role, membre });
  if (error) return toast(cloudError(error), true);
  if (role === "enseignant" && roleOf() === "admin" && (p.classes_demande || []).length) {

  openSheet("Mon profil", `
    <div class="prof-head"><div id="pfPrev">${personAvatar({ ...P, id: auth.user.id }, "avatar xl")}</div>

    <div class="f"><label for="pf-nom">Nom affiché</label><input id="pf-nom" value="${esc(P.nom || "")}" maxlength="80"></div>
    <div class="recap" style="border-style:solid"><div>Compte : <b>${esc(auth.user.email)}</b></div><div>Rôle : <b>${esc(ROLES[roleOf()][0])}</b>${P.membre_id ? ` · carte <b>${esc(P.membre_id)}</b>` : ""}</div></div>
    <details class="pf-pass"><summary>Changer de mot de passe</summary>
      <div class="f2" style="margin-top:10px"><div class="f"><label for="pf-p1">Nouveau mot de passe</label><input id="pf-p1" type="password" autocomplete="new-password" minlength="6"></div>
      <div class="f"><label for="pf-p2">Confirmer</label><input id="pf-p2" type="password" autocomplete="new-password" minlength="6"></div></div></details>`,
    `<button class="btn ghost" type="button" data-close2>Annuler</button><button class="btn primary" type="button" id="pfSave">${ic("check")}Enregistrer</button>`,
    el => {
      const cv = $("#pfCanvas", el), ctx = cv.getContext("2d");
      const clamp = () => { const s = zoom * Math.max(cv.width / img.width, cv.height / img.height), w = img.width * s, h = img.height * s;
        ox = Math.min(0, Math.max(cv.width - w, ox)); oy = Math.min(0, Math.max(cv.height - h, oy)); return [s, w, h]; };
      const draw = () => { if (!img) return; const [, w, h] = clamp(); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, ox, oy, w, h); };
      const exportPhoto = () => { const out = document.createElement("canvas"); out.width = out.height = 192; const k = 192 / cv.width, [, w, h] = clamp(); const c = out.getContext("2d");
        c.fillStyle = "#fff"; c.fillRect(0, 0, 192, 192); c.imageSmoothingQuality = "high"; c.drawImage(img, ox * k, oy * k, w * k, h * k);
        let q = .86, d = out.toDataURL("image/jpeg", q); while (d.length > 60000 && q > .4) d = out.toDataURL("image/jpeg", q -= .12); return d; };
      const preview = () => { photo = exportPhoto(); changed = true; $("#pfPrev", el).innerHTML = `<img class="avatar xl" src="${photo}" alt="">`; $("#pfRm", el).hidden = false; };
      $("#pfFile", el).onchange = () => { const f = $("#pfFile", el).files[0]; if (!f) return; if (!/^image\//.test(f.type)) return toast("Choisis une image (JPEG, PNG…)", true);
        const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { img = im; zoom = 1; $("#pfZoom", el).value = 1; const s = Math.max(cv.width / im.width, cv.height / im.height); ox = (cv.width - im.width * s) / 2; oy = (cv.height - im.height * s) / 2; $("#pfCrop", el).hidden = false; draw(); preview(); };
          im.onerror = () => toast("Cette image ne peut pas être lue. Essaie une photo JPEG ou PNG.", true); im.src = r.result; }; r.readAsDataURL(f); };
      $("#pfZoom", el).oninput = e => { const [s0] = clamp(); const cx = cv.width / 2, cy = cv.height / 2; const before = zoom; zoom = +e.target.value; const k = zoom / before; ox = cx - (cx - ox) * k; oy = cy - (cy - oy) * k; draw(); preview(); };
      let drag = null;
      cv.addEventListener("pointerdown", e => { if (!img) return; drag = [e.clientX, e.clientY, ox, oy]; cv.setPointerCapture(e.pointerId); });
      cv.addEventListener("pointermove", e => { if (!drag) return; const r = cv.getBoundingClientRect(), k = cv.width / r.width; ox = drag[2] + (e.clientX - drag[0]) * k; oy = drag[3] + (e.clientY - drag[1]) * k; draw(); });
      cv.addEventListener("pointerup", () => { if (drag) { drag = null; preview(); } });
      $("#pfRm", el).onclick = () => { photo = ""; changed = true; img = null; $("#pfCrop", el).hidden = true; $("#pfRm", el).hidden = true; $("#pfPrev", el).innerHTML = personAvatar({ ...P, avatar: "", id: auth.user.id }, "avatar xl"); };
      $("[data-close2]", el).onclick = () => closeSheet();
      $("#pfAva", el).onclick = () => avatarPicker(setAvatar);
      $("#pfSave", el).onclick = async () => {
        clearErr(el);
        const p1 = $("#pf-p1", el).value, nom = $("#pf-nom", el).value.trim();
        if (!nom) return fieldErr(el, "pf-nom", "Indique ton nom.");
        if (p1 && p1.length < 6) { $("details", el).open = true; return fieldErr(el, "pf-p1", "Au moins 6 caractères."); }
        if (p1 && p1 !== $("#pf-p2", el).value) { $("details", el).open = true; return fieldErr(el, "pf-p2", "Les deux mots de passe sont différents."); }
        $("#pfSave", el).disabled = true;
        const { error } = await auth.sb.rpc("kiv_mon_profil", { nom, avatar: changed ? photo : null });
        if (!error && p1) { const r = await auth.sb.auth.updateUser({ password: p1 }); if (r.error) { $("#pfSave", el).disabled = false; return toast(cloudError(r.error), true); } }
        $("#pfSave", el).disabled = false;
        if (error) return toast(cloudError(error), true);
        auth.profile = { ...auth.profile, nom, avatar: changed ? (photo || null) : auth.profile.avatar };
        closeSheet(); toast("Profil enregistré"); buildAccountNav(); if (can("comptes")) loadAccounts(); else render();
      };
    });
}

/* ============================================================ défis de lecture, badges, notes, recommandations */
/* trimestres de l'année scolaire « 2026-2027 » : sept.–déc., janv.–mars, avril–juillet */
function trimestres() {
  const y = parseInt(String(params().annee || "").slice(0, 4), 10) || new Date().getFullYear();
  return [{ n: 1, nom: "1er trimestre", debut: `${y}-09-01`, fin: `${y}-12-31` }, { n: 2, nom: "2e trimestre", debut: `${y + 1}-01-01`, fin: `${y + 1}-03-31` }, { n: 3, nom: "3e trimestre", debut: `${y + 1}-04-01`, fin: `${y + 1}-07-31` }];
}
function trimCourant() { const T = todayISO(), ts = trimestres(); return ts.find(t => T >= t.debut && T <= t.fin) || (T < ts[0].debut ? ts[0] : ts[2]); }
const objectif = classe => (classe && store.objClasses && store.objClasses.get(classe)) || Math.max(1, +(params().objectif ?? 3));
const shortName = n => { const w = String(n || "").replace(/^(M\.|Mme)\s+/, "").trim().split(/\s+/); return w.length > 1 ? `${w[0]} ${w[w.length - 1][0]}.` : w[0] || ""; };

/* badges gagnés par un lecteur, à partir de ses emprunts */
function badgesFor(loans, nbNotes = 0, nbClubs = 0) {
  const lus = loans.filter(e => e.retour), cats = new Set(lus.map(e => e.b && e.b.categorie).filter(Boolean));
  const aLHeure = lus.filter(e => e.retour <= e.prevu).length, mois = new Set(lus.map(e => e.retour.slice(0, 7)));
  const months = [...mois].sort(); let suite = 0, best = 0, prev = null;
  months.forEach(m => { const [y, mo] = m.split("-").map(Number); const k = y * 12 + mo; suite = prev !== null && k === prev + 1 ? suite + 1 : 1; best = Math.max(best, suite); prev = k; });
  const B = [
    ["premier", "Premier livre", "Rendre son premier livre", "book", lus.length, 1],
    ["lecteur", "Lecteur", "5 livres lus", "trend", lus.length, 5],
    ["grand", "Grand lecteur", "10 livres lus", "trophy", lus.length, 10],
    ["devoreur", "Dévoreur de livres", "25 livres lus", "spark", lus.length, 25],
    ["explorateur", "Explorateur", "Lire 5 genres différents", "globe", cats.size, 5],
    ["ponctuel", "Toujours à l'heure", "Rendre 5 livres à temps", "clock", aLHeure, 5],
    ["fidele", "Fidèle", "Lire chaque mois, 3 mois de suite", "check", best, 3],
    ["critique", "Critique", "Noter 5 livres", "star", nbNotes, 5],
    ["club", "Club de lecture", "Rejoindre un club de lecture", "users", nbClubs, 1],
  ];
  return B.map(([id, label, desc, icon, have, need]) => ({ id, label, desc, icon, have: Math.min(have, need), need, got: have >= need }));
}
const badgeHTML = b => `<div class="badge${b.got ? " got" : ""}" title="${esc(b.desc)}"><span class="badge-ic">${ic(b.icon)}</span><b>${esc(b.label)}</b><small>${b.got ? esc(b.desc) : `${b.have} / ${b.need} · ${esc(b.desc)}`}</small></div>`;

/* classement local (personnel, logiciel de bureau) : tout est déjà sur l'ordinateur */
function classementLocal(t) {
  const base = [...D.membres.values()].filter(m => (m.type || "Élève") === "Élève").map(m => ({ membre: m.id, nom: m.nom, classe: m.classe || "", lus: D.emprunts.filter(e => e.membre === m.id && e.retour && e.retour >= t.debut && e.retour <= t.fin).length }));
  const rank = (arr, key) => { const s = arr.slice().sort((a, b) => b.lus - a.lus); s.forEach((x, i) => x[key] = i && s[i - 1].lus === x.lus ? s[i - 1][key] : i + 1); };
  rank(base, "rang_ecole"); const byC = {}; base.forEach(x => (byC[x.classe] = byC[x.classe] || []).push(x)); Object.values(byC).forEach(a => rank(a, "rang_classe"));
  return base;
}
async function loadClassement(t) {
  if (!isReader()) { store.classement = { t: t.n, rows: classementLocal(t) }; return; }
  const { data, error } = await auth.sb.rpc("kiv_classement", { debut: t.debut, fin: t.fin });
  store.classement = { t: t.n, rows: error ? [] : data };
}
async function loadReaderExtras() {
  const [n, a, pm, tp] = await Promise.all([auth.sb.rpc("kiv_notes"), auth.sb.from("avis").select("*"), auth.sb.rpc("kiv_pour_moi"), auth.sb.rpc("kiv_top_semaine")]);
  store.top7 = (tp && tp.data) || [];
  store.notes = new Map(((n && n.data) || []).map(r => [r.livre, r]));
  store.mesNotes = new Map(((a && a.data) || []).filter(r => r.membre === auth.profile.membre_id).map(r => [r.livre, r.note]));
  store.mesAvis = new Map(((a && a.data) || []).filter(r => r.membre === auth.profile.membre_id).map(r => [r.livre, r]));
  store.pourMoi = new Map(((pm && pm.data) || []).map(r => [r.livre, r.score]));
}

const starsHTML = (v, size = "") => `<span class="stars ${size}" aria-label="${v} sur 5">${[1, 2, 3, 4, 5].map(i => `<i class="${v >= i - .25 ? "on" : v >= i - .75 ? "half" : ""}">★</i>`).join("")}</span>`;
const noteOf = id => store.notes && store.notes.get(id);
/* « les lecteurs de ce livre ont aussi lu » : en ligne pour un lecteur, calculé sur place pour le personnel */
async function aussiLu(id) {
  if (isReader()) { const { data } = await auth.sb.rpc("kiv_aussi_lu", { livre: id }); return (data || []).map(r => D.livres.get(r.livre_id)).filter(Boolean); }
  const readers = new Set(D.emprunts.filter(e => e.livre === id).map(e => e.membre)), c = {};
  D.emprunts.forEach(e => { if (e.livre !== id && readers.has(e.membre)) (c[e.livre] = c[e.livre] || new Set()).add(e.membre); });
  return Object.entries(c).sort((a, b) => b[1].size - a[1].size).slice(0, 12).map(([l]) => D.livres.get(l)).filter(Boolean);
}

/* ---------- diplôme de lecture (PDF, A4 paysage, une page par élève) ---------- */
function diplomasPDF(list, t) {
  if (!list.length) return;
  if (!window.jspdf || !window.jspdf.jsPDF) return toast("Le module PDF n'a pas pu être chargé.", true);
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: "mm", format: "a4", orientation: "landscape" });
  const W = 297, H = 210, NAVY = [11, 60, 93], BLUE = [0, 150, 214], GREEN = [46, 158, 69], GOLD = [201, 150, 30], MUTED = [110, 128, 145], p = params();
  list.forEach((r, i) => {
    if (i) doc.addPage();
    doc.setFillColor(250, 252, 255); doc.rect(0, 0, W, H, "F");
    doc.setDrawColor(...BLUE); doc.setLineWidth(2.2); doc.rect(9, 9, W - 18, H - 18);
    doc.setDrawColor(...GREEN); doc.setLineWidth(.6); doc.rect(13, 13, W - 26, H - 26);
    doc.setFillColor(...BLUE); doc.triangle(9, 9, 46, 9, 9, 46, "F"); doc.setFillColor(...GREEN); doc.triangle(W - 9, H - 9, W - 46, H - 9, W - 9, H - 46, "F");
    try { doc.addImage(LOGO, "PNG", W / 2 - 11, 20, 22, 22 * 213 / 180); } catch {}
    doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(...BLUE); doc.text(pdfSafe(p.ecole.toUpperCase()), W / 2, 52, { align: "center" });

const weekStart = iso => { const d = parse(iso); const k = (d.getDay() + 6) % 7; return addDays(iso, -k); };
function readingWeeks(loans) {
  const T = todayISO(), weeks = new Set();
  loans.forEach(e => { let w = weekStart(e.date); const end = e.retour || T; while (w <= end) { weeks.add(w); w = addDays(w, 7); } });
  return weeks;
}
function streakOf(loans) {
  const weeks = readingWeeks(loans), cur = weekStart(todayISO());
  let w = weeks.has(cur) ? cur : addDays(cur, -7), n = 0;
  while (weeks.has(w)) { n++; w = addDays(w, -7); }
  const sorted = [...weeks].sort(); let best = 0, run = 0, prev = null;
  sorted.forEach(x => { run = prev && addDays(prev, 7) === x ? run + 1 : 1; best = Math.max(best, run); prev = x; });
  return { current: n, best };
}

/* ============================================================ étape 5 : retours (état du livre), rappels par e-mail, bons de commande */
/* ---------- retour d'un livre : état, frais, amende ---------- */
function doReturn(id) {
  if (!guard("biblio")) return;
  const e = S.emprunts.find(x => x.id === id); if (!e) return;
  const fromPicker = ui.returning && sheetEl;
  const p = params(), prevu = e.prevu || addDays(e.date, p.duree), jours = Math.max(0, diffDays(todayISO(), prevu)), retard = jours * p.amende;
  const b = S.livres.find(x => x.id === e.livre), m = S.membres.find(x => x.id === e.membre), prix = +(b && b.prix) || 0;
  let etat = "bon";
  const fraisFor = k => k === "perdu" ? prix : k === "abime" ? (prix ? Math.round(prix * .25 / 100) * 100 : +(p.fraisAbime || 0)) : 0;
  const finish = (paye, frais) => {
    put("emprunts", { ...e, retour: todayISO(), paye: paye || (!retard && !frais), etat, frais: frais || 0 });
    if (etat === "perdu" && b) put("livres", { ...b, ex: Math.max(0, (+b.ex || 0) - 1), perdus: (+b.perdus || 0) + 1 });
    toast(etat === "perdu" ? `Livre perdu enregistré · ${fc(retard + frais)} à payer` : etat === "abime" ? `Retour enregistré · livre abîmé${frais ? " · " + fc(frais) : ""}` : jours ? `Retour enregistré · ${jours} j de retard` : "Retour enregistré · merci !");
    const waiting = etat !== "perdu" && (S.reservations || []).some(r => r.livre === e.livre && r.statut === "attente");
    if (waiting) { closeSheet(true); setTimeout(() => reservedAlert(e.livre), 120); } else if (fromPicker) returnPicker(); else closeSheet();
  };
  const ETATS = [["bon", "Bon état", "check", "Comme avant le prêt"], ["abime", "Abîmé", "alert", "Pages déchirées, taches, couverture…"], ["perdu", "Perdu", "x", "Le livre ne reviendra pas"]];
  openSheet("Retour du livre", `<div class="recap" style="border-style:solid"><div><b>${esc(b ? b.titre : e.livre)}</b> rendu par <b>${esc(m ? m.nom : e.membre)}</b></div>
      <div>${jours ? `${jours} jour${jours > 1 ? "s" : ""} de retard · amende de <b>${fc(retard)}</b>` : "Rendu à temps"}</div></div>
    <div class="f"><label>État du livre</label><div class="etat-pick">${ETATS.map(([k, l, i, d]) => `<button type="button" data-etat="${k}" aria-pressed="${k === "bon"}"><span class="ep-ic">${ic(i)}</span><b>${l}</b><small>${d}</small></button>`).join("")}</div></div>
    <div class="f" id="fraisF" hidden><label for="r-frais">Frais à payer (FC)</label><input id="r-frais" type="number" inputmode="numeric" min="0" step="500"><span class="form-note" id="fraisHint" style="margin:0"></span></div>
    <div id="rTotal"></div>`,
    `<button class="btn ghost" type="button" id="later">Payer plus tard</button><button class="btn primary" type="button" id="paid">${ic("check")}Enregistrer le retour</button>`,
    el => {
      const frais = () => Math.max(0, +$("#r-frais", el).value || 0);
      const sync = () => {
        $("#fraisF", el).hidden = etat === "bon";
        $("#fraisHint", el).textContent = etat === "perdu" ? (prix ? `Prix de remplacement indiqué sur la fiche du livre : ${fc(prix)}. Un exemplaire sera retiré du catalogue.` : "Aucun prix sur la fiche du livre : indiquez le prix de remplacement. Un exemplaire sera retiré du catalogue.")
          : etat === "abime" ? (prix ? `Proposé : un quart du prix du livre (${fc(prix)}). Modifiable.` : "Montant libre (0 si rien à payer).") : "";
        const tot = retard + (etat === "bon" ? 0 : frais());
        $("#rTotal", el).innerHTML = tot ? `<div class="nf-status warn">${ic("coin")}<span>Total à payer : <b>${fc(tot)}</b>${retard && etat !== "bon" && frais() ? ` (retard ${fc(retard)} + ${etat === "perdu" ? "remplacement" : "dégâts"} ${fc(frais())})` : ""}</span></div>` : "";
        $("#later", el).hidden = !tot; $("#paid", el).innerHTML = ic(tot ? "coin" : "check") + (tot ? "Encaissé" : "Enregistrer le retour");
      };
      $$("[data-etat]", el).forEach(x => x.onclick = () => { etat = x.dataset.etat; $$("[data-etat]", el).forEach(y => y.setAttribute("aria-pressed", y === x)); $("#r-frais", el).value = fraisFor(etat) || ""; sync(); if (etat !== "bon") $("#r-frais", el).focus(); });
      $("#r-frais", el).oninput = sync;
      $("#later", el).onclick = () => finish(false, etat === "bon" ? 0 : frais());
      $("#paid", el).onclick = () => finish(true, etat === "bon" ? 0 : frais());
      sync(); setTimeout(() => $("#paid", el).focus(), 60);
    });
}

const emailOf = id => { const a = (auth.accounts || []).find(x => x.membre_id === id); return (a && a.email) || ((D.membres.get(id) || {}).email) || ""; };
function lateMail(m, loans) {

  const body = `Bonjour ${prenom},\n\nLa bibliothèque te rappelle que ${n > 1 ? "ces livres sont" : "ce livre est"} en retard :\n`
    + loans.map(e => `• « ${e.b ? e.b.titre : e.livre} » : emprunté le ${fmtD(e.date)}, à rendre le ${fmtD(e.prevu)} (${e.jours} jour${e.jours > 1 ? "s" : ""} de retard)`).join("\n")
    + `\n\nMerci de ${n > 1 ? "les" : "le"} rapporter le plus vite possible.${tot ? `\nAmende à ce jour : ${fc(tot).replace(/ | /g, " ")}.` : ""}\n\nÀ bientôt,\nLa bibliothèque de ${p.ecole}`;
  return { subject, body };
}

          <div class="s" style="white-space:normal">${r.loans.map(e => `« ${esc(e.b ? e.b.titre : e.livre)} » · ${e.jours} j`).join(" · ")}</div>
          <div class="s">${r.email ? esc(r.email) : '<span style="color:var(--warn)">Pas d\'e-mail : pas encore de compte. À prévenir de vive voix.</span>'}${sent ? ` · rappel envoyé ${sent === T ? "aujourd'hui" : "le " + fmtD(sent)}` : ""}</div></div>
        <div class="rem-act">${r.email ? `<button class="btn sm primary" type="button" data-gmail="${esc(r.m.id)}">${ic("mail")}Gmail</button><button class="btn sm ghost" type="button" data-mailto="${esc(r.m.id)}" title="Ouvrir avec la messagerie de l'ordinateur">Autre</button>` : ""}</div></div>`; }).join("") || '<div class="empty">Aucun livre en retard. Bravo !</div>'}</div>

/* ---------- bon de commande des fournitures (PDF par fournisseur) ---------- */
function orderSheet() {

  const supplier = f => (f.fournisseur || "").trim() || "Fournisseur non précisé";

    const groups = new Map(); items.forEach(f => { const k = supplier(f); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(f); });
    const order = [...groups.entries()].sort((a, b) => b[1].filter(f => sel.has(f.id)).length - a[1].filter(f => sel.has(f.id)).length || a[0].localeCompare(b[0], "fr"));
    $("#poBody", el).innerHTML = order.map(([k, fs]) => { const tot = fs.filter(f => sel.has(f.id)).reduce((a, f) => a + sel.get(f.id) * (+f.prix || 0), 0), n = fs.filter(f => sel.has(f.id)).length;
      return `<div class="po-group${n ? "" : " empty-g"}"><div class="po-h"><b>${esc(k)}</b><span class="s">${n ? `${n} article${n > 1 ? "s" : ""} · ${fc(tot)}` : "rien à commander"}</span>${n ? `<button class="btn sm ghost" type="button" data-po-pdf="${esc(k)}" style="margin-left:auto">${ic("down")}PDF</button>` : ""}</div>
        ${fs.map(f => `<label class="po-row${sel.has(f.id) ? " on" : ""}"><input type="checkbox" data-po="${esc(f.id)}" ${sel.has(f.id) ? "checked" : ""}><span class="po-art"><b>${esc(f.article)}</b><small>stock ${f.stock} · seuil ${f.seuil} · ${fc(f.prix)} / ${esc(String(f.unite).toLowerCase())}</small></span>${etatPill(f)}
          <input type="number" min="1" step="1" inputmode="numeric" class="po-q" data-po-q="${esc(f.id)}" value="${sel.has(f.id) ? sel.get(f.id) : Math.max(1, (+f.seuil || 0) * 2 - f.stock)}" ${sel.has(f.id) ? "" : "disabled"} aria-label="Quantité de ${esc(f.article)}"></label>`).join("")}</div>`; }).join("");
    $$("[data-po]", el).forEach(c => c.onchange = () => { const f = items.find(x => x.id === c.dataset.po); if (c.checked) sel.set(f.id, Math.max(1, +$(`[data-po-q="${CSS.escape(f.id)}"]`, el).value || 1)); else sel.delete(f.id); draw(el); });
    $$("[data-po-q]", el).forEach(i => i.onchange = () => { if (sel.has(i.dataset.poQ)) { sel.set(i.dataset.poQ, Math.max(1, +i.value || 1)); draw(el); } });
    $$("[data-po-pdf]", el).forEach(b => b.onclick = () => orderPDF([[b.dataset.poPdf, groups.get(b.dataset.poPdf).filter(f => sel.has(f.id))]], sel));
    const all = order.map(([k, fs]) => [k, fs.filter(f => sel.has(f.id))]).filter(([, fs]) => fs.length);
    $("#poAll", el).disabled = !all.length; $("#poAll", el).onclick = () => orderPDF(all, sel);
  };
  openSheet("Bon de commande", `<p class="form-note block" style="margin:0">Les articles sous le seuil d'alerte sont déjà cochés, avec une quantité proposée (deux fois le seuil, moins le stock). Ajustez puis téléchargez un bon par fournisseur.</p><div id="poBody" class="po-body"></div>`,
    `<button class="btn ghost" type="button" data-close2>Fermer</button><button class="btn primary" type="button" id="poAll">${ic("down")}Tous les bons (PDF)</button>`, el => { $("[data-close2]", el).onclick = () => closeSheet(); draw(el); });
}
function orderPDF(groups, sel) {
  if (!window.jspdf || !window.jspdf.jsPDF) return toast("Le module PDF n'a pas pu être chargé.", true);
  const { jsPDF } = window.jspdf, doc = new jsPDF({ unit: "mm", format: "a4" }), p = params(), NAVY = [11, 60, 93], BLUE = [0, 150, 214], MUTED = [110, 128, 145];
  const d = todayISO().replace(/-/g, "");
  groups.forEach(([four, fs], i) => {
    if (i) doc.addPage();
    try { doc.addImage(LOGO, "PNG", 16, 12, 16, 16 * 213 / 180); } catch {}
    doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(...NAVY); doc.text("BON DE COMMANDE", 194, 20, { align: "right" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...MUTED);
    doc.text(pdfSafe(`N° BC-${d}-${i + 1}`), 194, 26, { align: "right" }); doc.text(pdfSafe(`Goma, le ${fmtLong(todayISO())}`), 194, 31, { align: "right" });
    doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...NAVY); doc.text(pdfSafe(p.ecole), 36, 19);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...MUTED); doc.text("Gestion des fournitures", 36, 24.5);
    doc.setDrawColor(...BLUE); doc.setLineWidth(.6); doc.line(16, 40, 194, 40);
    doc.setFontSize(9.5); doc.text("FOURNISSEUR", 16, 49); doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(...NAVY); doc.text(pdfSafe(four), 16, 56);
    const body = fs.map(f => { const q = sel.get(f.id), pu = +f.prix || 0; return [f.article, f.unite, String(q), fc(pu), fc(q * pu)].map(pdfSafe); });
    const tot = fs.reduce((a, f) => a + sel.get(f.id) * (+f.prix || 0), 0);

    doc.text("Le gestionnaire des fournitures", 48, y + 30, { align: "center" }); doc.text("La direction", 162, y + 30, { align: "center" });
    doc.setFontSize(7); doc.text("Kivuthèque", 105, 290, { align: "center" });
  });

  const name = groups.length === 1 ? `Bon-de-commande-${slug(groups[0][0])}-${d}.pdf` : `Bons-de-commande-${d}.pdf`;
  if (store.mode === "db") return saveFile(name, doc.output("blob"), "application/pdf");
  doc.save(name); toast(groups.length > 1 ? `${groups.length} bons de commande enregistrés` : "Bon de commande enregistré : " + name);
}

function importRows(raw) {

  const find = re => h.findIndex(x => re.test(x));
  const hasHeader = h.some(x => /nom|name|eleve|classe|mail|prenom/.test(x));
  const cP = find(/pr[ée]?nom|first/), cPost = find(/post-?nom/), cN = h.findIndex((x, i) => i !== cP && i !== cPost && /^(nom|noms|name|nom complet|nom de l.eleve|eleve|nom et prenom)/.test(x)),

    const email = ((hasHeader ? (cM >= 0 ? r[cM] : "") : r[2]) || "").toLowerCase().trim(), sexeRaw = norm((hasHeader ? (cS >= 0 ? r[cS] : "") : r[3]) || "");

/* ============================================================ tableau de bord de la direction */
function pilotageView() {
  const a = anneeScolaire(), T = D.T, eleves = [...D.membres.values()].filter(m => (m.type || "Élève") === "Élève");
  const classes = params().classes.filter(c => c !== "Personnel" && eleves.some(m => m.classe === c));
  eleves.forEach(m => { if (m.classe && !classes.includes(m.classe)) classes.push(m.classe); });
  const months = []; for (let d = a.debut.slice(0, 7); d <= T.slice(0, 7) && d <= a.fin.slice(0, 7); d = addDays(d + "-01", 32).slice(0, 7)) months.push(d);
  const yearLoans = D.emprunts.filter(e => e.date >= a.debut && e.date <= a.fin), byM = new Map(eleves.map(m => [m.id, m]));
  const lus = D.emprunts.filter(e => e.retour && e.retour >= a.debut && e.retour <= a.fin && byM.has(e.membre)).length;
  const actifs = new Set(yearLoans.filter(e => byM.has(e.membre)).map(e => e.membre)), taux = eleves.length ? Math.round(actifs.size / eleves.length * 100) : 0;
  const never = [...D.livres.values()].filter(b => !b.total).sort((x, y) => x.titre.localeCompare(y.titre, "fr"));
  const late = D.emprunts.filter(e => e.statut === "retard").length;
  // carte de chaleur : livres empruntés par élève, par classe et par mois
  const cell = (c, mo) => { const ids = eleves.filter(m => m.classe === c), n = yearLoans.filter(e => e.date.slice(0, 7) === mo && ids.some(m => m.id === e.membre)).length; return { n, v: ids.length ? n / ids.length : 0 }; };
  const grid = classes.map(c => ({ c, nb: eleves.filter(m => m.classe === c).length, cells: months.map(mo => cell(c, mo)), act: eleves.filter(m => m.classe === c && actifs.has(m.id)).length }));
  const vmax = Math.max(.5, ...grid.flatMap(g => g.cells.map(x => x.v)));
  const shade = v => { const k = v / vmax; return `background:color-mix(in oklab,var(--accent) ${Math.round(8 + k * 82)}%,var(--solid));color:${k > .55 ? "#fff" : "var(--ink)"}`; };
  const monthName = mo => MOIS_C[+mo.slice(5, 7) - 1];
  // achats conseillés : livres demandés (file d'attente, beaucoup d'emprunts pour peu d'exemplaires)
  const demand = [...D.livres.values()].map(b => { const n = yearLoans.filter(e => e.livre === b.id).length, ex = Math.max(1, +b.ex || 0); return { b, n, ratio: n / ex, add: Math.max(b.attente || 0, Math.ceil(n / 4) - ex) }; })
    .filter(x => x.add > 0 && (x.b.attente || x.ratio >= 3)).sort((x, y) => (y.b.attente || 0) - (x.b.attente || 0) || y.ratio - x.ratio).slice(0, 8);
  const cats = params().categories.map(c => { const ex = [...D.livres.values()].filter(b => b.categorie === c).reduce((s, b) => s + (+b.ex || 0), 0), n = yearLoans.filter(e => e.b && e.b.categorie === c).length; return { c, ex, n }; });
  const totEx = Math.max(1, cats.reduce((s, x) => s + x.ex, 0)), totN = Math.max(1, cats.reduce((s, x) => s + x.n, 0));
  const hot = cats.filter(x => x.n && x.n / totN > x.ex / totEx * 1.3).sort((x, y) => y.n / totN - y.ex / totEx - (x.n / totN - x.ex / totEx)).slice(0, 3);
  const perMonth = months.map(mo => yearLoans.filter(e => e.date.slice(0, 7) === mo).length), pmMax = Math.max(1, ...perMonth);
  const kpi = (lab, icon, tone, val, sub, fmt = "") => `<div class="card kpi" style="--tone:var(--${tone});--tone-soft:var(--${tone}-soft);cursor:default"><div class="k-top"><span class="k-ic">${ic(icon)}</span>${lab}</div><div class="k-val" data-count="${val}" data-fmt="${fmt}">0</div><div class="k-sub">${sub}</div></div>`;
  return `<div class="toolbar"><span class="s" style="font-size:14px">Année scolaire ${esc(params().annee)} · du ${esc(fmtD(a.debut))} à aujourd'hui</span><button class="btn sm ghost" type="button" id="pilotCsv" style="margin-left:auto">${ic("down")}Exporter (Excel)</button></div>
    <div class="grid kpis">
      ${kpi("Élèves lecteurs (%)", "users", "accent", taux, `${actifs.size} élève${actifs.size > 1 ? "s" : ""} sur ${eleves.length} ont emprunté cette année`)}
      ${kpi("Livres lus", "book", "green", lus, `${eleves.length ? (lus / eleves.length).toFixed(1).replace(".", ",") : 0} par élève cette année`)}
      ${kpi("Jamais empruntés", "alert", "warn", never.length, `sur ${D.livres.size} titres du catalogue`)}
      ${kpi("Retards en cours", "clock", "danger", late, late ? "rappels possibles par e-mail" : "aucun retard")}
    </div>
    <div class="card"><div class="card-h"><h3>Lecture par classe et par mois</h3><span class="sub">livres empruntés par élève · plus la case est foncée, plus la classe lit</span></div>
      ${grid.length && months.length ? `<div class="table-wrap"><table class="heat"><thead><tr><th>Classe</th>${months.map(mo => `<th class="c">${monthName(mo)}</th>`).join("")}<th class="c">Élèves lecteurs</th></tr></thead><tbody>
        ${grid.map(g => `<tr><td><b>${esc(g.c)}</b><div class="s">${g.nb} élève${g.nb > 1 ? "s" : ""}</div></td>${g.cells.map((x, i) => `<td class="hc"><span style="${shade(x.v)}" title="${esc(g.c)} · ${monthName(months[i])} : ${x.n} emprunt${x.n > 1 ? "s" : ""} pour ${g.nb} élève${g.nb > 1 ? "s" : ""}">${x.n ? x.v.toFixed(1).replace(".", ",") : "–"}</span></td>`).join("")}
          <td class="c"><b>${g.nb ? Math.round(g.act / g.nb * 100) : 0} %</b><div class="meter" style="max-width:90px;margin:4px auto 0"><b data-w="${g.nb ? Math.round(g.act / g.nb * 100) : 0}%" style="width:0"></b></div></td></tr>`).join("")}</tbody></table></div>
        <div class="heat-legend"><span>Moins</span>${[0, .25, .5, .75, 1].map(k => `<i style="${shade(k * vmax)}"></i>`).join("")}<span>Plus</span></div>` : '<div class="empty">Pas encore assez de données cette année.</div>'}</div>
    <div class="grid cols-2">
      <div class="card"><div class="card-h"><h3>Emprunts par mois</h3><span class="sub">toute l'école</span></div>
        <div class="mbars">${months.map((mo, i) => `<div class="mbar" title="${monthName(mo)} : ${perMonth[i]} emprunt${perMonth[i] > 1 ? "s" : ""}"><span class="mv">${perMonth[i]}</span><b style="height:${Math.max(2, Math.round(perMonth[i] / pmMax * 100))}%"></b><span class="ml">${monthName(mo)}</span></div>`).join("")}</div></div>
      <div class="card"><div class="card-h"><h3>Achats conseillés</h3><span class="sub">livres très demandés</span></div>
        <div class="rows">${demand.map(x => `<div class="row" style="grid-template-columns:auto minmax(0,1fr) auto" data-book="${esc(x.b.id)}">${miniCover(x.b)}<div style="min-width:0"><div class="t">${esc(x.b.titre)}</div><div class="s">${x.n} emprunt${x.n > 1 ? "s" : ""} cette année · ${+x.b.ex || 0} exemplaire${(+x.b.ex || 0) > 1 ? "s" : ""}${x.b.attente ? ` · ${x.b.attente} en attente` : ""}</div></div>${pill("+" + x.add + " ex.", "ok")}</div>`).join("") || '<div class="empty">Aucun livre en manque d\'exemplaires.</div>'}</div>
        ${hot.length ? `<p class="form-note block" style="margin:12px 0 0">Genres très demandés : ${hot.map(x => `<b>${esc(x.c)}</b> (${Math.round(x.n / totN * 100)} % des emprunts pour ${Math.round(x.ex / totEx * 100)} % des livres)`).join(", ")}.</p>` : ""}</div>
    </div>
    <div class="card"><div class="card-h"><h3>Livres jamais empruntés</h3><span class="sub">${never.length} titre${never.length > 1 ? "s" : ""} · à mettre en avant (livres du mois, lectures données par les enseignants) ou à retirer du rayon</span></div>
      <div class="rows">${never.slice(0, 12).map(b => `<div class="row" style="grid-template-columns:auto minmax(0,1fr) auto" data-book="${esc(b.id)}">${miniCover(b)}<div style="min-width:0"><div class="t">${esc(b.titre)}</div><div class="s">${esc(b.auteur || "")} · ${esc(b.categorie || "")}</div></div><span class="s">${esc(b.rayon || "")}</span></div>`).join("") || '<div class="empty">Tous les livres ont été empruntés au moins une fois. Bravo !</div>'}
      ${never.length > 12 ? `<p class="s" style="margin:8px 0 0">… et ${never.length - 12} autres (export Excel).</p>` : ""}</div></div>`;
}
function bindPilotage(v) {
