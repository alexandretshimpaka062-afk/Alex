/* Layout : rail de verre flottant à gauche + scène principale ; barre d'onglets façon iOS sous 900px.

  --bg:#EDF2F7; --bg-2:#E3EBF3;

  --green:#2E9E45; --green-soft:rgba(46,158,69,.13);
  --star:#F2C200;
  --warn:#C77700; --warn-soft:rgba(232,149,0,.14);
  --danger:#D93A40; --danger-soft:rgba(217,58,64,.12);
  --orb-1:rgba(0,174,239,.42); --orb-2:rgba(57,181,74,.30); --orb-3:rgba(255,210,0,.20);
  --shadow:0 1px 1px rgba(11,34,53,.04),0 8px 24px -8px rgba(11,34,53,.14);
  --shadow-lg:0 30px 80px -20px rgba(11,34,53,.35);
  --c1:#00AEEF; --c2:#0B5C8A; --c3:#39B54A; --c4:#F2C200; --c5:#7CCBEE; --c6:#F27D5E; --c7:#8A6CE0; --c8:#8DA2B4; --c9:#1FB5A4;
  --display:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050C13; --bg-2:#08131D;
  --glass:rgba(16,30,44,.62); --glass-strong:rgba(18,34,50,.88); --solid:#0E1B27;
  --line:rgba(200,225,245,.08); --line-2:rgba(200,225,245,.16);
  --ink:#E8F2FA; --ink-2:#9FB4C6; --ink-3:#62798D;
  --accent:#2EC4FF; --accent-ink:#04121C; --accent-soft:rgba(46,196,255,.14);
  --green:#4CD066; --green-soft:rgba(76,208,102,.14);
  --star:#FFD84A;
  --warn:#FFB224; --warn-soft:rgba(255,178,36,.14);
  --danger:#FF6369; --danger-soft:rgba(255,99,105,.14);
  --orb-1:rgba(0,150,214,.34); --orb-2:rgba(46,158,69,.22); --orb-3:rgba(255,210,0,.10);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -10px rgba(0,0,0,.6);
  --shadow-lg:0 30px 90px -20px rgba(0,0,0,.8);
  --c2:#3F8FC4; --c8:#7D93A6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050C13; --bg-2:#08131D;
  --glass:rgba(16,30,44,.62); --glass-strong:rgba(18,34,50,.88); --solid:#0E1B27;
  --line:rgba(200,225,245,.08); --line-2:rgba(200,225,245,.16);
  --ink:#E8F2FA; --ink-2:#9FB4C6; --ink-3:#62798D;
  --accent:#2EC4FF; --accent-ink:#04121C; --accent-soft:rgba(46,196,255,.14);
  --green:#4CD066; --green-soft:rgba(76,208,102,.14);
  --star:#FFD84A;
  --warn:#FFB224; --warn-soft:rgba(255,178,36,.14);
  --danger:#FF6369; --danger-soft:rgba(255,99,105,.14);
  --orb-1:rgba(0,150,214,.34); --orb-2:rgba(46,158,69,.22); --orb-3:rgba(255,210,0,.10);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -10px rgba(0,0,0,.6);
  --shadow-lg:0 30px 90px -20px rgba(0,0,0,.8);
  --c2:#3F8FC4; --c8:#7D93A6;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;text-wrap:balance;margin:0}
svg{display:block}

/* ---------- ciel animé ---------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky i{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.sky i:nth-child(1){width:46vw;height:46vw;left:-8vw;top:-14vw;background:var(--orb-1);animation:drift1 26s ease-in-out infinite alternate}
.sky i:nth-child(2){width:40vw;height:40vw;right:-10vw;top:22vh;background:var(--orb-2);animation:drift2 32s ease-in-out infinite alternate}
.sky i:nth-child(3){width:30vw;height:30vw;left:30vw;bottom:-16vw;background:var(--orb-3);animation:drift3 38s ease-in-out infinite alternate}
.sky::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(180deg,rgba(0,0,0,.5),transparent 70%)}
@keyframes drift1{to{transform:translate(12vw,10vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-14vw,-8vh) scale(.9)}}
@keyframes drift3{to{transform:translate(10vw,-12vh) scale(1.2)}}

/* ---------- structure ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%;gap:0}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - 32px);margin:16px 0 16px 16px;padding:18px 14px;display:flex;flex-direction:column;gap:6px;
  background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 16px}
.logo-tile{width:52px;height:52px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(0,150,214,.55);flex:none;overflow:hidden}
.logo-tile img{width:40px;height:auto}
.brand b{display:block;font-family:var(--display);font-size:17px;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink-3);font-size:12px}
.nav-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px 4px}
.nav{display:flex;flex-direction:column;gap:2px;position:relative}
.nav button{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-2);font-weight:550;transition:color .2s,background .2s}
.nav button:hover{background:var(--accent-soft);color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button .ic{width:20px;height:20px;flex:none}
.nav button .count{margin-left:auto;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--danger-soft);color:var(--danger)}
.nav-pill{position:absolute;left:0;right:0;height:42px;border-radius:12px;background:var(--glass-strong);box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .45s var(--spring),opacity .2s;z-index:-1}
.nav-pill::before{content:"";position:absolute;left:-1px;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--accent)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.today-card{padding:14px;border-radius:16px;background:linear-gradient(135deg,var(--accent-soft),var(--green-soft));border:1px solid var(--line)}
.today-card h4{margin:0 0 8px;font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.today-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--ink-2)}
.today-row b{color:var(--ink)}
.today-row.alert b{color:var(--danger)}
.made{font-size:11px;color:var(--ink-3);padding:0 6px;opacity:.75}
.mode-chip{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);padding:0 6px}
.mode-chip i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.mode-chip.loading i{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}

.main{min-width:0;padding:22px 28px 60px;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:12px 0 10px;margin-top:-12px}
.topbar::before{content:"";position:absolute;inset:-14px -28px -8px;background:linear-gradient(var(--bg) 82%,transparent);opacity:.97;z-index:-1;pointer-events:none}
.titles{flex:1;min-width:0}
.eyebrow{margin:0 0 2px;color:var(--ink-3);font-size:13px;font-weight:550}
.titles h1{font-size:clamp(28px,3.4vw,40px);font-weight:750;line-height:1.05}
.search-pill{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;min-width:min(320px,100%);border-radius:14px;background:var(--glass);border:1px solid var(--line);color:var(--ink-3);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:border-color .2s,transform .2s}
.search-pill:hover{border-color:var(--line-2);transform:translateY(-1px)}
.search-pill kbd{margin-left:auto;font:600 11px var(--mono);padding:3px 6px;border-radius:6px;border:1px solid var(--line-2);color:var(--ink-3)}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);color:var(--ink-2);transition:transform .2s,color .2s}
.icon-btn:hover{color:var(--ink);transform:translateY(-1px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:14px;font-weight:650;white-space:nowrap;transition:transform .25s var(--spring),box-shadow .25s,background .2s}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px -10px var(--accent)}
.btn.primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 16px 30px -12px var(--accent)}
.btn.ghost{background:var(--glass);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--line-2)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{height:34px;padding:0 12px;border-radius:11px;font-size:13.5px}
.btn:active{transform:scale(.97)}
.btn .ic{width:18px;height:18px}

/* ---------- vue & animations d'entrée ---------- */
#view{display:flex;flex-direction:column;gap:22px;min-width:0}
.enter>*{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:.001;transform:translateY(18px) scale(.985);filter:blur(6px)}}
.grid{display:grid;gap:18px;min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.cols-3{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(0,.95fr)}
.cols-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cols-21{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:1280px){.cols-3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols-3>.span-wide{grid-column:1/-1}}
@media (max-width:900px){.cols-3,.cols-2,.cols-21{grid-template-columns:minmax(0,1fr)}}

.card{position:relative;min-width:0;background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);padding:20px;overflow:hidden}
.card.spot::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,-40%),var(--accent-soft),transparent 45%);opacity:0;transition:opacity .3s}
.card.spot:hover::after{opacity:1}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:17px;font-weight:650}
.card-h .sub{color:var(--ink-3);font-size:13px}
.card-h .more{white-space:nowrap;margin-left:auto;color:var(--accent);font-weight:650;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.card-h .more:hover{gap:8px}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;cursor:pointer;transition:transform .35s var(--spring),border-color .2s}
.kpi:hover{transform:translateY(-3px);border-color:var(--line-2)}
.kpi .k-top{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13px;font-weight:600}
.kpi .k-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--tone-soft,var(--accent-soft));color:var(--tone,var(--accent))}
.kpi .k-ic svg{width:18px;height:18px}
.kpi .k-val{font:750 38px/1 var(--display);letter-spacing:-.03em}
.kpi .k-sub{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.trend{font-weight:700;padding:1px 7px;border-radius:99px;font-size:11.5px}
.trend.up{background:var(--green-soft);color:var(--green)}
.trend.down{background:var(--danger-soft);color:var(--danger)}
.kpi .spark{position:absolute;right:12px;top:16px;width:84px;height:30px;opacity:.9}

/* pastilles */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.mute{background:var(--line);color:var(--ink-2)}

/* listes */
.rows{display:flex;flex-direction:column}
.row{display:grid;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .t{font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .s{color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .num{font:700 15px var(--display);text-align:right}
.avatar{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font:700 13px var(--display);color:#fff;flex:none}
.mini-cover{width:30px;height:42px;border-radius:5px 7px 7px 5px;flex:none;box-shadow:inset 3px 0 0 rgba(0,0,0,.18),0 4px 10px -4px rgba(0,0,0,.35)}
.empty{padding:26px 10px;text-align:center;color:var(--ink-3);font-size:14px}

/* tableau */
.table-wrap{overflow-x:auto;margin:0 -20px -20px;padding:0 20px 8px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{font:650 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--accent-soft)}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
td .t{font-weight:620}
td .s{color:var(--ink-3);font-size:12.5px}
.code{font:600 12px var(--mono);color:var(--ink-3)}
.row-actions{display:flex;gap:4px;justify-content:flex-end;opacity:.5;transition:opacity .2s}
tr:hover .row-actions{opacity:1}
.act{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2)}
.act:hover{background:var(--glass-strong);color:var(--ink)}
.act svg{width:17px;height:17px}

/* barre d'outils de liste */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field-search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line);flex:1;min-width:200px;max-width:420px}
.field-search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.field-search svg{width:17px;height:17px;color:var(--ink-3)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line);position:relative}
.seg button{position:relative;z-index:1;height:32px;padding:0 13px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--solid);box-shadow:var(--shadow)}
.seg button svg{width:18px;height:18px}
.seg button .n{font-size:11px;color:var(--ink-3);margin-left:4px}
select.flat{height:40px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line);padding:0 12px}

/* couvertures */
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.book{display:flex;flex-direction:column;gap:9px;cursor:pointer;text-align:left;perspective:800px}
.cover{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:6px 12px 12px 6px;padding:14px 12px 12px 18px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden;
  background:linear-gradient(155deg,var(--cv1),var(--cv2));box-shadow:inset 6px 0 0 rgba(0,0,0,.16),inset 7px 0 0 rgba(255,255,255,.18),0 18px 30px -16px rgba(0,0,0,.55);transition:transform .5s var(--spring),box-shadow .4s;transform-origin:left center}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);transform:translateX(-120%);transition:transform .8s var(--ease)}
.book:hover .cover{transform:rotateY(-14deg) translateY(-4px);box-shadow:inset 6px 0 0 rgba(0,0,0,.16),inset 7px 0 0 rgba(255,255,255,.18),18px 26px 40px -18px rgba(0,0,0,.6)}
.book:hover .cover::after{transform:translateX(120%)}
.cover .cv-cat{font:700 9.5px var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.cover .cv-title{font:700 17px/1.08 var(--display);letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.cover .cv-author{font-size:11px;opacity:.85}
.cover .cv-deco{position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;border:14px solid rgba(255,255,255,.12)}
.book .b-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.book .b-title{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avail{font:700 12px var(--display);white-space:nowrap}
.avail.ok{color:var(--green)}.avail.warn{color:var(--warn)}.avail.bad{color:var(--danger)}

/* graphiques */
.chart{width:100%;height:auto;overflow:visible}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--ink-3);font:11px var(--body)}
.chart .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s var(--ease) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .area{opacity:0;animation:fade .9s ease .9s forwards}
@keyframes fade{to{opacity:1}}
.chart .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .8s var(--spring) both;animation-delay:calc(var(--d) * 18ms)}
@keyframes grow{from{transform:scaleY(0)}}
.chart .hit:hover~.x{opacity:1}
.chart-wrap{position:relative}
.tip{position:absolute;pointer-events:none;padding:8px 10px;border-radius:10px;background:var(--glass-strong);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:12.5px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .15s;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tip b{font-family:var(--display)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.stats div{padding:12px 14px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line)}
.stats span{display:block;font-size:12px;color:var(--ink-3)}
.stats b{font:750 22px var(--display);letter-spacing:-.02em}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.donut-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;align-items:center}
.donut-box svg{max-width:190px;margin:0 auto;width:100%}
.donut-box svg circle.seg{transition:stroke-dasharray 1.2s var(--ease),stroke-dashoffset 1.2s var(--ease)}
.donut-center{font:800 30px var(--display);fill:var(--ink)}
.donut-center-s{font:600 11px var(--body);fill:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.d-legend{display:flex;flex-direction:column;gap:7px;min-width:0}
.d-legend div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:9px;align-items:center;font-size:13px}
.d-legend i{width:10px;height:10px;border-radius:3px}
.d-legend span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.d-legend b{font-family:var(--display)}
@media (max-width:420px){.donut-box{grid-template-columns:minmax(0,1fr)}}

/* jauges stock */

/* feuille (panneau) */
.sheet-wrap{position:fixed;inset:0;z-index:60}
.backdrop{position:absolute;inset:0;background:rgba(3,10,16,.36);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s ease both;opacity:0}
.panel{position:absolute;top:12px;right:12px;bottom:12px;width:min(540px,calc(100% - 24px));display:flex;flex-direction:column;background:var(--glass-strong);border:1px solid var(--line-2);border-radius:26px;box-shadow:var(--shadow-lg);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);animation:slideIn .55s var(--spring) both;overflow:hidden}
@keyframes slideIn{from{transform:translateX(105%)}}
.sheet-wrap.closing .panel{animation:slideOut .3s var(--ease) both}
.sheet-wrap.closing .backdrop{animation:fadeOut .3s ease both}
@keyframes slideOut{to{transform:translateX(105%)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@media (max-width:700px){
  .panel{top:auto;left:0;right:0;bottom:0;width:100%;max-height:92%;border-radius:26px 26px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);animation-name:sheetUp}
  .sheet-wrap.closing .panel{animation-name:sheetDown}
}
@keyframes sheetUp{from{transform:translateY(105%)}}
@keyframes sheetDown{to{transform:translateY(105%)}}

.pal{position:relative;width:min(640px,100%);border-radius:22px;background:var(--glass-strong);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);overflow:hidden;animation:pop .35s var(--spring) both}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-8px)}}
.pal-in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;border:0;background:transparent;outline:0;font-size:19px;min-width:0}
.pal-in svg{width:22px;height:22px;color:var(--accent)}
.pal-list{max-height:52vh;overflow-y:auto;padding:8px}
.pal-group{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:10px 10px 4px}
.pal-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:12px;text-align:left}
.pal-item[aria-selected="true"]{background:var(--accent-soft)}
.pal-item .t{font-weight:620}
.pal-item .s{font-size:12.5px;color:var(--ink-3)}
.pal-item .end{margin-left:auto}

/* toasts */
.toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:11px 16px 11px 12px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);font-weight:600;font-size:14px;animation:toastIn .5s var(--spring) both}
.toast .ic{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.toast.err .ic{background:var(--danger-soft);color:var(--danger)}
.toast .ic svg{width:16px;height:16px}
.toast.out{animation:toastOut .3s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.95)}}

/* accueil vide / chargement */
.welcome{display:grid;place-items:center;min-height:60vh}
.welcome .card{max-width:620px;padding:34px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.welcome h2{font-size:34px}
.welcome p{color:var(--ink-2);margin:0;max-width:46ch}
.progress{width:100%;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .2s}
.skeleton{height:120px;border-radius:var(--r-lg);background:linear-gradient(90deg,var(--glass),var(--glass-strong),var(--glass));background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* rapport (papier) */
.paper{background:#fff;color:#0B2235;border-radius:8px;box-shadow:var(--shadow-lg);padding:40px 44px;max-width:860px;width:100%;margin:0 auto;font-size:13px}
.paper h1{font:800 24px var(--display);color:#0B3C5D;letter-spacing:-.01em}
.paper h2{font:700 15px var(--display);color:#0B3C5D;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid #00AEEF}
.paper .p-head{display:flex;gap:18px;align-items:center}
.paper .p-head img{width:70px}
.paper .p-sub{color:#0089BF;font-weight:650;margin-top:2px}
.paper .p-meta{color:#7A8B9A;font-size:12px;margin-top:4px}
.paper .p-bar{height:4px;background:linear-gradient(90deg,#00AEEF 0 70%,#39B54A 70%);margin:16px 0 0;border-radius:2px}
.paper .p-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.paper .p-kpi{border:1px solid #D6E9F3;background:#F7FBFE;border-radius:8px;padding:8px 10px}
.paper .p-kpi span{display:block;font-size:10.5px;color:#7A8B9A;font-weight:650}
.paper .p-kpi b{font:750 19px var(--display);color:#0B3C5D}
.paper table{min-width:0;font-size:12px}
.paper th{background:#0B3C5D;color:#fff;letter-spacing:.02em;text-transform:none;font-size:11px;padding:7px 8px;border:0}
.paper td{padding:6px 8px;border-bottom:1px solid #E3E8EE;color:#1F3346}
.paper tbody tr:hover{background:none}
.paper tfoot td{font-weight:750;background:#E3F6FD;border-top:2px solid #0B3C5D;color:#0B3C5D}
.paper .pill{height:20px;font-size:11px}
.paper .pill.ok{background:#E7F6E9;color:#1E7B34}.paper .pill.warn{background:#FFF4DF;color:#A15C00}.paper .pill.bad{background:#FDECEC;color:#C62828}
.paper .sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:28px}
.paper .sign div{border-bottom:1px solid #7A8B9A;height:70px;font-weight:650;color:#0B3C5D}
.paper .sign small{display:block;color:#7A8B9A;font-weight:400;font-style:italic;margin-top:4px}
.paper .obs{border:1px solid #C9D3DC;border-radius:6px;min-height:80px}
.paper .p-break{break-before:page}
@media (max-width:700px){.paper{padding:22px 18px}.paper .p-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* réglages */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:99px;background:var(--glass-strong);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.chip button:hover{background:var(--danger-soft);color:var(--danger)}
.chip button svg{width:13px;height:13px}
.add-inline{display:flex;gap:8px;margin-top:10px}
.add-inline input{flex:1;height:36px;border-radius:11px;border:1px solid var(--line-2);background:var(--solid);padding:0 12px;min-width:0}

/* mobile */
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .topbar .search-pill{order:3;flex-basis:100%;min-width:0}
  .topbar::before{inset:0 -16px}
  .tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;justify-content:space-around;padding:8px 6px;border-radius:24px;background:var(--glass-strong);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:650;color:var(--ink-3);padding:4px 8px;border-radius:12px;min-width:56px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .kpi .k-val{font-size:32px}
  .f2{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .chart .draw{stroke-dashoffset:0}
}
@media print{
  body{background:#fff}
  .sky,.app,.tabbar,.toasts,.sheet-wrap,.palette{display:none!important}
  #printArea{display:block!important}
  #printArea .paper{box-shadow:none;padding:0;max-width:none;border-radius:0}
  @page{size:A4;margin:12mm}
}
#printArea{display:none}
</style>

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = (n, l = 2) => String(n).padStart(l, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const fmtD = s => { if (!s) return "—"; const d = parse(s); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear(); };
const MOIS_C = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const fmtShort = s => { const d = parse(s); return d.getDate() + " " + MOIS_C[d.getMonth()]; };
const fmtLong = s => { const d = parse(s); return JOURS[d.getDay()] + " " + d.getDate() + " " + MOIS[d.getMonth()] + " " + d.getFullYear(); };
const nf = n => new Intl.NumberFormat("fr-FR").format(Math.round(n || 0)).replace(/\u202f/g, "\u00a0");
const fc = n => nf(n) + " FC";
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const initials = s => String(s).replace(/^(M\.|Mme)\s+/, "").split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const COLS = ["livres", "membres", "emprunts", "fournitures", "mouvements"];
const LS_KEY = "kis-bibliotheque-v1";
const S = { livres: [], membres: [], emprunts: [], fournitures: [], mouvements: [], params: null };
const store = { mode: "loading", db: null, loaded: new Set(), ready: false };

const DESKTOP = window.desktop || null;
function lsRead() { if (DESKTOP) { try { return DESKTOP.load(); } catch { return null; } } try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch { return null; } }
function lsWrite() {
  if (store.mode !== "local") return;
  if (DESKTOP) {
    Promise.resolve(DESKTOP.save(JSON.stringify(S))).then(r => {
      if (!r || r.ok !== false) return;
      toast(r.error || "La modification n'a pas été enregistrée.", true);
      const d = lsRead(); if (!d) return location.reload();
      COLS.forEach(c => S[c] = d[c] || []); S.params = d.params || null; onData(true);
    });
    return;
  } try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch { toast("Impossible d'enregistrer dans ce navigateur", true); } }

async function initStore() {
  if (CLOUD) return cloudBoot();
  if (LOCAL_AUTH) return localBoot();
  let db = null;
  if (window.claude && typeof window.claude.use === "function") { try { db = await window.claude.use("db"); } catch { db = null; } }
  if (db) {
    store.mode = "db"; store.db = db;
    COLS.forEach(c => db.collection(c).onSnapshot(snap => {
      S[c] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      store.loaded.add(c); onData();
    }, e => { store.loaded.add(c); onData(); if (e && e.code !== "not_granted") toast("Synchronisation interrompue : " + e.message, true); }));
    db.doc("config/params").onSnapshot(snap => { S.params = snap.exists ? snap.data() : null; store.loaded.add("params"); onData(); },
      () => { store.loaded.add("params"); onData(); });
  } else {
    store.mode = "local";
    const saved = lsRead();
    if (saved) { Object.assign(S, saved); if (renumberMembers(S)) lsWrite(); }
    store.loaded = new Set([...COLS, "params"]); onData();
  }
}

async function put(col, obj) {
  const i = S[col].findIndex(x => x.id === obj.id);
  if (i >= 0) S[col][i] = obj; else S[col].push(obj);
  onData(true);
  if (store.mode === "cloud") { const { id, ...data } = obj; const { error } = await auth.sb.from(col).upsert({ id, data }); if (error) { toast(cloudError(error), true); cloudResync(col); } }
  else if (store.mode === "db") { const { id, ...data } = obj; try { await store.db.collection(col).doc(id).set(data); } catch (e) { writeError(e); } }
  else lsWrite();
}
async function del(col, id) {
  S[col] = S[col].filter(x => x.id !== id); onData(true);
  if (store.mode === "cloud") { const { error } = await auth.sb.from(col).delete().eq("id", id); if (error) { toast(cloudError(error), true); cloudResync(col); } return; }
  if (store.mode === "db") { try { await store.db.collection(col).doc(id).delete(); } catch (e) { writeError(e); } } else lsWrite();
}
async function saveParams(p) {
  S.params = p; onData(true);
  if (store.mode === "cloud") { const { error } = await auth.sb.from("reglages").upsert({ id: "params", data: p }); if (error) toast(cloudError(error), true); return; }
  if (store.mode === "db") { try { await store.db.doc("config/params").set(p); } catch (e) { writeError(e); } } else lsWrite();
}
function writeError(e) {
  const msg = e && (e.code === "not_granted" || e.code === "revoked") ? "Vous avez un accès en lecture seule : la modification n'a pas été enregistrée."
    : e && e.code === "quota_exceeded" ? "L'espace de stockage est plein : supprimez d'anciens enregistrements."
    : "La modification n'a pas pu être enregistrée. Réessayez.";
  toast(msg, true);
}
async function bulkReplace(data, label) {
  const ops = [];
  COLS.forEach(c => { S[c].forEach(x => ops.push(["del", c, x.id])); (data[c] || []).forEach(x => ops.push(["set", c, x])); });
  const params = { ...(S.params || DEFAULT_PARAMS), ...(data.params || {}), initialized: true };
  if (store.mode === "local") { COLS.forEach(c => S[c] = (data[c] || []).slice()); S.params = params; lsWrite(); onData(true); return; }
  if (store.mode === "cloud") {
    if (!guard("admin")) return;
    const ov = progressOverlay(label); const steps = COLS.length * 2 + 1; let k = 0;
    try {
      for (const c of COLS) { const { error } = await auth.sb.from(c).delete().neq("id", "\u0000"); if (error) throw error; ov.set(++k / steps); }
      for (const c of COLS) { const rows = (data[c] || []).map(({ id, ...d }) => ({ id, data: d }));
        for (let i = 0; i < rows.length; i += 400) { const { error } = await auth.sb.from(c).upsert(rows.slice(i, i + 400)); if (error) throw error; }
        S[c] = (data[c] || []).slice(); ov.set(++k / steps); }
      const { error } = await auth.sb.from("reglages").upsert({ id: "params", data: params }); if (error) throw error;
      S.params = params; ov.close(); onData(true); toast(label.replace("…", "") + " : terminé");
    } catch (e) { ov.close(); toast(cloudError(e), true); COLS.forEach(cloudResync); }
    return;
  }
  const ov = progressOverlay(label);
  let done = 0; const total = ops.length;
  const run = async op => {
    const [kind, c, x] = op;
    try { if (kind === "del") await store.db.collection(c).doc(x).delete(); else { const { id, ...d } = x; await store.db.collection(c).doc(id).set(d); } }
    catch (e) { if (e && (e.code === "resource_exhausted" || e.code === "unavailable")) { await new Promise(r => setTimeout(r, 800)); return run(op); } throw e; }
    ov.set(++done / total);
  };
  try {
    const queue = ops.slice(); const workers = Array.from({ length: 5 }, async () => { while (queue.length) await run(queue.shift()); });
    await Promise.all(workers);
    await store.db.doc("config/params").set(params);
    ov.close(); toast(label.replace("…", "") + " : terminé");
  } catch (e) { ov.close(); writeError(e); }
}

function cloudError(e) {
  const m = (e && (e.message || e.error_description)) || "";
  if (/Invalid login credentials/i.test(m)) return "E-mail ou mot de passe incorrect.";
  if (/Email not confirmed/i.test(m)) return "Confirmez d'abord votre adresse e-mail grâce au lien reçu par e-mail.";
  if (/already registered|already been registered/i.test(m)) return "Un compte existe déjà avec cette adresse e-mail.";
  if (/Password should be at least|at least 6/i.test(m)) return "Le mot de passe doit contenir au moins 6 caractères.";
  if (/rate limit|too many/i.test(m)) return "Trop de tentatives. Patientez une minute puis réessayez.";
  if (/row-level security|permission denied|42501/i.test(m) || (e && e.code === "42501")) return "Votre rôle ne permet pas cette modification.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Pas de connexion au serveur. Vérifiez internet puis réessayez.";
  return m || "Une erreur est survenue. Réessayez.";
}

async function cloudBoot() {
  if (!window.supabase || !CLOUD_CFG.supabaseUrl || !CLOUD_CFG.supabaseKey || /VOTRE|xxx/i.test(CLOUD_CFG.supabaseUrl)) return showAuth("config");
  auth.sb = window.supabase.createClient(CLOUD_CFG.supabaseUrl, CLOUD_CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  let recovering = /type=recovery/.test(location.hash);
  auth.sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") { recovering = true; showAuth("newpass"); } });
  const { data } = await auth.sb.auth.getSession();
  if (recovering) return showAuth("newpass");
  if (!data.session) return showAuth("login");
  await afterLogin(data.session.user);
}
async function afterLogin(user) {
  auth.user = user;
  const { data: prof, error } = await auth.sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if (error) return showAuth("login", "") || toast(cloudError(error), true);
  auth.profile = prof || { role: "en_attente", nom: user.email };
  if (["en_attente", "desactive"].includes(roleOf())) return showAuth("pending");
  clearInterval(auth.poll);
  if (roleOf() === "consultation") auth.profile.role = "direction";
  hideAuth(); store.mode = "cloud"; applyPerms(); buildNav(); buildAccountNav();
  if (isReader() && !["espace", "livres"].includes(ui.view)) ui.view = "espace";
  if (!store.cloudLoaded) { store.cloudLoaded = true; await cloudLoad(); } else render();
}
async function cloudFetch(t) {
  let rows = [], from = 0;
  for (;;) {
    const { data, error } = await auth.sb.from(t).select("id,data").order("id").range(from, from + 999);
    if (error) throw error;
    rows = rows.concat(data); if (data.length < 1000) break; from += 1000;
  }
  return rows;
}
async function cloudLoad() {
  try {
    await Promise.all([...COLS, "reglages"].map(async t => {
      const rows = await cloudFetch(t);
      if (t === "reglages") { const p = rows.find(r => r.id === "params"); S.params = p ? p.data : null; store.loaded.add("params"); }
      else { S[t] = rows.map(r => ({ ...r.data, id: r.id })); store.loaded.add(t); }
    }));
  } catch (e) { toast(cloudError(e), true); }
  if (isReader()) await loadDispo();
  onData();
  if (can("comptes")) loadAccounts();
  auth.channel = auth.sb.channel("kivutheque").on("postgres_changes", { event: "*", schema: "public" }, payload => {
    const t = payload.table, row = payload.new && payload.new.id ? payload.new : null, oldId = payload.old && payload.old.id;
    if (COLS.includes(t)) {
      if (payload.eventType === "DELETE") S[t] = S[t].filter(x => x.id !== oldId);
      else { const o = { ...row.data, id: row.id }; const i = S[t].findIndex(x => x.id === o.id); if (i >= 0) S[t][i] = o; else S[t].push(o); }
      onData();
      if (t === "emprunts" && isReader()) loadDispo().then(() => onData());
    } else if (t === "reglages" && row && row.id === "params") { S.params = row.data; onData(); }
    else if (t === "profiles") {
      if (row && row.id === auth.user.id) {
        const changed = row.role !== roleOf(); auth.profile = { ...auth.profile, ...row };
        if (changed) { if (["en_attente", "desactive"].includes(row.role)) return showAuth("pending"); location.reload(); return; }
        buildAccountNav(); render();
      }
      if (can("comptes")) loadAccounts();
    }
  }).subscribe();
}

/* fiches de membre les plus proches d'une demande (nom, classe, e-mail) */
function memberMatches(p) {
  const linked = new Set(auth.accounts.filter(a => a.membre_id).map(a => a.membre_id));
  const toks = norm(p.nom).split(/\s+/).filter(t => t.length > 1);
  return S.membres.filter(m => !linked.has(m.id)).map(m => {
    const words = norm(m.nom).replace(/^(m\.|mme)\s+/, "").split(/\s+/), hit = toks.filter(t => words.includes(t)).length;
    let sc = hit * 2; if (p.classe && norm(m.classe) === norm(p.classe)) sc += 1;
    const sure = (m.email && norm(m.email) === norm(p.email)) || (toks.length >= 2 && hit === toks.length);  // même e-mail, ou nom complet identique
    if (sure) sc += 10;
    return [m, sc];
  }).sort((a, b) => b[1] - a[1] || a[0].nom.localeCompare(b[0].nom, "fr"));
}

        <td style="text-align:right">${p.avatar && p.id !== auth.user.id ? `<button class="btn sm ghost" type="button" data-unphoto="${p.id}" title="Retirer une photo inappropriée">Retirer la photo</button>` : ""}</td></tr>`).join("")}

}
async function acceptAccount(id, role) {
  const p = auth.accounts.find(x => x.id === id); if (!p) return;
  let membre = null;
  if (READER_ROLES.includes(role)) {
    const sel = $("#lk-" + id); membre = sel ? sel.value : "new";
    if (membre === "new") {
      const fiche = { nom: p.nom, type: role === "enseignant" ? "Enseignant" : "Élève", classe: role === "enseignant" ? "Personnel" : (p.classe || ""), sexe: "", inscription: todayISO(), email: p.email };
      const { data, error } = await auth.sb.rpc("kiv_nouveau_membre", { fiche });
      if (error) return toast(cloudError(error), true);
      membre = data;
    }
  }
  const { error } = await auth.sb.rpc("kiv_valider", { target: id, new_role: role, membre });
  if (error) return toast(cloudError(error), true);
  if (membre) { const m = S.membres.find(x => x.id === membre); if (m && !m.email) put("membres", { ...m, email: p.email }); else cloudResync("membres"); }
  toast(`${p.nom} : ${ROLES[role][0]}${membre ? " · carte " + membre : ""}`);
  loadAccounts();
}
async function setRole(id, role) {
  const { error } = await auth.sb.rpc("kiv_valider", { target: id, new_role: role });
  if (error) { toast(cloudError(error), true); return loadAccounts(); }
  const p = auth.accounts.find(x => x.id === id); toast(`${p ? p.nom || p.email : "Compte"} : ${ROLES[role][0]}`); loadAccounts();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-accept],[data-refuse],[data-unphoto]"); if (!b) return;
  if (b.dataset.accept) { const [id, r] = b.dataset.accept.split(":"); b.disabled = true; acceptAccount(id, r).finally(() => b.disabled = false); }
  else if (b.dataset.refuse) { const p = auth.accounts.find(x => x.id === b.dataset.refuse); confirmSheet("Refuser la demande de " + (p.nom || p.email) + " ?", "La personne ne pourra pas entrer dans Kivuthèque. Vous pourrez changer d'avis plus tard dans « Tous les comptes ».", "Refuser", () => setRole(p.id, "desactive")); }
  else if (b.dataset.unphoto) { const p = auth.accounts.find(x => x.id === b.dataset.unphoto); confirmSheet("Retirer la photo de " + (p.nom || p.email) + " ?", "Ses initiales s'afficheront à la place. La personne pourra choisir une autre photo.", "Retirer", async () => { const { error } = await auth.sb.rpc("kiv_retirer_photo", { target: p.id }); if (error) return toast(cloudError(error), true); toast("Photo retirée"); loadAccounts(); }); }
});

/* ---------- mon profil : photo, nom, mot de passe ---------- */
function profileSheet() {
  const P = auth.profile; let photo = P.avatar || "", changed = false, img = null, zoom = 1, ox = 0, oy = 0;
  openSheet("Mon profil", `
    <div class="prof-head"><div id="pfPrev">${personAvatar({ ...P, id: auth.user.id }, "avatar xl")}</div>
      <div class="prof-actions"><label class="btn sm ghost" style="cursor:pointer">${ic("up")}${photo ? "Changer de photo" : "Ajouter une photo"}<input type="file" id="pfFile" accept="image/*" hidden></label>
        <button class="btn sm ghost" type="button" id="pfRm" ${photo ? "" : "hidden"}>${ic("trash")}Retirer</button>
        <p class="form-note" style="margin:0">Ta photo s'affiche sur ta carte de membre et dans les classements. Jamais sur la borne publique.</p></div></div>
    <div id="pfCrop" class="crop-box" hidden><canvas id="pfCanvas" width="520" height="520" aria-label="Recadrage de la photo"></canvas>
      <div class="crop-zoom">${ic("minus")}<input type="range" id="pfZoom" min="1" max="3" step="0.01" value="1" aria-label="Zoom">${ic("plus")}</div><p class="form-note" style="margin:0;text-align:center">Fais glisser la photo pour la centrer dans le cercle.</p></div>
    <div class="f"><label for="pf-nom">Nom affiché</label><input id="pf-nom" value="${esc(P.nom || "")}" maxlength="80"></div>
    <div class="recap" style="border-style:solid"><div>Compte : <b>${esc(auth.user.email)}</b></div><div>Rôle : <b>${esc(ROLES[roleOf()][0])}</b>${P.membre_id ? ` · carte <b>${esc(P.membre_id)}</b>` : ""}</div></div>
    <details class="pf-pass"><summary>Changer de mot de passe</summary>
      <div class="f2" style="margin-top:10px"><div class="f"><label for="pf-p1">Nouveau mot de passe</label><input id="pf-p1" type="password" autocomplete="new-password" minlength="6"></div>
      <div class="f"><label for="pf-p2">Confirmer</label><input id="pf-p2" type="password" autocomplete="new-password" minlength="6"></div></div></details>`,
    `<button class="btn ghost" type="button" data-close2>Annuler</button><button class="btn primary" type="button" id="pfSave">${ic("check")}Enregistrer</button>`,
    el => {
      const cv = $("#pfCanvas", el), ctx = cv.getContext("2d");
      const clamp = () => { const s = zoom * Math.max(cv.width / img.width, cv.height / img.height), w = img.width * s, h = img.height * s;
        ox = Math.min(0, Math.max(cv.width - w, ox)); oy = Math.min(0, Math.max(cv.height - h, oy)); return [s, w, h]; };
      const draw = () => { if (!img) return; const [, w, h] = clamp(); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, ox, oy, w, h); };
      const exportPhoto = () => { const out = document.createElement("canvas"); out.width = out.height = 192; const k = 192 / cv.width, [, w, h] = clamp(); const c = out.getContext("2d");
        c.fillStyle = "#fff"; c.fillRect(0, 0, 192, 192); c.imageSmoothingQuality = "high"; c.drawImage(img, ox * k, oy * k, w * k, h * k);
        let q = .86, d = out.toDataURL("image/jpeg", q); while (d.length > 60000 && q > .4) d = out.toDataURL("image/jpeg", q -= .12); return d; };
      const preview = () => { photo = exportPhoto(); changed = true; $("#pfPrev", el).innerHTML = `<img class="avatar xl" src="${photo}" alt="">`; $("#pfRm", el).hidden = false; };
      $("#pfFile", el).onchange = () => { const f = $("#pfFile", el).files[0]; if (!f) return; if (!/^image\//.test(f.type)) return toast("Choisis une image (JPEG, PNG…)", true);
        const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { img = im; zoom = 1; $("#pfZoom", el).value = 1; const s = Math.max(cv.width / im.width, cv.height / im.height); ox = (cv.width - im.width * s) / 2; oy = (cv.height - im.height * s) / 2; $("#pfCrop", el).hidden = false; draw(); preview(); };
          im.onerror = () => toast("Cette image ne peut pas être lue. Essaie une photo JPEG ou PNG.", true); im.src = r.result; }; r.readAsDataURL(f); };
      $("#pfZoom", el).oninput = e => { const [s0] = clamp(); const cx = cv.width / 2, cy = cv.height / 2; const before = zoom; zoom = +e.target.value; const k = zoom / before; ox = cx - (cx - ox) * k; oy = cy - (cy - oy) * k; draw(); preview(); };
      let drag = null;
      cv.addEventListener("pointerdown", e => { if (!img) return; drag = [e.clientX, e.clientY, ox, oy]; cv.setPointerCapture(e.pointerId); });
      cv.addEventListener("pointermove", e => { if (!drag) return; const r = cv.getBoundingClientRect(), k = cv.width / r.width; ox = drag[2] + (e.clientX - drag[0]) * k; oy = drag[3] + (e.clientY - drag[1]) * k; draw(); });
      cv.addEventListener("pointerup", () => { if (drag) { drag = null; preview(); } });
      $("#pfRm", el).onclick = () => { photo = ""; changed = true; img = null; $("#pfCrop", el).hidden = true; $("#pfRm", el).hidden = true; $("#pfPrev", el).innerHTML = personAvatar({ ...P, avatar: "", id: auth.user.id }, "avatar xl"); };
      $("[data-close2]", el).onclick = () => closeSheet();
      $("#pfSave", el).onclick = async () => {
        clearErr(el);
        const p1 = $("#pf-p1", el).value, nom = $("#pf-nom", el).value.trim();
        if (!nom) return fieldErr(el, "pf-nom", "Indique ton nom.");
        if (p1 && p1.length < 6) { $("details", el).open = true; return fieldErr(el, "pf-p1", "Au moins 6 caractères."); }
        if (p1 && p1 !== $("#pf-p2", el).value) { $("details", el).open = true; return fieldErr(el, "pf-p2", "Les deux mots de passe sont différents."); }
        $("#pfSave", el).disabled = true;
        const { error } = await auth.sb.rpc("kiv_mon_profil", { nom, avatar: changed ? photo : null });
        if (!error && p1) { const r = await auth.sb.auth.updateUser({ password: p1 }); if (r.error) { $("#pfSave", el).disabled = false; return toast(cloudError(r.error), true); } }
        $("#pfSave", el).disabled = false;
        if (error) return toast(cloudError(error), true);
        auth.profile = { ...auth.profile, nom, avatar: changed ? (photo || null) : auth.profile.avatar };
        closeSheet(); toast("Profil enregistré"); buildAccountNav(); if (can("comptes")) loadAccounts(); else render();
      };
    });
}

/* ============================================================ logiciel de bureau : comptes et mots de passe
   Les comptes sont gérés par le logiciel (fichier comptes.json, mots de passe chiffrés) :
   l'interface ne voit jamais les mots de passe, et chaque enregistrement est vérifié selon le rôle. */
const LOCAL_AUTH = !!(DESKTOP && DESKTOP.auth);
const LOCK_KEY = "kiv-lock";
async function localBoot() {
  store.localAuth = true;
  const st = await DESKTOP.auth.status();
  if (st.ok && st.current) return localEnter(st.current);
  if (st.ok && !st.hasUsers) return localSetup();
  localLogin();
}
function pwField(id, label, auto) {
  return `<div class="f"><label for="${id}">${label}</label><input id="${id}" type="password" autocomplete="${auto}" minlength="6" required></div>`;
}
function localSetup() {
  const el = authShell(`<h2>Bienvenue ! Créons le compte administrateur</h2>
    <p class="auth-p">L'administrateur gère tout, y compris les comptes de l'équipe : bibliothécaire, gestion des fournitures, consultation. Vous les créerez ensuite dans <b>Comptes</b>.</p>
    <form id="aForm" class="auth-form" novalidate>
      <div class="f"><label for="as-nom">Prénom et nom</label><input id="as-nom" autocomplete="name" placeholder="Ex. : Direction KIS" required></div>
      <div class="f"><label for="as-login">Identifiant de connexion</label><input id="as-login" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Ex. : direction" required></div>
      ${pwField("as-pass", "Mot de passe (6 caractères minimum)", "new-password")}${pwField("as-pass2", "Confirmer le mot de passe", "new-password")}
      <button class="btn primary" type="submit" id="asSubmit">${ic("check")}Créer le compte administrateur</button>
      <div class="auth-msg" hidden></div>
    </form>`);
  $("#aForm", el).onsubmit = async e => {
    e.preventDefault(); authMsg(el, "");
    const nom = $("#as-nom", el).value.trim(), login = $("#as-login", el).value.trim(), password = $("#as-pass", el).value;
    if (!nom || !login) return authMsg(el, "Indiquez votre nom et un identifiant.");
    if (password.length < 6) return authMsg(el, "Le mot de passe doit contenir au moins 6 caractères.");
    if (password !== $("#as-pass2", el).value) return authMsg(el, "Les deux mots de passe sont différents.");
    $("#asSubmit", el).disabled = true;
    const r = await DESKTOP.auth.setup({ nom, login, password });
    $("#asSubmit", el).disabled = false;
    if (!r.ok) return authMsg(el, r.error);
    showRecoveryCode(r.recoveryCode, r.user);
  };
  setTimeout(() => $("#as-nom", el).focus(), 50);
}
function showRecoveryCode(code, user) {
  const el = authShell(`<h2>Votre code de secours</h2>
    <p class="auth-p">Notez ce code sur papier et gardez-le en lieu sûr. En cas d'oubli du mot de passe administrateur, il permet d'en choisir un nouveau.
    <b>Il ne sera plus affiché.</b></p>
    <div class="rcode" id="asCode">${esc(code)}</div>
    <div class="auth-actions"><button class="btn ghost" type="button" id="asCopy">${ic("check")}Copier le code</button></div>
    <button class="btn primary" type="button" id="asContinue">${ic("arrow")}J'ai noté le code, continuer</button>`);
  $("#asCopy", el).onclick = async () => { try { await navigator.clipboard.writeText(code); toast("Code copié"); } catch { toast("Copie impossible : recopiez le code à la main", true); } };
  $("#asContinue", el).onclick = () => localEnter(user);
}
function localLogin(info) {
  let locked = ""; try { locked = sessionStorage.getItem(LOCK_KEY) || ""; sessionStorage.removeItem(LOCK_KEY); } catch {}
  const el = authShell(`<h2>${locked ? "Session verrouillée" : "Connexion"}</h2>
    ${locked ? '<p class="auth-p">Kivuthèque a été verrouillée. Saisissez de nouveau votre mot de passe.</p>' : ""}
    <form id="aForm" class="auth-form" novalidate>
      <div class="f"><label for="al-login">Identifiant</label><input id="al-login" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(locked)}" required></div>
      ${pwField("al-pass", "Mot de passe", "current-password")}
      <button class="btn primary" type="submit" id="alSubmit">${ic("arrow")}Se connecter</button>
      <div class="auth-msg" hidden></div>
      <button type="button" class="link auth-link" id="alForgot">Mot de passe oublié ?</button>
    </form>`);
  if (info) authMsg(el, info, true);
  $("#alForgot", el).onclick = localForgot;
  $("#aForm", el).onsubmit = async e => {
    e.preventDefault(); authMsg(el, ""); $("#alSubmit", el).disabled = true;
    const r = await DESKTOP.auth.login({ login: $("#al-login", el).value, password: $("#al-pass", el).value });
    $("#alSubmit", el).disabled = false;
    if (!r.ok) { $("#al-pass", el).value = ""; $("#al-pass", el).focus(); return authMsg(el, r.error); }
    localEnter(r.user);
  };
  setTimeout(() => (locked ? $("#al-pass", el) : $("#al-login", el)).focus(), 50);
}
function localForgot() {
  const el = authShell(`<h2>Mot de passe oublié</h2>
    <p class="auth-p"><b>Bibliothécaire, fournitures ou consultation</b> : demandez à l'administrateur de vous attribuer un nouveau mot de passe, dans <b>Comptes</b>.</p>
    <p class="auth-p"><b>Administrateur</b> : utilisez le code de secours noté lors de l'installation.</p>
    <form id="aForm" class="auth-form" novalidate>
      <div class="f"><label for="ar-code">Code de secours</label><input id="ar-code" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" required></div>

let D = null;
function derive() {
  const T = todayISO(); const p = params();
  const livres = new Map(S.livres.map(b => [b.id, { ...b, sortis: 0, total: 0 }]));
  const membres = new Map(S.membres.map(m => [m.id, { ...m, cours: 0, retard: 0, dues: 0 }]));
  const emprunts = S.emprunts.map(e => {
    const prevu = e.prevu || addDays(e.date, p.duree);
    const end = e.retour || T;
    const jours = Math.max(0, diffDays(end, prevu));
    const statut = e.retour ? (jours > 0 ? "rendu-retard" : "rendu") : (T > prevu ? "retard" : "cours");
    const amende = jours * p.amende;
    const b = livres.get(e.livre), m = membres.get(e.membre);
    if (b) { b.total++; if (!e.retour) b.sortis++; }
    if (m) { if (!e.retour) m.cours++; if (statut === "retard") m.retard++; if (!e.paye) m.dues += amende; }
    return { ...e, prevu, jours, statut, amende, b, m };
  }).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (a.id < b.id ? 1 : -1));
  if (isReader() && store.dispo) livres.forEach(b => { b.sortis = store.dispo.get(b.id) || 0; });
  livres.forEach(b => { b.dispo = (Number(b.ex) || 0) - b.sortis; });
  const fournitures = S.fournitures.map(f => {
    let ent = 0, sor = 0; S.mouvements.forEach(m => { if (m.article === f.id) { if (m.type === "entree") ent += +m.qte || 0; else sor += +m.qte || 0; } });
    const stock = (+f.initial || 0) + ent - sor;
    return { ...f, ent, sor, stock, valeur: stock * (+f.prix || 0), etat: stock <= 0 ? "rupture" : stock <= (+f.seuil || 0) ? "faible" : "ok" };
  }).sort((a, b) => a.article.localeCompare(b.article, "fr"));
  D = { T, p, livres, membres, emprunts, fournitures, fmap: new Map(fournitures.map(f => [f.id, f])) };
  return D;
}

/* numéros de membre : A001 … A999, puis B001 … */
const memRank = id => { const m = /^([A-Z])(\d{3})$/.exec(id || ""); return m ? (m[1].charCodeAt(0) - 65) * 999 + +m[2] : 0; };
const memNum = r => String.fromCharCode(65 + Math.floor((r - 1) / 999)) + pad((r - 1) % 999 + 1, 3);
const nextMemberId = arr => memNum(Math.max(0, ...arr.map(x => memRank(x.id))) + 1);
/* anciens numéros (MEM-001…) → A001… ; les emprunts suivent */
function renumberMembers(data) {
  const old = (data.membres || []).filter(m => !memRank(m.id)); if (!old.length) return false;
  let r = Math.max(0, ...data.membres.map(m => memRank(m.id))); const map = new Map();
  old.sort((a, b) => String(a.id).localeCompare(String(b.id))).forEach(m => { map.set(m.id, memNum(++r)); m.id = map.get(m.id); });
  (data.emprunts || []).forEach(e => { if (map.has(e.membre)) e.membre = map.get(e.membre); });
  return true;
}
const nextId = (arr, prefix, len) => { let n = 0; arr.forEach(x => { const m = String(x.id).match(/(\d+)$/); if (m) n = Math.max(n, +m[1]); }); return prefix + pad(n + 1, len); };

/* ---------- graphiques ---------- */
function smooth(pts) {
  if (pts.length < 2) return "";
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const t = .18; let c1y = p1[1] + (p2[1] - p0[1]) * t, c2y = p2[1] - (p3[1] - p1[1]) * t;
    const lo = Math.min(p1[1], p2[1]), hi = Math.max(p1[1], p2[1]); c1y = Math.max(lo, Math.min(hi, c1y)); c2y = Math.max(lo, Math.min(hi, c2y));
    d += ` C${p1[0] + (p2[0] - p0[0]) * t},${c1y} ${p2[0] - (p3[0] - p1[0]) * t},${c2y} ${p2[0]},${p2[1]}`;
  }
  return d;
}
function areaChart(labels, series) {
  const W = 640, H = 260, L = 28, R = 6, Tp = 10, B = 26, n = labels.length, slot = (W - L - R) / n;
  const max = Math.max(2, ...series.flatMap(s => s.values)); const top = Math.ceil(max / 2) * 2;
  const y = v => Tp + (H - Tp - B) * (1 - v / top);
  const ticks = [0, top / 2, top];
  let g = ticks.map(t => `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join("");
  g += labels.map((l, i) => { const wd = parse(l).getDay(); return (wd === 0 || wd === 6) ? `<rect x="${L + i * slot}" y="${Tp}" width="${slot}" height="${H - Tp - B}" fill="var(--line)" opacity=".45"/>` : ""; }).join("");
  g += labels.map((l, i) => i % 5 === 4 || i === 0 ? `<text class="axis" x="${L + i * slot + slot / 2}" y="${H - 6}" text-anchor="middle">${fmtShort(l)}</text>` : "").join("");
  const bw = Math.max(3, slot * .3), gap = 1.5;
  const bars = labels.map((l, i) => series.map((s, si) => { const v = s.values[i]; if (!v) return "";
    const x = L + i * slot + slot / 2 + (si ? gap / 2 : -bw - gap / 2), yy = y(v), h = y(0) - yy;
    return `<rect class="bar" x="${x}" y="${yy}" width="${bw}" height="${h}" rx="${Math.min(3, bw / 2)}" fill="${s.color}" style="--d:${i}"/>`; }).join("")).join("");
  const hits = labels.map((l, i) => `<rect class="hit" x="${L + i * slot}" y="${Tp}" width="${slot}" height="${H - Tp - B}" fill="transparent" data-i="${i}"/>`).join("");
  return `<div class="chart-wrap" data-chart='${esc(JSON.stringify({ labels, series: series.map(s => ({ n: s.name, c: s.color, v: s.values })) }))}'>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Emprunts et retours par jour sur 30 jours (week-ends grisés)">${g}${bars}<line class="cross" x1="0" x2="0" y1="${Tp}" y2="${H - B}" stroke="var(--line-2)" stroke-dasharray="3 4" opacity="0"/>${hits}</svg><div class="tip"></div></div>`;
}
function donut(items, total, unit) {
  const r = 62, C = 2 * Math.PI * r; let acc = 0;
  const segs = items.map(it => { const len = total ? it.value / total * C : 0; const gap = items.length > 1 ? Math.min(3, len * .3) : 0;
    const s = `<circle class="seg" cx="80" cy="80" r="${r}" fill="none" stroke="${it.color}" stroke-width="20" stroke-linecap="butt" stroke-dasharray="0 ${C}" stroke-dashoffset="${-acc}" data-dash="${Math.max(0, len - gap)} ${C}" data-off="${-acc}" transform="rotate(-90 80 80)"><title>${esc(it.label)} : ${it.value}</title></circle>`;
    acc += len; return s; }).join("");
  return `<div class="donut-box"><svg viewBox="0 0 160 160" role="img" aria-label="Répartition par catégorie"><circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--line)" stroke-width="20"/>${segs}
    <text class="donut-center" x="80" y="82" text-anchor="middle">${nf(total)}</text><text class="donut-center-s" x="80" y="100" text-anchor="middle">${unit}</text></svg>
    <div class="d-legend">${items.map(it => `<div><i style="background:${it.color}"></i><span>${esc(it.label)}</span><b>${nf(it.value)}</b></div>`).join("")}</div></div>`;
}
function bindCharts(root) {
  $$(".chart-wrap", root).forEach(w => {
    const data = JSON.parse(w.dataset.chart), tip = $(".tip", w), cross = $(".cross", w), svg = $("svg", w);
    $$(".hit", w).forEach(h => {
      h.addEventListener("pointerenter", () => {
        const i = +h.dataset.i, cx = +h.getAttribute("x") + +h.getAttribute("width") / 2, sc = svg.getBoundingClientRect().width / 640;
        cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("opacity", 1);
        tip.innerHTML = `<div style="color:var(--ink-3);margin-bottom:3px">${fmtLong(data.labels[i])}</div>` + data.series.map(s => `<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.c};margin-right:6px"></i>${s.n} <b>${s.v[i]}</b></div>`).join("");
        tip.style.left = Math.max(70, Math.min(w.clientWidth - 70, cx * sc)) + "px"; tip.style.top = "40px"; tip.style.opacity = 1;
      });
    });
    svg.addEventListener("pointerleave", () => { tip.style.opacity = 0; cross.setAttribute("opacity", 0); });
  });
}

        <div class="card"><div class="card-h"><h3>Derniers mouvements</h3></div><div class="rows">${recent.map(m => { const f = D.fmap.get(m.article); return `<div class="row" style="grid-template-columns:auto minmax(0,1fr) auto"><span class="k-ic" style="width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--${m.type === "entree" ? "green" : "warn"}-soft);color:var(--${m.type === "entree" ? "green" : "warn"})">${ic(m.type === "entree" ? "down" : "up")}</span><div style="min-width:0"><div class="t">${esc(f ? f.article : m.article)}</div><div class="s">${fmtShort(m.date)} · ${esc(m.tiers || "")}</div></div><b class="num">${m.type === "entree" ? "+" : "−"}${m.qte}</b></div>`; }).join("") || '<div class="empty">Aucun mouvement.</div>'}</div></div>

function suppliesList() {

/* ---------- rapport ---------- */
/* ============================================================ rapports (aperçu + PDF) */
const REPORTS = [
  { id: "biblio", label: "Bibliothèque", sub: "Activité du mois", icon: "book", monthly: true },
  { id: "fourn", label: "Fournitures", sub: "Stock du mois", icon: "box", monthly: true },
  { id: "retards", label: "Retards et amendes", sub: "Situation à ce jour", icon: "clock" },
  { id: "inventaire", label: "Inventaire des livres", sub: "Catalogue à ce jour", icon: "list" },
];
function monthBounds(m) { const s = m + "-01"; const e = parse(s); e.setMonth(e.getMonth() + 1); e.setDate(0); return [s, iso(e)]; }
function monthOptions() { const out = []; const d = parse(todayISO().slice(0, 8) + "01"); for (let i = 0; i < 24; i++) { out.push(iso(d).slice(0, 7)); d.setMonth(d.getMonth() - 1); } return out; }
const monthLabel = m => { const d = parse(m + "-01"); return MOIS[d.getMonth()] + " " + d.getFullYear(); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const ST_TXT = { rupture: "Rupture", faible: "Stock faible", ok: "En stock" };

function reportModel(kind, m) {
  const p = params(), T = todayISO(), E = D.emprunts;
  const base = { kind, school: p.ecole, year: p.annee, edited: fmtD(T), signatures: false };
  if (kind === "biblio" || kind === "fourn") {
    const [s, e] = monthBounds(m); const inM = d => d && d >= s && d <= e;
    base.period = `${cap(monthLabel(m))} · du ${fmtD(s)} au ${fmtD(e)}`; base.signatures = true;
    if (kind === "biblio") {
      const loansM = E.filter(x => inM(x.date));
      const k = [
        ["Emprunts", loansM.length], ["Retours", E.filter(x => inM(x.retour)).length],
        ["Retours en retard", E.filter(x => inM(x.retour) && x.retour > x.prevu).length],
        ["Sortis en fin de mois", E.filter(x => x.date <= e && !(x.retour && x.retour <= e)).length],
        ["En retard en fin de mois", E.filter(x => x.prevu < e && x.date <= e && !(x.retour && x.retour <= e)).length],
        ["Membres inscrits", S.membres.filter(x => (x.inscription || "") <= e).length], ["Nouveaux membres", S.membres.filter(x => inM(x.inscription)).length],
        ["Lecteurs actifs", new Set(loansM.map(x => x.membre)).size], ["Amendes du mois", fc(E.filter(x => inM(x.retour)).reduce((a, x) => a + x.amende, 0))],
        ["dont encaissées", fc(E.filter(x => inM(x.retour) && x.paye).reduce((a, x) => a + x.amende, 0))]];
      const cats = p.categories.map(c => { const bs = S.livres.filter(b => b.categorie === c); const ids = new Set(bs.map(b => b.id)); const ex = bs.reduce((a, b) => a + (+b.ex || 0), 0);
        const em = loansM.filter(x => ids.has(x.livre)).length, so = E.filter(x => ids.has(x.livre) && x.date <= e && !(x.retour && x.retour <= e)).length;
        return { c, t: bs.length, ex, em, so }; }).filter(r => r.t);
      const tot = cats.reduce((a, r) => ({ t: a.t + r.t, ex: a.ex + r.ex, em: a.em + r.em, so: a.so + r.so }), { t: 0, ex: 0, em: 0, so: 0 });
      const cnt = {}; loansM.forEach(x => cnt[x.livre] = (cnt[x.livre] || 0) + 1);
      const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 10);
      const byClass = {}; loansM.forEach(x => { const c = x.m ? x.m.classe : "—"; (byClass[c] = byClass[c] || { n: 0, mem: new Set() }).n++; byClass[c].mem.add(x.membre); });
      const classes = Object.entries(byClass).sort((a, b) => b[1].n - a[1].n);
      return { ...base, title: "Rapport mensuel de la bibliothèque", sections: [
        { title: "Activité du mois", kpis: k },
        { title: "Fonds et emprunts par catégorie", table: { head: ["Catégorie", "Titres", "Exemplaires", "Emprunts du mois", "Part", "Sortis (fin de mois)", "Disponibles"], align: ["l", "c", "c", "c", "c", "c", "c"],
          body: cats.map(r => [r.c, r.t, r.ex, r.em, (tot.em ? Math.round(r.em / tot.em * 100) : 0) + " %", r.so, r.ex - r.so]),
          foot: ["Total", tot.t, tot.ex, tot.em, "100 %", tot.so, tot.ex - tot.so] } },
        { title: "Les livres les plus empruntés", table: { head: ["#", "Titre", "Auteur", "Catégorie", "Emprunts"], align: ["c", "l", "l", "l", "c"], bold: [1],
          body: top.map(([id, n], i) => { const b = D.livres.get(id); return [i + 1, b ? b.titre : id, b ? b.auteur : "", b ? b.categorie : "", n]; }) }, empty: "Aucun emprunt ce mois-ci." },
        { title: "Emprunts par classe", table: { head: ["Classe", "Emprunts", "Lecteurs différents", "Part des emprunts"], align: ["l", "c", "c", "c"],
          body: classes.map(([c, v]) => [c, v.n, v.mem.size, (loansM.length ? Math.round(v.n / loansM.length * 100) : 0) + " %"]) }, empty: "Aucun emprunt ce mois-ci." },
      ] };
    }
    const four = D.fournitures.map(f => { let e0 = 0, s0 = 0, en = 0, so = 0;
      S.mouvements.forEach(mv => { if (mv.article !== f.id) return; const q = +mv.qte || 0; if (mv.date < s) mv.type === "entree" ? e0 += q : s0 += q; else if (mv.date <= e) mv.type === "entree" ? en += q : so += q; });
      const debut = (+f.initial || 0) + e0 - s0, fin = debut + en - so; return { f, debut, en, so, fin, etat: fin <= 0 ? "rupture" : fin <= f.seuil ? "faible" : "ok", valeur: fin * (+f.prix || 0) }; });
    const mvts = S.mouvements.filter(x => inM(x.date)).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1));
    const byT = {}; mvts.filter(x => x.type === "sortie").forEach(x => { const f = D.fmap.get(x.article); const k = x.tiers || "Non précisé"; (byT[k] = byT[k] || { q: 0, v: 0 }); byT[k].q += +x.qte || 0; byT[k].v += (+x.qte || 0) * (f ? +f.prix || 0 : 0); });
    const tot = four.reduce((a, x) => ({ d: a.d + x.debut, e: a.e + x.en, s: a.s + x.so, f: a.f + x.fin, v: a.v + x.valeur }), { d: 0, e: 0, s: 0, f: 0, v: 0 });
    return { ...base, title: "Rapport mensuel des fournitures", sections: [
      { title: "Synthèse du mois", kpis: [["Articles suivis", four.length], ["Unités entrées", tot.e], ["Unités sorties", tot.s], ["Valeur des sorties", fc(Object.values(byT).reduce((a, x) => a + x.v, 0))], ["Valeur du stock (fin de mois)", fc(tot.v)],
        ["En rupture", four.filter(x => x.etat === "rupture").length], ["Stock faible", four.filter(x => x.etat === "faible").length], ["Mouvements enregistrés", mvts.length]] },
      { title: "État du stock", table: { head: ["Article", "Unité", "Début", "Entrées", "Sorties", "Fin", "Seuil", "Statut", "Valeur"], align: ["l", "l", "c", "c", "c", "c", "c", "l", "r"], bold: [0, 5], status: 7,
        body: four.map(x => [x.f.article, x.f.unite, x.debut, x.en || "–", x.so || "–", x.fin, x.f.seuil, ST_TXT[x.etat], fc(x.valeur)]),
        foot: [`Total · ${four.length} articles`, "", tot.d, tot.e, tot.s, tot.f, "", `${four.filter(x => x.etat !== "ok").length} alertes`, fc(tot.v)] }, empty: "Aucun article." },
      { title: "Mouvements du mois", table: { head: ["Date", "Article", "Type", "Quantité", "Bénéficiaire / fournisseur", "Remarque"], align: ["l", "l", "l", "c", "l", "l"],
        body: mvts.map(x => { const f = D.fmap.get(x.article); return [fmtD(x.date), f ? f.article : x.article, x.type === "entree" ? "Entrée" : "Sortie", x.qte, x.tiers || "", x.note || ""]; }) }, empty: "Aucun mouvement ce mois-ci." },
      { title: "Sorties par bénéficiaire", table: { head: ["Bénéficiaire", "Unités sorties", "Valeur"], align: ["l", "c", "r"],
        body: Object.entries(byT).sort((a, b) => b[1].q - a[1].q).map(([k, v]) => [k, v.q, fc(v.v)]) }, empty: "Aucune sortie ce mois-ci." },
    ] };
  }
  base.period = "Situation au " + fmtLong(T);
  if (kind === "retards") {
    const late = E.filter(x => x.statut === "retard").sort((a, b) => (a.m ? a.m.classe : "").localeCompare(b.m ? b.m.classe : "", "fr") || (a.m ? a.m.nom : "").localeCompare(b.m ? b.m.nom : "", "fr"));
    const unpaid = E.filter(x => x.retour && x.amende && !x.paye).sort((a, b) => a.retour < b.retour ? 1 : -1);
    const dues = late.reduce((a, x) => a + x.amende, 0), up = unpaid.reduce((a, x) => a + x.amende, 0);
    return { ...base, title: "Retards et amendes", sections: [
      { title: "Synthèse", kpis: [["Livres en retard", late.length], ["Membres concernés", new Set(late.map(x => x.membre)).size], ["Amendes des retards en cours", fc(dues)], ["Amendes impayées (livres rendus)", fc(up)], ["Total à encaisser", fc(dues + up)]] },
      { title: "Livres à récupérer", table: { head: ["Classe", "Membre", "Livre", "Sorti le", "À rendre le", "Jours", "Amende"], align: ["l", "l", "l", "l", "l", "c", "r"], bold: [1],
        body: late.map(x => [x.m ? x.m.classe : "", x.m ? x.m.nom : x.membre, x.b ? x.b.titre : x.livre, fmtD(x.date), fmtD(x.prevu), x.jours, fc(x.amende)]),
        foot: ["Total", "", "", "", "", "", fc(dues)] }, empty: "Aucun livre en retard." },
      { title: "Amendes impayées sur des livres déjà rendus", table: { head: ["Membre", "Classe", "Livre", "Rendu le", "Jours de retard", "Amende"], align: ["l", "l", "l", "l", "c", "r"], bold: [0],
        body: unpaid.map(x => [x.m ? x.m.nom : x.membre, x.m ? x.m.classe : "", x.b ? x.b.titre : x.livre, fmtD(x.retour), x.jours, fc(x.amende)]),
        foot: ["Total", "", "", "", "", fc(up)] }, empty: "Aucune amende impayée." },
    ] };
  }
  const books = [...D.livres.values()].sort((a, b) => a.categorie.localeCompare(b.categorie, "fr") || a.titre.localeCompare(b.titre, "fr"));
  const t = books.reduce((a, b) => ({ ex: a.ex + (+b.ex || 0), so: a.so + b.sortis }), { ex: 0, so: 0 });
  return { ...base, title: "Inventaire des livres", sections: [
    { title: "Synthèse", kpis: [["Titres", books.length], ["Exemplaires", t.ex], ["Sortis", t.so], ["Disponibles", t.ex - t.so], ["Catégories", new Set(books.map(b => b.categorie)).size]] },
    { title: "Catalogue par catégorie", table: { head: ["Catégorie", "Code", "Titre", "Auteur", "Rayon", "Ex.", "Disp."], align: ["l", "l", "l", "l", "l", "c", "c"], bold: [2],
      body: books.map(b => [b.categorie, b.id, b.titre, b.auteur, b.rayon || "", b.ex, b.dispo]), foot: ["Total", "", `${books.length} titres`, "", "", t.ex, t.ex - t.so] }, empty: "Aucun livre au catalogue." },
  ] };
}

/* ---------- aperçu à l'écran ---------- */
function reportHTML(M) {

  const sec = (s, i) => `<h2>${i + 1}. ${esc(s.title)}</h2>` + (s.kpis ? `<div class="p-kpis">${s.kpis.map(([l, v]) => `<div class="p-kpi"><span>${esc(l)}</span><b>${esc(v)}</b></div>`).join("")}</div>` : "") +
    (s.table ? (s.table.body.length ? `<div class="table-wrap" style="margin:0;padding:0"><table><thead><tr>${s.table.head.map((h, j) => `<th class="${{ c: "c", r: "r" }[s.table.align[j]] || ""}">${esc(h)}</th>`).join("")}</tr></thead>
      <tbody>${s.table.body.map(r => `<tr>${r.map((v, j) => `<td class="${{ c: "c", r: "r" }[s.table.align[j]] || ""}">${s.table.status === j ? `<span class="pill ${tone(v)}">${esc(v)}</span>` : (s.table.bold || []).includes(j) ? `<b>${esc(v)}</b>` : esc(v)}</td>`).join("")}</tr>`).join("")}</tbody>
      ${s.table.foot ? `<tfoot><tr>${s.table.foot.map((v, j) => `<td class="${{ c: "c", r: "r" }[s.table.align[j]] || ""}">${esc(v)}</td>`).join("")}</tr></tfoot>` : ""}</table></div>` : `<p style="color:#7A8B9A">${esc(s.empty || "Aucune donnée.")}</p>`) : "");
  return `<div class="p-head"><img src="${LOGO}" alt=""><div><div class="p-brand">Kivuthèque</div><h1>${esc(M.title)}</h1><div class="p-sub">${esc(M.school)} · Année scolaire ${esc(M.year)}</div>
    <div class="p-meta">${esc(M.period)} · édité le ${esc(M.edited)}</div></div></div><div class="p-bar"></div>
    ${M.sections.map(sec).join("")}
    ${M.signatures ? `<h2>${M.sections.length + 1}. Observations</h2><div class="obs"></div><div class="sign"><div>Établi par<small>Nom, date et signature</small></div><div>Visa de la Direction<small>Nom, date, signature et cachet</small></div></div>` : ""}`;
}
function reportView() {
  if (!ui.month) { const d = parse(todayISO().slice(0, 8) + "01"); d.setMonth(d.getMonth() - 1); ui.month = iso(d).slice(0, 7); }

        doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...NAVY); doc.text(pdfSafe(v), x + 2, y + 11.5); });

const isbnDigits = s => String(s || "").toUpperCase().replace(/[^0-9X]/g, "");
/* renvoie l'ISBN-13 valide (978/979…) ou "" ; accepte un ISBN-10 */
function cleanIsbn(s) {

  }

async function netJSON(url) {

/* catégorie de l'école la plus proche des sujets trouvés */
const CAT_HINTS = [
  [/afric|congo|camara|kourouma|senghor|achebe|ngugi|ba,? mariama|oyono|beti|mabanckou/, ["Littérature africaine"]],
  [/juvenile|jeunesse|children|enfant|conte|fairy|album|bande dessin|comic/, ["Jeunesse"]],
  [/math|algebr|g[ée]om[ée]tr|arithm|calcul|statisti/, ["Mathématiques"]],
  [/comput|informati|programm|internet|logiciel|software|code\b|python|java/, ["Informatique"]],
  [/histor|g[ée]ograph|geograph|world war|guerre|civilisation|atlas/, ["Histoire-Géo"]],
  [/dictionar|dictionn|encyclop|reference|r[ée]f[ée]rence|grammaire|grammar/, ["Référence", "Langues"]],
  [/language|langue|english|anglais|fran[cç]ais|swahili|lingala|linguisti|vocabula/, ["Langues"]],
  [/scien|biolog|chimi|chemis|physi|nature|m[ée]decin|medic|astronom|ecolog|environnement/, ["Sciences"]],
  [/fiction|roman|novel|po[ée]s|poetry|th[ée][aâ]tre|drama|litt[ée]rature|literature/, ["Roman"]],

function guessCategory(r) {
  const cats = params().categories, txt = norm([...(r.cats || []), r.titre, r.auteur].join(" "));
  for (const [re, names] of CAT_HINTS) if (re.test(txt)) { const c = names.find(n => cats.includes(n)); if (c) return c; }

async function searchBooks(q) {

  const [g, o] = await Promise.allSettled([
    netJSON(`https://www.googleapis.com/books/v1/volumes?q=${isbn ? "isbn:" + isbn : enc(q)}&maxResults=12&printType=books`),
    netJSON(`https://openlibrary.org/search.json?${isbn ? "isbn=" + isbn : "q=" + enc(q)}&limit=10&fields=key,title,subtitle,author_name,first_publish_year,publisher,isbn,cover_i,subject,number_of_pages_median`),
  ]);
  if (g.status === "rejected" && o.status === "rejected") throw g.reason;
  const out = [];
  ((g.value && g.value.items) || []).forEach(it => {
    const v = it.volumeInfo || {}; const ids = v.industryIdentifiers || [];
    const i13 = (ids.find(x => x.type === "ISBN_13") || {}).identifier, i10 = (ids.find(x => x.type === "ISBN_10") || {}).identifier;
    if (!v.title) return;
    out.push({ titre: v.title + (v.subtitle && v.title.length < 40 ? " : " + v.subtitle : ""), auteur: (v.authors || []).slice(0, 3).join(", "), editeur: v.publisher || "",

      cats: v.categories || [], resume: (v.description || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(), pages: v.pageCount || "", src: "Google Livres" });
  });
  ((o.value && o.value.docs) || []).forEach(d => {
    if (!d.title) return;
    const i = isbn || (d.isbn || []).map(cleanIsbn).find(Boolean) || "";
    out.push({ titre: d.title + (d.subtitle && d.title.length < 40 ? " : " + d.subtitle : ""), auteur: (d.author_name || []).slice(0, 3).join(", "), editeur: (d.publisher || [])[0] || "",
      annee: d.first_publish_year ? String(d.first_publish_year) : "", isbn: i, img: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : "",
      cats: (d.subject || []).slice(0, 12), resume: "", pages: d.number_of_pages_median || "", src: "Open Library" });
  });
  /* fusion des doublons : on complète la fiche Google avec Open Library */
  const seen = new Map(), res = [];
  out.forEach(r => {
    const k = r.isbn || norm(r.titre + "|" + r.auteur.split(",")[0]); const prev = seen.get(k);
    if (prev) { ["auteur", "editeur", "annee", "img", "resume", "pages"].forEach(f => { if (!prev[f] && r[f]) prev[f] = r[f]; }); prev.cats = prev.cats.concat(r.cats); return; }
    seen.set(k, r); res.push(r);
  });
  return res.slice(0, 16);
}
