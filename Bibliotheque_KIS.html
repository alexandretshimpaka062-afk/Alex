/* Layout : rail de verre flottant à gauche + scène principale ; barre d'onglets façon iOS sous 900px.

  --green:#2E9E45; --green-soft:rgba(46,158,69,.13);
  --star:#F2C200;
  --warn:#C77700; --warn-soft:rgba(232,149,0,.14);
  --danger:#D93A40; --danger-soft:rgba(217,58,64,.12);
  --orb-1:rgba(0,174,239,.42); --orb-2:rgba(57,181,74,.30); --orb-3:rgba(255,210,0,.20);
  --shadow:0 1px 1px rgba(11,34,53,.04),0 8px 24px -8px rgba(11,34,53,.14);
  --shadow-lg:0 30px 80px -20px rgba(11,34,53,.35);
  --c1:#00AEEF; --c2:#0B5C8A; --c3:#39B54A; --c4:#F2C200; --c5:#7CCBEE; --c6:#F27D5E; --c7:#8A6CE0; --c8:#8DA2B4; --c9:#1FB5A4;
  --display:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050C13; --bg-2:#08131D;
  --glass:rgba(16,30,44,.62); --glass-strong:rgba(18,34,50,.88); --solid:#0E1B27;
  --line:rgba(200,225,245,.08); --line-2:rgba(200,225,245,.16);
  --ink:#E8F2FA; --ink-2:#9FB4C6; --ink-3:#62798D;
  --accent:#2EC4FF; --accent-ink:#04121C; --accent-soft:rgba(46,196,255,.14);
  --green:#4CD066; --green-soft:rgba(76,208,102,.14);
  --star:#FFD84A;
  --warn:#FFB224; --warn-soft:rgba(255,178,36,.14);
  --danger:#FF6369; --danger-soft:rgba(255,99,105,.14);
  --orb-1:rgba(0,150,214,.34); --orb-2:rgba(46,158,69,.22); --orb-3:rgba(255,210,0,.10);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -10px rgba(0,0,0,.6);
  --shadow-lg:0 30px 90px -20px rgba(0,0,0,.8);
  --c2:#3F8FC4; --c8:#7D93A6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050C13; --bg-2:#08131D;
  --glass:rgba(16,30,44,.62); --glass-strong:rgba(18,34,50,.88); --solid:#0E1B27;
  --line:rgba(200,225,245,.08); --line-2:rgba(200,225,245,.16);
  --ink:#E8F2FA; --ink-2:#9FB4C6; --ink-3:#62798D;
  --accent:#2EC4FF; --accent-ink:#04121C; --accent-soft:rgba(46,196,255,.14);
  --green:#4CD066; --green-soft:rgba(76,208,102,.14);
  --star:#FFD84A;
  --warn:#FFB224; --warn-soft:rgba(255,178,36,.14);
  --danger:#FF6369; --danger-soft:rgba(255,99,105,.14);
  --orb-1:rgba(0,150,214,.34); --orb-2:rgba(46,158,69,.22); --orb-3:rgba(255,210,0,.10);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -10px rgba(0,0,0,.6);
  --shadow-lg:0 30px 90px -20px rgba(0,0,0,.8);
  --c2:#3F8FC4; --c8:#7D93A6;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;text-wrap:balance;margin:0}
svg{display:block}

/* ---------- ciel animé ---------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky i{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.sky i:nth-child(1){width:46vw;height:46vw;left:-8vw;top:-14vw;background:var(--orb-1);animation:drift1 26s ease-in-out infinite alternate}
.sky i:nth-child(2){width:40vw;height:40vw;right:-10vw;top:22vh;background:var(--orb-2);animation:drift2 32s ease-in-out infinite alternate}
.sky i:nth-child(3){width:30vw;height:30vw;left:30vw;bottom:-16vw;background:var(--orb-3);animation:drift3 38s ease-in-out infinite alternate}
.sky::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(180deg,rgba(0,0,0,.5),transparent 70%)}
@keyframes drift1{to{transform:translate(12vw,10vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-14vw,-8vh) scale(.9)}}
@keyframes drift3{to{transform:translate(10vw,-12vh) scale(1.2)}}

/* ---------- structure ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%;gap:0}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - 32px);margin:16px 0 16px 16px;padding:18px 14px;display:flex;flex-direction:column;gap:6px;
  background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 16px}
.logo-tile{width:52px;height:52px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(0,150,214,.55);flex:none;overflow:hidden}
.logo-tile img{width:40px;height:auto}
.brand b{display:block;font-family:var(--display);font-size:17px;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink-3);font-size:12px}
.nav-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px 4px}
.nav{display:flex;flex-direction:column;gap:2px;position:relative}
.nav button{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-2);font-weight:550;transition:color .2s,background .2s}
.nav button:hover{background:var(--accent-soft);color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button .ic{width:20px;height:20px;flex:none}
.nav button .count{margin-left:auto;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--danger-soft);color:var(--danger)}
.nav-pill{position:absolute;left:0;right:0;height:42px;border-radius:12px;background:var(--glass-strong);box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .45s var(--spring),opacity .2s;z-index:-1}
.nav-pill::before{content:"";position:absolute;left:-1px;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--accent)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.today-card{padding:14px;border-radius:16px;background:linear-gradient(135deg,var(--accent-soft),var(--green-soft));border:1px solid var(--line)}
.today-card h4{margin:0 0 8px;font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.today-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--ink-2)}
.today-row b{color:var(--ink)}
.today-row.alert b{color:var(--danger)}
.made{font-size:11px;color:var(--ink-3);padding:0 6px;opacity:.75}
.mode-chip{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);padding:0 6px}
.mode-chip i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.mode-chip.loading i{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}

.main{min-width:0;padding:22px 28px 60px;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:12px 0 10px;margin-top:-12px}
.topbar::before{content:"";position:absolute;inset:-14px -28px -8px;background:linear-gradient(var(--bg) 82%,transparent);opacity:.97;z-index:-1;pointer-events:none}
.titles{flex:1;min-width:0}
.eyebrow{margin:0 0 2px;color:var(--ink-3);font-size:13px;font-weight:550}
.titles h1{font-size:clamp(28px,3.4vw,40px);font-weight:750;line-height:1.05}
.search-pill{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;min-width:min(320px,100%);border-radius:14px;background:var(--glass);border:1px solid var(--line);color:var(--ink-3);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:border-color .2s,transform .2s}
.search-pill:hover{border-color:var(--line-2);transform:translateY(-1px)}
.search-pill kbd{margin-left:auto;font:600 11px var(--mono);padding:3px 6px;border-radius:6px;border:1px solid var(--line-2);color:var(--ink-3)}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);color:var(--ink-2);transition:transform .2s,color .2s}
.icon-btn:hover{color:var(--ink);transform:translateY(-1px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:14px;font-weight:650;white-space:nowrap;transition:transform .25s var(--spring),box-shadow .25s,background .2s}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px -10px var(--accent)}
.btn.primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 16px 30px -12px var(--accent)}
.btn.ghost{background:var(--glass);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--line-2)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{height:34px;padding:0 12px;border-radius:11px;font-size:13.5px}
.btn:active{transform:scale(.97)}
.btn .ic{width:18px;height:18px}

/* ---------- vue & animations d'entrée ---------- */
#view{display:flex;flex-direction:column;gap:22px;min-width:0}
.enter>*{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:.001;transform:translateY(18px) scale(.985);filter:blur(6px)}}
.grid{display:grid;gap:18px;min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.cols-3{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(0,.95fr)}
.cols-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cols-21{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:1280px){.cols-3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols-3>.span-wide{grid-column:1/-1}}
@media (max-width:900px){.cols-3,.cols-2,.cols-21{grid-template-columns:minmax(0,1fr)}}

.card{position:relative;min-width:0;background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);padding:20px;overflow:hidden}
.card.spot::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,-40%),var(--accent-soft),transparent 45%);opacity:0;transition:opacity .3s}
.card.spot:hover::after{opacity:1}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:17px;font-weight:650}
.card-h .sub{color:var(--ink-3);font-size:13px}
.card-h .more{white-space:nowrap;margin-left:auto;color:var(--accent);font-weight:650;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.card-h .more:hover{gap:8px}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;cursor:pointer;transition:transform .35s var(--spring),border-color .2s}
.kpi:hover{transform:translateY(-3px);border-color:var(--line-2)}
.kpi .k-top{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13px;font-weight:600}
.kpi .k-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--tone-soft,var(--accent-soft));color:var(--tone,var(--accent))}
.kpi .k-ic svg{width:18px;height:18px}
.kpi .k-val{font:750 38px/1 var(--display);letter-spacing:-.03em}
.kpi .k-sub{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.trend{font-weight:700;padding:1px 7px;border-radius:99px;font-size:11.5px}
.trend.up{background:var(--green-soft);color:var(--green)}
.trend.down{background:var(--danger-soft);color:var(--danger)}
.kpi .spark{position:absolute;right:12px;top:16px;width:84px;height:30px;opacity:.9}

/* pastilles */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.mute{background:var(--line);color:var(--ink-2)}

/* listes */
.rows{display:flex;flex-direction:column}
.row{display:grid;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .t{font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .s{color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .num{font:700 15px var(--display);text-align:right}
.avatar{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font:700 13px var(--display);color:#fff;flex:none}
.mini-cover{width:30px;height:42px;border-radius:5px 7px 7px 5px;flex:none;box-shadow:inset 3px 0 0 rgba(0,0,0,.18),0 4px 10px -4px rgba(0,0,0,.35)}
.empty{padding:26px 10px;text-align:center;color:var(--ink-3);font-size:14px}

/* tableau */
.table-wrap{overflow-x:auto;margin:0 -20px -20px;padding:0 20px 8px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{font:650 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--accent-soft)}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
td .t{font-weight:620}
td .s{color:var(--ink-3);font-size:12.5px}
.code{font:600 12px var(--mono);color:var(--ink-3)}
.row-actions{display:flex;gap:4px;justify-content:flex-end;opacity:.5;transition:opacity .2s}
tr:hover .row-actions{opacity:1}
.act{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2)}
.act:hover{background:var(--glass-strong);color:var(--ink)}
.act svg{width:17px;height:17px}

/* barre d'outils de liste */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field-search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line);flex:1;min-width:200px;max-width:420px}
.field-search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.field-search svg{width:17px;height:17px;color:var(--ink-3)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line);position:relative}
.seg button{position:relative;z-index:1;height:32px;padding:0 13px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--solid);box-shadow:var(--shadow)}
.seg button svg{width:18px;height:18px}
.seg button .n{font-size:11px;color:var(--ink-3);margin-left:4px}
select.flat{height:40px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line);padding:0 12px}

/* couvertures */
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.book{display:flex;flex-direction:column;gap:9px;cursor:pointer;text-align:left;perspective:800px}
.cover{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:6px 12px 12px 6px;padding:14px 12px 12px 18px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden;
  background:linear-gradient(155deg,var(--cv1),var(--cv2));box-shadow:inset 6px 0 0 rgba(0,0,0,.16),inset 7px 0 0 rgba(255,255,255,.18),0 18px 30px -16px rgba(0,0,0,.55);transition:transform .5s var(--spring),box-shadow .4s;transform-origin:left center}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);transform:translateX(-120%);transition:transform .8s var(--ease)}
.book:hover .cover{transform:rotateY(-14deg) translateY(-4px);box-shadow:inset 6px 0 0 rgba(0,0,0,.16),inset 7px 0 0 rgba(255,255,255,.18),18px 26px 40px -18px rgba(0,0,0,.6)}
.book:hover .cover::after{transform:translateX(120%)}
.cover .cv-cat{font:700 9.5px var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.cover .cv-title{font:700 17px/1.08 var(--display);letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.cover .cv-author{font-size:11px;opacity:.85}
.cover .cv-deco{position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;border:14px solid rgba(255,255,255,.12)}
.book .b-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.book .b-title{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avail{font:700 12px var(--display);white-space:nowrap}
.avail.ok{color:var(--green)}.avail.warn{color:var(--warn)}.avail.bad{color:var(--danger)}

/* graphiques */
.chart{width:100%;height:auto;overflow:visible}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--ink-3);font:11px var(--body)}
.chart .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s var(--ease) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .area{opacity:0;animation:fade .9s ease .9s forwards}
@keyframes fade{to{opacity:1}}
.chart .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .8s var(--spring) both;animation-delay:calc(var(--d) * 18ms)}
@keyframes grow{from{transform:scaleY(0)}}
.chart .hit:hover~.x{opacity:1}
.chart-wrap{position:relative}
.tip{position:absolute;pointer-events:none;padding:8px 10px;border-radius:10px;background:var(--glass-strong);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:12.5px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .15s;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tip b{font-family:var(--display)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.stats div{padding:12px 14px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line)}
.stats span{display:block;font-size:12px;color:var(--ink-3)}
.stats b{font:750 22px var(--display);letter-spacing:-.02em}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.donut-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;align-items:center}
.donut-box svg{max-width:190px;margin:0 auto;width:100%}
.donut-box svg circle.seg{transition:stroke-dasharray 1.2s var(--ease),stroke-dashoffset 1.2s var(--ease)}
.donut-center{font:800 30px var(--display);fill:var(--ink)}
.donut-center-s{font:600 11px var(--body);fill:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.d-legend{display:flex;flex-direction:column;gap:7px;min-width:0}
.d-legend div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:9px;align-items:center;font-size:13px}
.d-legend i{width:10px;height:10px;border-radius:3px}
.d-legend span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.d-legend b{font-family:var(--display)}
@media (max-width:420px){.donut-box{grid-template-columns:minmax(0,1fr)}}

/* jauges stock */

/* ============================================================ utilitaires */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = (n, l = 2) => String(n).padStart(l, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

const COLS = ["livres", "membres", "emprunts", "fournitures", "mouvements"];
const LS_KEY = "kis-bibliotheque-v1";
const S = { livres: [], membres: [], emprunts: [], fournitures: [], mouvements: [], params: null };
const store = { mode: "loading", db: null, loaded: new Set(), ready: false };

const DESKTOP = window.desktop || null;
function lsRead() { if (DESKTOP) { try { return DESKTOP.load(); } catch { return null; } } try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch { return null; } }
function lsWrite() { if (store.mode !== "local") return; if (DESKTOP) { DESKTOP.save(JSON.stringify(S)); return; } try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch { toast("Impossible d'enregistrer dans ce navigateur", true); } }

async function initStore() {
  let db = null;
  if (window.claude && typeof window.claude.use === "function") { try { db = await window.claude.use("db"); } catch { db = null; } }
  if (db) {
    store.mode = "db"; store.db = db;
    COLS.forEach(c => db.collection(c).onSnapshot(snap => {
      S[c] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      store.loaded.add(c); onData();
    }, e => { store.loaded.add(c); onData(); if (e && e.code !== "not_granted") toast("Synchronisation interrompue : " + e.message, true); }));
    db.doc("config/params").onSnapshot(snap => { S.params = snap.exists ? snap.data() : null; store.loaded.add("params"); onData(); },
      () => { store.loaded.add("params"); onData(); });
  } else {
    store.mode = "local";
    const saved = lsRead();
    if (saved) Object.assign(S, saved);
    store.loaded = new Set([...COLS, "params"]); onData();
  }
}

async function put(col, obj) {
  const i = S[col].findIndex(x => x.id === obj.id);
  if (i >= 0) S[col][i] = obj; else S[col].push(obj);
  onData(true);
  if (store.mode === "db") { const { id, ...data } = obj; try { await store.db.collection(col).doc(id).set(data); } catch (e) { writeError(e); } }
  else lsWrite();
}
async function del(col, id) {
  S[col] = S[col].filter(x => x.id !== id); onData(true);
  if (store.mode === "db") { try { await store.db.collection(col).doc(id).delete(); } catch (e) { writeError(e); } } else lsWrite();
}
async function saveParams(p) {
  S.params = p; onData(true);
  if (store.mode === "db") { try { await store.db.doc("config/params").set(p); } catch (e) { writeError(e); } } else lsWrite();
}
function writeError(e) {
  const msg = e && (e.code === "not_granted" || e.code === "revoked") ? "Vous avez un accès en lecture seule : la modification n'a pas été enregistrée."
    : e && e.code === "quota_exceeded" ? "L'espace de stockage est plein : supprimez d'anciens enregistrements."
    : "La modification n'a pas pu être enregistrée. Réessayez.";
  toast(msg, true);
}
async function bulkReplace(data, label) {
  const ops = [];
  COLS.forEach(c => { S[c].forEach(x => ops.push(["del", c, x.id])); (data[c] || []).forEach(x => ops.push(["set", c, x])); });
  const params = { ...(S.params || DEFAULT_PARAMS), ...(data.params || {}), initialized: true };
  if (store.mode === "local") { COLS.forEach(c => S[c] = (data[c] || []).slice()); S.params = params; lsWrite(); onData(true); return; }
  const ov = progressOverlay(label);
  let done = 0; const total = ops.length;
  const run = async op => {
    const [kind, c, x] = op;
    try { if (kind === "del") await store.db.collection(c).doc(x).delete(); else { const { id, ...d } = x; await store.db.collection(c).doc(id).set(d); } }
    catch (e) { if (e && (e.code === "resource_exhausted" || e.code === "unavailable")) { await new Promise(r => setTimeout(r, 800)); return run(op); } throw e; }
    ov.set(++done / total);
  };
  try {
    const queue = ops.slice(); const workers = Array.from({ length: 5 }, async () => { while (queue.length) await run(queue.shift()); });
    await Promise.all(workers);
    await store.db.doc("config/params").set(params);
    ov.close(); toast(label.replace("…", "") + " : terminé");
  } catch (e) { ov.close(); writeError(e); }
}

function smooth(pts) {
  if (pts.length < 2) return "";
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const t = .18; let c1y = p1[1] + (p2[1] - p0[1]) * t, c2y = p2[1] - (p3[1] - p1[1]) * t;
    const lo = Math.min(p1[1], p2[1]), hi = Math.max(p1[1], p2[1]); c1y = Math.max(lo, Math.min(hi, c1y)); c2y = Math.max(lo, Math.min(hi, c2y));
    d += ` C${p1[0] + (p2[0] - p0[0]) * t},${c1y} ${p2[0] - (p3[0] - p1[0]) * t},${c2y} ${p2[0]},${p2[1]}`;
  }
  return d;
}
function areaChart(labels, series) {
  const W = 640, H = 260, L = 28, R = 6, Tp = 10, B = 26, n = labels.length, slot = (W - L - R) / n;
  const max = Math.max(2, ...series.flatMap(s => s.values)); const top = Math.ceil(max / 2) * 2;
  const y = v => Tp + (H - Tp - B) * (1 - v / top);
  const ticks = [0, top / 2, top];
  let g = ticks.map(t => `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join("");
  g += labels.map((l, i) => { const wd = parse(l).getDay(); return (wd === 0 || wd === 6) ? `<rect x="${L + i * slot}" y="${Tp}" width="${slot}" height="${H - Tp - B}" fill="var(--line)" opacity=".45"/>` : ""; }).join("");
  g += labels.map((l, i) => i % 5 === 4 || i === 0 ? `<text class="axis" x="${L + i * slot + slot / 2}" y="${H - 6}" text-anchor="middle">${fmtShort(l)}</text>` : "").join("");
  const bw = Math.max(3, slot * .3), gap = 1.5;
  const bars = labels.map((l, i) => series.map((s, si) => { const v = s.values[i]; if (!v) return "";
    const x = L + i * slot + slot / 2 + (si ? gap / 2 : -bw - gap / 2), yy = y(v), h = y(0) - yy;
    return `<rect class="bar" x="${x}" y="${yy}" width="${bw}" height="${h}" rx="${Math.min(3, bw / 2)}" fill="${s.color}" style="--d:${i}"/>`; }).join("")).join("");
  const hits = labels.map((l, i) => `<rect class="hit" x="${L + i * slot}" y="${Tp}" width="${slot}" height="${H - Tp - B}" fill="transparent" data-i="${i}"/>`).join("");
  return `<div class="chart-wrap" data-chart='${esc(JSON.stringify({ labels, series: series.map(s => ({ n: s.name, c: s.color, v: s.values })) }))}'>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Emprunts et retours par jour sur 30 jours (week-ends grisés)">${g}${bars}<line class="cross" x1="0" x2="0" y1="${Tp}" y2="${H - B}" stroke="var(--line-2)" stroke-dasharray="3 4" opacity="0"/>${hits}</svg><div class="tip"></div></div>`;
}
function donut(items, total, unit) {
  const r = 62, C = 2 * Math.PI * r; let acc = 0;
  const segs = items.map(it => { const len = total ? it.value / total * C : 0; const gap = items.length > 1 ? Math.min(3, len * .3) : 0;
    const s = `<circle class="seg" cx="80" cy="80" r="${r}" fill="none" stroke="${it.color}" stroke-width="20" stroke-linecap="butt" stroke-dasharray="0 ${C}" stroke-dashoffset="${-acc}" data-dash="${Math.max(0, len - gap)} ${C}" data-off="${-acc}" transform="rotate(-90 80 80)"><title>${esc(it.label)} : ${it.value}</title></circle>`;
    acc += len; return s; }).join("");

    <text class="donut-center" x="80" y="82" text-anchor="middle">${nf(total)}</text><text class="donut-center-s" x="80" y="100" text-anchor="middle">${unit}</text></svg>
    <div class="d-legend">${items.map(it => `<div><i style="background:${it.color}"></i><span>${esc(it.label)}</span><b>${nf(it.value)}</b></div>`).join("")}</div></div>`;

/* ---------- rapport ---------- */
function monthBounds(m) { const s = m + "-01"; const e = parse(s); e.setMonth(e.getMonth() + 1); e.setDate(0); return [s, iso(e)]; }
function reportData(m) {

  const k = {
    emprunts: E.filter(x => inM(x.date)).length, retours: E.filter(x => inM(x.retour)).length,
    retoursRetard: E.filter(x => inM(x.retour) && x.retour > x.prevu).length,
    sortis: E.filter(x => x.date <= e && !(x.retour && x.retour <= e)).length,
    retard: E.filter(x => x.prevu < e && x.date <= e && !(x.retour && x.retour <= e)).length,
    inscrits: S.membres.filter(x => x.inscription <= e).length, nouveaux: S.membres.filter(x => inM(x.inscription)).length,
    titres: S.livres.length, amendes: E.filter(x => inM(x.retour)).reduce((a, x) => a + x.amende, 0),
    encaisse: E.filter(x => inM(x.retour) && x.paye).reduce((a, x) => a + x.amende, 0),
  };
  const cats = p.categories.map(c => { const bs = S.livres.filter(b => b.categorie === c); const ex = bs.reduce((a, b) => a + (+b.ex || 0), 0);
    const ids = new Set(bs.map(b => b.id)); const em = E.filter(x => ids.has(x.livre) && inM(x.date)).length; const so = E.filter(x => ids.has(x.livre) && x.date <= e && !(x.retour && x.retour <= e)).length;
    return { c, titres: bs.length, ex, em, so, dispo: ex - so }; }).filter(r => r.titres);
  const cnt = {}; E.filter(x => inM(x.date)).forEach(x => cnt[x.livre] = (cnt[x.livre] || 0) + 1);
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id, n]) => ({ b: D.livres.get(id), n }));
  const four = D.fournitures.map(f => { let ent0 = 0, sor0 = 0, ent = 0, sor = 0;
    S.mouvements.forEach(mv => { if (mv.article !== f.id) return; const q = +mv.qte || 0; if (mv.date < s) mv.type === "entree" ? ent0 += q : sor0 += q; else if (mv.date <= e) mv.type === "entree" ? ent += q : sor += q; });
    const debut = (+f.initial || 0) + ent0 - sor0, fin = debut + ent - sor; return { f, debut, ent, sor, fin, etat: fin <= 0 ? "rupture" : fin <= f.seuil ? "faible" : "ok", valeur: fin * (+f.prix || 0) }; });
  return { s, e, k, cats, top, four, p };
}

document.addEventListener("click", e => {

  if (d.f) { const [k, val] = d.f.split(":"); ui.filter[k] = val; $$(`[data-f^="${k}:"]`).forEach(b => b.setAttribute("aria-pressed", b.dataset.f === d.f)); $("#list").innerHTML = k === "livres" ? booksList() : loansList(); return; }
  if (d.layout) { ui.layout = d.layout; $$("[data-layout]").forEach(b => b.setAttribute("aria-pressed", b.dataset.layout === ui.layout)); $("#list").innerHTML = booksList(); return; }
  if (d.return) return doReturn(d.return);

  if (d.editBook) { e.stopPropagation(); return bookSheet(S.livres.find(b => b.id === d.editBook)); }

    put("mouvements", { id: nextId(S.mouvements, "MVT-", 4), date: todayISO(), article: id, type, qte: 1, tiers: type === "entree" ? f.fournisseur || "" : "Bibliothèque", note: "Ajustement rapide" }); return; }
  if (d.quick) return ({ loan: () => loanSheet(), return: () => returnPicker(), book: () => bookSheet(), member: () => memberSheet(), move: () => moveSheet(), report: () => go("rapport") })[d.quick]();
  if (d.export) return exportData(d.export);

  if (d.newBook !== undefined) return bookSheet();

  if (d.supply) return supplySheet(S.fournitures.find(f => f.id === d.supply));
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); }
  else if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); openPalette(); }

/* ============================================================ feuilles (panneaux) */
let sheetEl = null;
function openSheet(title, body, foot, onMount) {

function closeSheet(instant) {

const opt = (arr, v) => arr.map(x => `<option ${x === v ? "selected" : ""}>${esc(x)}</option>`).join("");

const req = l => `${l} <span class="req">*</span>`;
/* pied de formulaire commun : Supprimer · Annuler · Enregistrer et ajouter un autre · Enregistrer */
function formFoot(isNew, label = "Enregistrer", again = true) {
  return `${isNew ? "" : `<button class="btn danger" type="button" id="delBtn" style="margin-right:auto">${ic("trash")}Supprimer</button>`}
    <button class="btn ghost" type="button" data-close2>Annuler</button>

function fieldErr(el, id, msg) {
  const f = $("#" + id, el)?.closest(".f"); if (!f) return toast(msg, true);
  f.classList.add("err"); let m = $(".msg", f); if (!m) { m = document.createElement("div"); m.className = "msg"; f.appendChild(m); } m.textContent = msg;
  $("#" + id, el).focus(); f.animate?.([{ transform: "translateX(0)" }, { transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "translateX(0)" }], { duration: 260 });
  return false;

function clearErr(el) { $$(".f.err", el).forEach(f => { f.classList.remove("err"); $(".msg", f)?.remove(); }); }
/* gestion commune : boutons, entrée = enregistrer, compteur d'ajouts en série */
function wireForm(el, { save, view, reset, onDelete }) {
  let added = 0;
  $("[data-close2]", el).onclick = () => closeSheet();
  const run = again => { clearErr(el); const id = save(); if (!id) return;
    if (again) { added++; reset(); const h = $(".panel-h h2", el); let c = $(".added", el); if (!c) { c = document.createElement("span"); c.className = "added"; h.after(c); } c.textContent = added + " ajouté" + (added > 1 ? "s" : ""); c.animate?.([{ transform: "scale(.6)" }, { transform: "scale(1)" }], { duration: 350, easing: "cubic-bezier(.34,1.56,.64,1)" }); $("input:not([type=hidden]),select", el)?.focus(); }
    else { closeSheet(); showAdded(view, id); } };
  $("#saveBtn", el).onclick = () => run(false);
  const a = $("#againBtn", el); if (a) a.onclick = () => run(true);
  const d = $("#delBtn", el); if (d && onDelete) d.onclick = onDelete;
  el.addEventListener("input", e => { const f = e.target.closest(".f.err"); if (f) { f.classList.remove("err"); $(".msg", f)?.remove(); } });
  el.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "search") { e.preventDefault(); run(e.shiftKey); } });
  el.addEventListener("click", e => { const b = e.target.closest("[data-inc],[data-dec]"); if (!b) return; const inp = $("#" + (b.dataset.inc || b.dataset.dec), el);
    const st = +inp.step || 1; inp.value = Math.max(+inp.min || 0, (+inp.value || 0) + (b.dataset.inc ? st : -st)); inp.dispatchEvent(new Event("input", { bubbles: true })); });
}

  if (view === "livres") { ui.q.livres = ""; ui.q.cat = ""; ui.filter.livres = "tous"; }
  if (view === "membres") { ui.q.membres = ""; ui.q.cls = ""; }

  if (ui.view !== view) go(view); else render();
}

      setType(type);

        save: () => { const art = val("mv-a"), q = +val("mv-q"), f = D.fmap.get(art);
          if (!(q >= 1)) return fieldErr(el, "mv-q", "Indiquez une quantité d'au moins 1.");
          if (type === "sortie" && q > f.stock) return fieldErr(el, "mv-q", `Stock insuffisant : ${f.stock} ${f.unite.toLowerCase()} disponible(s).`);
          put("mouvements", { id: nextId(S.mouvements, "MVT-", 4), date: val("mv-d") || todayISO(), article: art, type, qte: q, tiers: val("mv-t"), note: val("mv-n") });
          toast((type === "entree" ? "Entrée" : "Sortie") + " enregistrée · " + q + " " + f.unite.toLowerCase()); derive(); return art; },
        reset: () => { $("#mv-q", el).value = 1; $("#mv-n", el).value = ""; $("#mv-a", el).innerHTML = D.fournitures.map(f => `<option value="${esc(f.id)}">${esc(f.article)} · ${f.stock} en stock</option>`).join(""); recap(); $("#mv-a", el).focus(); } });
    });
}

/* ============================================================ palette ⌘K */
let palEl = null;
function openPalette() {
  if (palEl || !store.ready || !D) return;
  palEl = document.createElement("div"); palEl.className = "palette";
  palEl.innerHTML = `<div class="backdrop"></div><div class="pal" role="dialog" aria-label="Recherche"><div class="pal-in">${ic("search")}<input id="palQ" placeholder="Livre, membre, action…" autocomplete="off"><kbd style="font:600 11px var(--mono);color:var(--ink-3)">esc</kbd></div><div class="pal-list" id="palList"></div></div>`;
  document.body.appendChild(palEl);
  $(".backdrop", palEl).onclick = closePalette;
  const input = $("#palQ", palEl); let items = [], sel = 0;
  const actions = [["Ajouter…", "plus", () => addMenu()], ["Nouvel emprunt", "plus", () => loanSheet()], ["Enregistrer un retour", "ret", () => returnPicker()], ["Ajouter un livre", "book", () => bookSheet()], ["Ajouter un membre", "users", () => memberSheet()], ["Mouvement de stock", "box", () => moveSheet()], ...VIEWS.map(v => ["Aller à : " + v.label, v.icon, () => go(v.id)])];
  const draw = () => {
    const q = norm(input.value); items = [];
    const A = actions.filter(a => !q || norm(a[0]).includes(q)).slice(0, q ? 4 : 6).map(a => ({ g: "Actions", html: `${ic(a[1])}<span class="t">${a[0]}</span>`, run: a[2] }));
    const B = q ? [...D.livres.values()].filter(b => norm(b.titre + " " + b.auteur + " " + b.id + " " + b.isbn).includes(q)).slice(0, 6).map(b => { const [l, t] = bookAvail(b); return { g: "Livres", html: `${miniCover(b)}<div><div class="t">${esc(b.titre)}</div><div class="s">${esc(b.auteur)} · ${esc(b.rayon || "")}</div></div><span class="end">${pill(b.dispo + "/" + b.ex, t)}</span>`, run: () => bookDetail(b.id) }; }) : [];
    const M = q ? [...D.membres.values()].filter(m => norm(m.nom + " " + m.classe + " " + m.id).includes(q)).slice(0, 6).map(m => ({ g: "Membres", html: `${avatar(m)}<div><div class="t">${esc(m.nom)}</div><div class="s">${esc(m.classe)}</div></div>${m.retard ? `<span class="end">${pill("En retard", "bad")}</span>` : ""}`, run: () => memberDetail(m.id) })) : [];
    items = [...B, ...M, ...A]; sel = Math.min(sel, Math.max(0, items.length - 1));
    let g = ""; $("#palList", palEl).innerHTML = items.map((it, i) => (it.g !== g ? `<div class="pal-group">${g = it.g}</div>` : "") + `<button class="pal-item" type="button" data-pi="${i}" aria-selected="${i === sel}">${it.html}</button>`).join("") || '<div class="empty">Aucun résultat.</div>';
    $$("[data-pi]", palEl).forEach(b => { b.onclick = () => run(+b.dataset.pi); b.onpointermove = () => { if (sel !== +b.dataset.pi) { sel = +b.dataset.pi; $$("[data-pi]", palEl).forEach(x => x.setAttribute("aria-selected", +x.dataset.pi === sel)); } }; });
  };
  const run = i => { const it = items[i]; if (!it) return; closePalette(); it.run(); };
  input.addEventListener("input", () => { sel = 0; draw(); });
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % Math.max(1, items.length); $$("[data-pi]", palEl).forEach(x => x.setAttribute("aria-selected", +x.dataset.pi === sel)); $(`[data-pi="${sel}"]`, palEl)?.scrollIntoView({ block: "nearest" }); }
    if (e.key === "Enter") { e.preventDefault(); run(sel); }
  });
  draw(); setTimeout(() => input.focus(), 30);
}
function closePalette() { if (palEl) { palEl.remove(); palEl = null; } }

/* ============================================================ fichiers */
async function saveFile(name, text, mime = "text/html") {
  if (store.mode === "db") {
    let dl = null; try { dl = await window.claude.use("downloads"); } catch {}
    if (!dl) return toast("Le téléchargement n'est pas disponible ici.", true);
    try { const r = await dl.save({ filename: name, data: text }); if (r && r.status === "saved") toast("Fichier enregistré : " + name); } catch (e) { if (e && e.code !== "cancelled" && e.code !== "declined") toast("Le fichier n'a pas pu être enregistré.", true); }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: mime + ";charset=utf-8" })); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast("Fichier enregistré : " + name);
}
function csv(rows) { return "﻿" + rows.map(r => r.map(v => { const s = String(v ?? ""); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(";")).join("\r\n"); }
function exportData(kind) {
  const T = todayISO();
  if (kind === "json") return saveFile(`bibliotheque-kis-sauvegarde-${T}.json`, JSON.stringify({ app: "bibliotheque-kis", version: 1, exportedAt: new Date().toISOString(), params: params(), ...Object.fromEntries(COLS.map(c => [c, S[c]])) }, null, 1), "application/json");
  const t = {
    livres: [["Code", "Titre", "Auteur", "Catégorie", "Éditeur", "Année", "ISBN", "Rayon", "Exemplaires", "Disponibles", "Emprunts"], ...[...D.livres.values()].map(b => [b.id, b.titre, b.auteur, b.categorie, b.editeur, b.annee, b.isbn, b.rayon, b.ex, b.dispo, b.total])],
    membres: [["ID", "Nom", "Type", "Classe", "Sexe", "Inscription", "Emprunts en cours", "En retard", "Amendes dues (FC)"], ...[...D.membres.values()].map(m => [m.id, m.nom, m.type, m.classe, m.sexe, fmtD(m.inscription), m.cours, m.retard, m.dues])],
    emprunts: [["N°", "Date", "ID membre", "Membre", "Code livre", "Livre", "À rendre le", "Rendu le", "Statut", "Jours de retard", "Amende (FC)", "Payée"], ...D.emprunts.map(e => [e.id, fmtD(e.date), e.membre, e.m ? e.m.nom : "", e.livre, e.b ? e.b.titre : "", fmtD(e.prevu), e.retour ? fmtD(e.retour) : "", STAT[e.statut][0], e.jours, e.amende, e.paye ? "Oui" : "Non"])],
    fournitures: [["Code", "Article", "Catégorie", "Unité", "Stock initial", "Entrées", "Sorties", "Stock actuel", "Seuil", "Prix (FC)", "Valeur (FC)", "Fournisseur"], ...D.fournitures.map(f => [f.id, f.article, f.categorie, f.unite, f.initial, f.ent, f.sor, f.stock, f.seuil, f.prix, f.valeur, f.fournisseur])],
  }[kind];
  saveFile(`${kind}-${T}.csv`, csv(t), "text/csv");
}
function importBackup(file) {
  if (!file) return; const r = new FileReader();
  r.onload = () => { let data; try { data = JSON.parse(r.result); } catch { return toast("Ce fichier n'est pas une sauvegarde valide.", true); }
    if (!data || !COLS.some(c => Array.isArray(data[c]))) return toast("Ce fichier ne contient pas de données de bibliothèque.", true);
    confirmSheet("Restaurer cette sauvegarde ?", `${(data.livres || []).length} livres, ${(data.membres || []).length} membres et ${(data.emprunts || []).length} emprunts remplaceront les données actuelles.`, "Restaurer", () => bulkReplace(data, "Restauration…")); };
  r.readAsText(file);
}

function toast(msg, err) {
  const el = document.createElement("div"); el.className = "toast" + (err ? " err" : "");
  el.innerHTML = `<span class="ic">${ic(err ? "alert" : "check")}</span><span>${esc(msg)}</span>`;
  $("#toasts").appendChild(el); setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 300); }, err ? 4200 : 2600);
}
function isDark() { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
$("#themeBtn").addEventListener("click", () => { document.documentElement.dataset.theme = isDark() ? "light" : "dark"; try { localStorage.setItem("kis-theme", document.documentElement.dataset.theme); } catch {} syncChrome(); });
try { const t = localStorage.getItem("kis-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}

buildNav(); render(); initStore();
