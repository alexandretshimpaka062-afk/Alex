/* Layout : rail de verre flottant à gauche + scène principale ; barre d'onglets façon iOS sous 900px.

  --bg:#EDF2F7; --bg-2:#E3EBF3;

  --green:#2E9E45; --green-soft:rgba(46,158,69,.13);
  --star:#F2C200;
  --warn:#C77700; --warn-soft:rgba(232,149,0,.14);
  --danger:#D93A40; --danger-soft:rgba(217,58,64,.12);
  --orb-1:rgba(0,174,239,.42); --orb-2:rgba(57,181,74,.30); --orb-3:rgba(255,210,0,.20);
  --shadow:0 1px 1px rgba(11,34,53,.04),0 8px 24px -8px rgba(11,34,53,.14);
  --shadow-lg:0 30px 80px -20px rgba(11,34,53,.35);
  --c1:#00AEEF; --c2:#0B5C8A; --c3:#39B54A; --c4:#F2C200; --c5:#7CCBEE; --c6:#F27D5E; --c7:#8A6CE0; --c8:#8DA2B4; --c9:#1FB5A4;
  --display:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050C13; --bg-2:#08131D;
  --glass:rgba(16,30,44,.62); --glass-strong:rgba(18,34,50,.88); --solid:#0E1B27;
  --line:rgba(200,225,245,.08); --line-2:rgba(200,225,245,.16);
  --ink:#E8F2FA; --ink-2:#9FB4C6; --ink-3:#62798D;
  --accent:#2EC4FF; --accent-ink:#04121C; --accent-soft:rgba(46,196,255,.14);
  --green:#4CD066; --green-soft:rgba(76,208,102,.14);
  --star:#FFD84A;
  --warn:#FFB224; --warn-soft:rgba(255,178,36,.14);
  --danger:#FF6369; --danger-soft:rgba(255,99,105,.14);
  --orb-1:rgba(0,150,214,.34); --orb-2:rgba(46,158,69,.22); --orb-3:rgba(255,210,0,.10);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -10px rgba(0,0,0,.6);
  --shadow-lg:0 30px 90px -20px rgba(0,0,0,.8);
  --c2:#3F8FC4; --c8:#7D93A6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050C13; --bg-2:#08131D;
  --glass:rgba(16,30,44,.62); --glass-strong:rgba(18,34,50,.88); --solid:#0E1B27;
  --line:rgba(200,225,245,.08); --line-2:rgba(200,225,245,.16);
  --ink:#E8F2FA; --ink-2:#9FB4C6; --ink-3:#62798D;
  --accent:#2EC4FF; --accent-ink:#04121C; --accent-soft:rgba(46,196,255,.14);
  --green:#4CD066; --green-soft:rgba(76,208,102,.14);
  --star:#FFD84A;
  --warn:#FFB224; --warn-soft:rgba(255,178,36,.14);
  --danger:#FF6369; --danger-soft:rgba(255,99,105,.14);
  --orb-1:rgba(0,150,214,.34); --orb-2:rgba(46,158,69,.22); --orb-3:rgba(255,210,0,.10);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -10px rgba(0,0,0,.6);
  --shadow-lg:0 30px 90px -20px rgba(0,0,0,.8);
  --c2:#3F8FC4; --c8:#7D93A6;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;text-wrap:balance;margin:0}
svg{display:block}

/* ---------- ciel animé ---------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky i{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.sky i:nth-child(1){width:46vw;height:46vw;left:-8vw;top:-14vw;background:var(--orb-1);animation:drift1 26s ease-in-out infinite alternate}
.sky i:nth-child(2){width:40vw;height:40vw;right:-10vw;top:22vh;background:var(--orb-2);animation:drift2 32s ease-in-out infinite alternate}
.sky i:nth-child(3){width:30vw;height:30vw;left:30vw;bottom:-16vw;background:var(--orb-3);animation:drift3 38s ease-in-out infinite alternate}
.sky::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(180deg,rgba(0,0,0,.5),transparent 70%)}
@keyframes drift1{to{transform:translate(12vw,10vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-14vw,-8vh) scale(.9)}}
@keyframes drift3{to{transform:translate(10vw,-12vh) scale(1.2)}}

/* ---------- structure ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%;gap:0}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - 32px);margin:16px 0 16px 16px;padding:18px 14px;display:flex;flex-direction:column;gap:6px;
  background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 16px}
.logo-tile{width:52px;height:60px;display:grid;place-items:center;flex:none}
.logo-tile img{height:60px;width:auto;filter:drop-shadow(0 4px 10px rgba(0,150,214,.25))}
.brand b{display:block;font-family:var(--display);font-size:17px;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink-3);font-size:12px}
.nav-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px 4px}
.nav{display:flex;flex-direction:column;gap:2px;position:relative}
.nav button{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-2);font-weight:550;transition:color .2s,background .2s}
.nav button:hover{background:var(--accent-soft);color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button .ic{width:20px;height:20px;flex:none}
.nav button .count{margin-left:auto;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--danger-soft);color:var(--danger)}
.nav-pill{position:absolute;left:0;right:0;height:42px;border-radius:12px;background:var(--glass-strong);box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .45s var(--spring),opacity .2s;z-index:-1}
.nav-pill::before{content:"";position:absolute;left:-1px;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--accent)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.today-card{padding:14px;border-radius:16px;background:linear-gradient(135deg,var(--accent-soft),var(--green-soft));border:1px solid var(--line)}
.today-card h4{margin:0 0 8px;font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.today-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--ink-2)}
.today-row b{color:var(--ink)}
.today-row.alert b{color:var(--danger)}
.made{font-size:11px;color:var(--ink-3);padding:0 6px;opacity:.75}
.mode-chip{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);padding:0 6px}
.mode-chip i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.mode-chip.loading i{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}

.main{min-width:0;padding:22px 28px 60px;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:12px 0 10px;margin-top:-12px}
.topbar::before{content:"";position:absolute;inset:-14px -28px -8px;background:linear-gradient(var(--bg) 82%,transparent);opacity:.97;z-index:-1;pointer-events:none}
.titles{flex:1;min-width:0}
.eyebrow{margin:0 0 2px;color:var(--ink-3);font-size:13px;font-weight:550}
.titles h1{font-size:clamp(28px,3.4vw,40px);font-weight:750;line-height:1.05}
.search-pill{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;min-width:min(320px,100%);border-radius:14px;background:var(--glass);border:1px solid var(--line);color:var(--ink-3);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:border-color .2s,transform .2s}
.search-pill:hover{border-color:var(--line-2);transform:translateY(-1px)}
.search-pill kbd{margin-left:auto;font:600 11px var(--mono);padding:3px 6px;border-radius:6px;border:1px solid var(--line-2);color:var(--ink-3)}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);color:var(--ink-2);transition:transform .2s,color .2s}
.icon-btn:hover{color:var(--ink);transform:translateY(-1px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:14px;font-weight:650;white-space:nowrap;transition:transform .25s var(--spring),box-shadow .25s,background .2s}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px -10px var(--accent)}
.btn.primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 16px 30px -12px var(--accent)}
.btn.ghost{background:var(--glass);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--line-2)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{height:34px;padding:0 12px;border-radius:11px;font-size:13.5px}
.btn:active{transform:scale(.97)}
.btn .ic{width:18px;height:18px}

/* ---------- vue & animations d'entrée ---------- */
#view{display:flex;flex-direction:column;gap:22px;min-width:0}
.enter>*{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:.001;transform:translateY(18px) scale(.985);filter:blur(6px)}}
.grid{display:grid;gap:18px;min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.cols-3{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(0,.95fr)}
.cols-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cols-21{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:1280px){.cols-3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols-3>.span-wide{grid-column:1/-1}}
@media (max-width:900px){.cols-3,.cols-2,.cols-21{grid-template-columns:minmax(0,1fr)}}

.card{position:relative;min-width:0;background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);padding:20px;overflow:hidden}
.card.spot::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,-40%),var(--accent-soft),transparent 45%);opacity:0;transition:opacity .3s}
.card.spot:hover::after{opacity:1}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:17px;font-weight:650}
.card-h .sub{color:var(--ink-3);font-size:13px}
.card-h .more{white-space:nowrap;margin-left:auto;color:var(--accent);font-weight:650;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.card-h .more:hover{gap:8px}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;cursor:pointer;transition:transform .35s var(--spring),border-color .2s}
.kpi:hover{transform:translateY(-3px);border-color:var(--line-2)}
.kpi .k-top{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13px;font-weight:600}
.kpi .k-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--tone-soft,var(--accent-soft));color:var(--tone,var(--accent))}
.kpi .k-ic svg{width:18px;height:18px}
.kpi .k-val{font:750 38px/1 var(--display);letter-spacing:-.03em}
.kpi .k-sub{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.trend{font-weight:700;padding:1px 7px;border-radius:99px;font-size:11.5px}
.trend.up{background:var(--green-soft);color:var(--green)}
.trend.down{background:var(--danger-soft);color:var(--danger)}
.kpi .spark{position:absolute;right:12px;top:16px;width:84px;height:30px;opacity:.9}

/* pastilles */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.mute{background:var(--line);color:var(--ink-2)}

/* listes */
.rows{display:flex;flex-direction:column}
.row{display:grid;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .t{font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .s{color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .num{font:700 15px var(--display);text-align:right}
.avatar{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font:700 13px var(--display);color:#fff;flex:none}
.mini-cover{width:30px;height:42px;border-radius:5px 7px 7px 5px;flex:none;box-shadow:inset 3px 0 0 rgba(0,0,0,.18),0 4px 10px -4px rgba(0,0,0,.35)}
.empty{padding:26px 10px;text-align:center;color:var(--ink-3);font-size:14px}

/* tableau */
.table-wrap{overflow-x:auto;margin:0 -20px -20px;padding:0 20px 8px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{font:650 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--accent-soft)}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
td .t{font-weight:620}
td .s{color:var(--ink-3);font-size:12.5px}
.code{font:600 12px var(--mono);color:var(--ink-3)}
.row-actions{display:flex;gap:4px;justify-content:flex-end;opacity:.5;transition:opacity .2s}
tr:hover .row-actions{opacity:1}
.act{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2)}
.act:hover{background:var(--glass-strong);color:var(--ink)}
.act svg{width:17px;height:17px}

/* barre d'outils de liste */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field-search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line);flex:1;min-width:200px;max-width:420px}
.field-search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.field-search svg{width:17px;height:17px;color:var(--ink-3)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line);position:relative}
.seg button{position:relative;z-index:1;height:32px;padding:0 13px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--solid);box-shadow:var(--shadow)}
.seg button svg{width:18px;height:18px}
.seg button .n{font-size:11px;color:var(--ink-3);margin-left:4px}
select.flat{height:40px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line);padding:0 12px}

/* couvertures */
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.book{display:flex;flex-direction:column;gap:9px;cursor:pointer;text-align:left;perspective:800px}
.cover{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:6px 12px 12px 6px;padding:14px 12px 12px 18px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden;
  background:linear-gradient(155deg,var(--cv1),var(--cv2));box-shadow:inset 6px 0 0 rgba(0,0,0,.16),inset 7px 0 0 rgba(255,255,255,.18),0 18px 30px -16px rgba(0,0,0,.55);transition:transform .5s var(--spring),box-shadow .4s;transform-origin:left center}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);transform:translateX(-120%);transition:transform .8s var(--ease)}
.book:hover .cover{transform:rotateY(-14deg) translateY(-4px);box-shadow:inset 6px 0 0 rgba(0,0,0,.16),inset 7px 0 0 rgba(255,255,255,.18),18px 26px 40px -18px rgba(0,0,0,.6)}
.book:hover .cover::after{transform:translateX(120%)}
.cover .cv-cat{font:700 9.5px var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.cover .cv-title{font:700 17px/1.08 var(--display);letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.cover .cv-author{font-size:11px;opacity:.85}
.cover .cv-deco{position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;border:14px solid rgba(255,255,255,.12)}
.book .b-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.book .b-title{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avail{font:700 12px var(--display);white-space:nowrap}
.avail.ok{color:var(--green)}.avail.warn{color:var(--warn)}.avail.bad{color:var(--danger)}

/* graphiques */
.chart{width:100%;height:auto;overflow:visible}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--ink-3);font:11px var(--body)}
.chart .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s var(--ease) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .area{opacity:0;animation:fade .9s ease .9s forwards}
@keyframes fade{to{opacity:1}}
.chart .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .8s var(--spring) both;animation-delay:calc(var(--d) * 18ms)}
@keyframes grow{from{transform:scaleY(0)}}
.chart .hit:hover~.x{opacity:1}
.chart-wrap{position:relative}
.tip{position:absolute;pointer-events:none;padding:8px 10px;border-radius:10px;background:var(--glass-strong);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:12.5px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .15s;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tip b{font-family:var(--display)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.stats div{padding:12px 14px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line)}
.stats span{display:block;font-size:12px;color:var(--ink-3)}
.stats b{font:750 22px var(--display);letter-spacing:-.02em}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.donut-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;align-items:center}
.donut-box svg{max-width:190px;margin:0 auto;width:100%}
.donut-box svg circle.seg{transition:stroke-dasharray 1.2s var(--ease),stroke-dashoffset 1.2s var(--ease)}
.donut-center{font:800 30px var(--display);fill:var(--ink)}
.donut-center-s{font:600 11px var(--body);fill:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.d-legend{display:flex;flex-direction:column;gap:7px;min-width:0}
.d-legend div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:9px;align-items:center;font-size:13px}
.d-legend i{width:10px;height:10px;border-radius:3px}
.d-legend span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.d-legend b{font-family:var(--display)}
@media (max-width:420px){.donut-box{grid-template-columns:minmax(0,1fr)}}

/* jauges stock */
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.meter b{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--tone,var(--green));width:0;transition:width 1.1s var(--ease)}
.meter .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-3);border-radius:2px;opacity:.6}
.stepper{display:inline-flex;align-items:center;border-radius:11px;border:1px solid var(--line);background:var(--glass-strong)}
.stepper button{width:32px;height:32px;display:grid;place-items:center;color:var(--ink-2)}
.stepper button:hover{color:var(--ink)}
.stepper b{min-width:42px;text-align:center;font:700 15px var(--display)}

/* actions rapides */
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.quick>.q:last-child:nth-child(odd){grid-column:span 2}
.q{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--line);text-align:left;font-weight:620;font-size:13.5px;transition:transform .3s var(--spring),border-color .2s}
.q:hover{transform:translateY(-3px);border-color:var(--line-2)}
.q span.ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--tone-soft);color:var(--tone)}
.q span.ic svg{width:18px;height:18px}

/* feuille (panneau) */
.sheet-wrap{position:fixed;inset:0;z-index:60}
.backdrop{position:absolute;inset:0;background:rgba(3,10,16,.36);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s ease both;opacity:0}
.panel{position:absolute;top:12px;right:12px;bottom:12px;width:min(540px,calc(100% - 24px));display:flex;flex-direction:column;background:var(--glass-strong);border:1px solid var(--line-2);border-radius:26px;box-shadow:var(--shadow-lg);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);animation:slideIn .55s var(--spring) both;overflow:hidden}
@keyframes slideIn{from{transform:translateX(105%)}}
.sheet-wrap.closing .panel{animation:slideOut .3s var(--ease) both}
.sheet-wrap.closing .backdrop{animation:fadeOut .3s ease both}
@keyframes slideOut{to{transform:translateX(105%)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@media (max-width:700px){
  .panel{top:auto;left:0;right:0;bottom:0;width:100%;max-height:92%;border-radius:26px 26px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);animation-name:sheetUp}
  .sheet-wrap.closing .panel{animation-name:sheetDown}
}
@keyframes sheetUp{from{transform:translateY(105%)}}
@keyframes sheetDown{to{transform:translateY(105%)}}
.panel-h{display:flex;align-items:center;gap:12px;padding:20px 22px 12px}
.panel-h h2{font-size:24px;flex:1}
.panel-b{padding:6px 22px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.panel-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px 20px;border-top:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:12.5px;font-weight:650;color:var(--ink-2)}
.f input,.f select,.f textarea{height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--solid);padding:0 12px;outline:0;transition:border-color .2s,box-shadow .2s;width:100%}
.f textarea{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.f .hint{font-size:12px;color:var(--ink-3)}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.picker{border:1px solid var(--line-2);border-radius:14px;background:var(--solid);max-height:220px;overflow-y:auto}
.pick{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;text-align:left;border-top:1px solid var(--line)}
.pick:first-child{border-top:0}
.pick:hover,.pick[aria-selected="true"]{background:var(--accent-soft)}
.pick[disabled]{opacity:.45;cursor:not-allowed}
.pick .t{font-weight:620;font-size:14px}
.pick .s{font-size:12px;color:var(--ink-3)}
.chosen{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--line)}
.recap{padding:14px;border-radius:16px;background:var(--glass);border:1px dashed var(--line-2);font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.recap b{color:var(--ink)}

/* formulaires */
.req{color:var(--danger);font-weight:700}
.form-note{margin:0;font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.form-note.block{display:block;line-height:1.55}
.f.err input,.f.err select,.f.err .num-in{border-color:var(--danger)!important;box-shadow:0 0 0 4px var(--danger-soft)!important}
.f .msg{font-size:12.5px;font-weight:600;color:var(--danger)}
.num-in{display:flex;align-items:center;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--solid);overflow:hidden;transition:border-color .2s,box-shadow .2s}
.num-in:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.num-in input{border:0!important;box-shadow:none!important;text-align:center;font:700 16px var(--display);height:42px!important;background:transparent!important;-moz-appearance:textfield}
.num-in input::-webkit-inner-spin-button{-webkit-appearance:none}
.num-in button{width:42px;height:42px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.num-in button:hover{background:var(--accent-soft);color:var(--accent)}
.num-in button svg{width:16px;height:16px}
.f .seg{align-self:flex-start;flex-wrap:wrap}
.seg.big{align-self:stretch;display:grid;grid-template-columns:1fr 1fr}
.seg.big button{height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.warn-box{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--ink);font-size:13.5px;animation:rise .4s var(--ease) both}
.warn-box>svg{width:18px;height:18px;color:var(--warn);flex:none;margin-top:2px}
.link{color:var(--accent);font-weight:650;display:inline-flex;align-items:center;gap:4px;margin-top:4px}
.link svg{width:15px;height:15px}
.added{font:700 12px var(--body);padding:4px 10px;border-radius:99px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:650;padding:5px 10px;border-radius:99px;background:var(--line);color:var(--ink-3);transition:background .3s,color .3s}
.steps span.on{background:var(--accent-soft);color:var(--accent)}
.steps span.done{background:var(--green-soft);color:var(--green)}
.chosen-list{display:flex;flex-direction:column;gap:8px}
.panel-f{flex-wrap:wrap}
.panel-f .btn{padding:0 14px}
@media (max-width:700px){.panel-f .btn{flex:1 1 auto}}
.add-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.add-item{flex-direction:row;align-items:center;padding:16px;animation:rise .5s var(--ease) both}
.add-item b{display:block;font-size:15px}
.add-item small{display:block;color:var(--ink-3);font-weight:500;font-size:12.5px}
@media (max-width:480px){.add-grid{grid-template-columns:minmax(0,1fr)}}
.fab{position:fixed;right:28px;bottom:28px;z-index:45;height:56px;padding:0 22px 0 18px;border-radius:20px;display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--c9));box-shadow:0 18px 40px -14px var(--accent),0 0 0 1px rgba(255,255,255,.2) inset;transition:transform .35s var(--spring),box-shadow .3s}
.fab:hover{transform:translateY(-3px) scale(1.03)}
.fab svg{width:22px;height:22px;transition:transform .4s var(--spring)}
.fab:hover svg{transform:rotate(90deg)}
@media (max-width:900px){.fab{right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:56px;padding:0;justify-content:center}.fab span{display:none}}
.still .bar{animation:none}
.still circle.seg{transition:none}
.flash{animation:flash 2.2s var(--ease) both!important}
@keyframes flash{0%,30%{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.book.flash{border-radius:14px}

/* droits par rôle */
body.no-biblio [data-perm="biblio"],body.no-fourn [data-perm="fourn"],body.no-admin [data-perm="admin"]{display:none!important}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line)}
.user-chip b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip small{display:block;font-size:11.5px;color:var(--ink-3)}
.user-chip .act{margin-left:auto;flex:none}
/* comptes en ligne, espace lecteur, carte de membre */
img.avatar{object-fit:cover;background:var(--line)}
.avatar.xl{width:84px;height:84px;border-radius:50%;font-size:28px}
.google-btn{height:48px;font-size:15px;gap:10px;justify-content:center;width:100%}
.google-btn .ic{width:20px;height:20px}
.auth-or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12px}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line-2)}
.pending-ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);animation:pulse 2.4s ease-in-out infinite}
.pending-ic .ic{width:30px;height:30px}
@keyframes pulse{50%{transform:scale(1.06)}}
.pend-list{display:flex;flex-direction:column;gap:10px}
.pend-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;align-items:center;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--glass-strong)}
.pend-row.muted{opacity:.75}
.pend-who .t{font-weight:650}
.pend-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pend-act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pend-act select{max-width:100%;min-width:0;flex:1 1 240px}
@media(min-width:1100px){.pend-row{grid-template-columns:auto minmax(0,1fr) auto}.pend-act{grid-column:auto;justify-content:flex-end}.pend-act select{flex:0 1 260px}}
.danger-t{color:var(--danger)}
.prof-head{display:flex;gap:18px;align-items:center}
.prof-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.crop-box{display:flex;flex-direction:column;gap:10px;align-items:center}
.crop-box canvas{width:min(260px,70vw);aspect-ratio:1;border-radius:50%;cursor:grab;touch-action:none;box-shadow:0 0 0 4px var(--accent-soft),0 18px 40px -18px rgba(0,0,0,.5)}
.crop-zoom{display:flex;gap:10px;align-items:center;width:min(260px,70vw);color:var(--ink-3)}
.crop-zoom input{flex:1}
.crop-zoom .ic{width:16px;height:16px}
.pf-pass summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
.espace-top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media(max-width:900px){.espace-top{grid-template-columns:1fr}}
.hello{display:flex;flex-direction:column;gap:12px;justify-content:center}
.hello h2{font-size:clamp(22px,3vw,30px);letter-spacing:-.02em;margin:0}
.hello p{margin:0;color:var(--ink-2)}
.hello-stats{display:flex;gap:26px}
.hello-stats b{display:block;font:800 28px var(--display)}
.hello-stats span{font-size:12px;color:var(--ink-3)}
.mcard{position:relative;overflow:hidden;border-radius:24px;padding:20px 22px;min-height:220px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:14px;
  background:radial-gradient(120% 140% at 0% 0%,#22C3FF 0%,#0096D6 38%,#0B3F73 72%,#06243F 100%);box-shadow:0 24px 50px -24px rgba(0,80,140,.7),inset 0 1px 0 rgba(255,255,255,.3);animation:pop .7s var(--spring) both}
.mc-glow{position:absolute;right:-60px;bottom:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(46,177,74,.55),transparent 65%);pointer-events:none}
.mc-top{display:flex;align-items:center;gap:10px}
.mc-top b{display:block;font:800 16px var(--display);letter-spacing:-.01em}
.mc-top small{display:block;font-size:11px;opacity:.8}
.mc-logo{height:44px;display:grid;place-items:center;flex:none}
.mc-logo img{height:44px;width:auto;filter:brightness(0) invert(1) drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.mc-year{margin-left:auto;font:700 11px var(--mono);padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.16)}
.mc-mid{display:flex;align-items:center;gap:14px;position:relative}
.mc-ph{width:64px;height:64px;border-radius:50%;font-size:22px;border:3px solid rgba(255,255,255,.75);flex:none}
.mc-name{font:800 20px/1.1 var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}
.mc-sub{font-size:13px;opacity:.85;margin-top:3px}
.mc-bot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;position:relative}
.mc-bot small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.mc-num{font:800 34px/1 var(--mono);letter-spacing:.06em;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.mc-since{text-transform:none!important;letter-spacing:0!important}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:18px 14px}
.shelf .cover .cv-title{font-size:14px}
/* écran de connexion */
body.locked{overflow:hidden}
.auth{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;overflow-y:auto;
  background:radial-gradient(60vw 60vw at 10% 0%,var(--orb-1),transparent 60%),radial-gradient(50vw 50vw at 100% 80%,var(--orb-2),transparent 60%),radial-gradient(40vw 40vw at 50% 110%,var(--orb-3),transparent 60%),var(--bg)}
.auth-card{width:min(440px,100%);padding:30px 28px;border-radius:28px;background:var(--glass-strong);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);display:flex;flex-direction:column;gap:18px;animation:pop .6s var(--spring) both}
.auth-brand{display:flex;align-items:center;gap:14px}
.auth-brand .logo-tile{width:72px;height:84px}
.auth-brand .logo-tile img{height:84px}
.auth-brand h1{font-size:30px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(120deg,var(--accent),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-brand p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.auth h2{font-size:21px}
.auth-form{display:flex;flex-direction:column;gap:14px}
.auth-form .btn{height:48px;font-size:15px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;align-self:stretch}
.auth-tabs button{height:38px}
.auth-p{margin:0;color:var(--ink-2);font-size:14px}
.auth-p.small{font-size:12.5px;color:var(--ink-3)}
.auth-link{align-self:center;margin:0}
.auth-actions{display:flex;gap:10px;flex-wrap:wrap}
.auth-msg{padding:11px 13px;border-radius:12px;font-size:13.5px;font-weight:600}
.auth-msg.err{background:var(--danger-soft);color:var(--danger)}
.auth-msg.ok{background:var(--green-soft);color:var(--green)}
.auth-foot{font-size:11.5px;color:var(--ink-3)}
.rcode{font:800 30px/1 var(--mono);letter-spacing:.08em;text-align:center;padding:20px 12px;border-radius:18px;background:var(--accent-soft,rgba(0,174,239,.12));color:var(--accent);border:1.5px dashed var(--accent);user-select:all}
.user-chip .me{all:unset;cursor:pointer;min-width:0;flex:1;display:block}
.user-chip .me:focus-visible{outline:2px solid var(--accent);border-radius:8px}
/* espace lecteur façon Netflix */
.nf-row{display:flex;flex-direction:column;gap:12px;min-width:0}
.nf-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nf-h h3{font-size:19px;letter-spacing:-.01em;margin:0}
.nf-h .sub{color:var(--ink-3);font-size:13px}
.nf-h .more{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.nf-h .more .ic{width:14px;height:14px}
.nf-hero .pill{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3)}
.nf-hero .pill::before{background:#7CF29A}
.nf-arrow{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--glass-strong);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.nf-arrow[data-scroll$=":-1"] svg{transform:rotate(180deg)}
.nf-arrow .ic{width:16px;height:16px}
@media(max-width:700px){.nf-arrow{display:none}}
.nf-track{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:thin;overscroll-behavior-x:contain}
@media(max-width:700px){.nf-track{grid-auto-columns:124px;gap:12px}}
.nf-card{all:unset;cursor:pointer;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;min-width:0}
.nf-card .cover{transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.nf-card:hover .cover,.nf-card:focus-visible .cover{transform:translateY(-6px) scale(1.03);box-shadow:0 24px 40px -18px rgba(0,0,0,.6)}
.nf-card:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:12px}
.nf-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.nf-meta .b-title{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nf-b{font-size:11.5px;font-weight:650;color:var(--ink-3)}
.nf-b.ok{color:var(--green)}.nf-b.warn{color:var(--warn)}.nf-b.bad{color:var(--danger)}
.cv-star{position:absolute;top:8px;right:8px;z-index:2;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#FFC83D;color:#5A3B00;font-size:13px;box-shadow:0 4px 10px -4px rgba(0,0,0,.5)}
.espace-side{display:flex;flex-direction:column;gap:14px}
.espace-side .hello-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px 16px}
.espace-side .hello-stats b{font-size:22px}
.nf-hero{position:relative;overflow:hidden;border-radius:26px;min-height:280px;padding:26px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;cursor:pointer;color:#fff;
  background:linear-gradient(120deg,var(--cv1),var(--cv2));box-shadow:0 30px 60px -30px rgba(0,0,0,.55);animation:rise .7s var(--ease) both}
.nf-hero-bg{position:absolute;inset:0;opacity:.35;filter:blur(30px) saturate(1.4);transform:scale(1.3)}
.nf-hero-bg img{width:100%;height:100%;object-fit:cover}
.nf-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,18,28,.15),rgba(4,18,28,.55))}
.nf-hero-cover{position:relative;z-index:1;width:150px;transform:rotate(-3deg);box-shadow:0 30px 50px -20px rgba(0,0,0,.7)}
.nf-hero-txt{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.nf-kicker{font:800 11.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#FFD45C}
.nf-hero h2{margin:0;font-size:clamp(24px,3.2vw,36px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.nf-by{margin:0;opacity:.85}
.nf-resume{margin:0;opacity:.85;font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nf-hero-act{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
@media(max-width:640px){.nf-hero{grid-template-columns:1fr;text-align:left}.nf-hero-cover{width:110px}}
.nf-alert{display:flex;gap:12px;align-items:center;padding:14px 18px;border-radius:18px;border:1px solid var(--line-2);background:var(--glass-strong)}
.nf-alert .ic{width:26px;height:26px;flex:none}
.nf-alert b{display:block}
.nf-alert span{font-size:13.5px;color:var(--ink-2)}
.nf-alert.ok{border-color:var(--green);background:var(--green-soft);cursor:pointer}.nf-alert.ok .ic{color:var(--green)}
.nf-alert.bad{border-color:var(--danger);background:var(--danger-soft)}.nf-alert.bad .ic{color:var(--danger)}
.genre-grid{display:flex;flex-wrap:wrap;gap:10px}
.genre{all:unset;cursor:pointer;padding:12px 18px;border-radius:16px;border:1.5px solid var(--line-2);font-weight:650;transition:all .2s var(--ease)}
.genre[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff;transform:scale(1.04)}
.rd-head{display:grid;grid-template-columns:140px minmax(0,1fr);gap:18px;align-items:start}
.rd-head .s .ic{width:14px;height:14px;vertical-align:-2px}
.rd-resume{margin:0;color:var(--ink-2);font-size:14px;line-height:1.6}
.nf-status{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line-2);font-size:14px}
.nf-status .ic{width:18px;height:18px;flex:none}
.nf-status.ok{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.nf-status.warn{border-color:var(--warn);background:var(--warn-soft)}
.nf-status.bad{color:var(--danger);background:var(--danger-soft);border-color:transparent}
.res-row{grid-template-columns:auto minmax(0,1fr) auto!important}
.res-alert{display:flex;gap:14px;align-items:flex-start;line-height:1.55}
.btn.on{border-color:#FFC83D;color:#B57900}
/* ouverture animée */
.intro{position:fixed;inset:0;z-index:300;background:radial-gradient(120% 90% at 50% 45%,#0B1622 0%,#03070C 70%);color:#fff;display:grid;place-items:center;overflow:hidden;font-family:var(--display)}
.in-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;transform-origin:50% 40%}
.in-line{position:absolute;top:50%;left:50%;width:70vw;height:2px;margin-left:-35vw;background:linear-gradient(90deg,transparent,#00AEEF,#39B54A,transparent);transform:scaleX(0);opacity:0}
.in-rays{position:absolute;top:80px;left:calc(50% - 14px);width:0;height:0}
.in-rays i{position:absolute;left:-2px;top:0;width:4px;height:46vmax;border-radius:4px;background:linear-gradient(var(--c),transparent 70%);transform-origin:50% 0;transform:rotate(var(--a)) scaleY(0);opacity:0;filter:blur(.5px)}
.in-ring{position:absolute;top:80px;left:calc(50% - 14px);width:180px;height:180px;margin:-90px 0 0 -90px;border-radius:50%;border:2px solid rgba(0,174,239,.8);box-shadow:0 0 40px rgba(0,174,239,.6),inset 0 0 30px rgba(57,181,74,.4);transform:scale(.2);opacity:0}
.in-logo{position:relative;height:210px;display:grid;place-items:center;transform:scale(.4);opacity:0}
.in-logo img{height:210px;width:auto;display:block}
.in-word{display:flex;font:800 clamp(40px,8vw,78px)/1 var(--display);letter-spacing:-.03em;overflow:hidden;padding:.05em .1em .12em}
.in-word span{display:inline-block;transform:translateY(110%);opacity:0;background:linear-gradient(180deg,#fff 30%,#9BE3FF 75%,#39B54A);-webkit-background-clip:text;background-clip:text;color:transparent}
.in-sub{font:600 12px var(--body);letter-spacing:.42em;text-transform:uppercase;color:rgba(255,255,255,.6);opacity:0;transform:translateY(8px)}
.in-stripes{position:absolute;inset:-10%;display:grid;grid-template-columns:repeat(28,1fr);pointer-events:none}
.in-stripes i{background:var(--c);transform:scaleY(0);transform-origin:50% calc(50% + (var(--i) - 14) * 3%);opacity:.95}
.intro.play .in-line{animation:inLine .9s cubic-bezier(.2,.8,.2,1) .05s both}
.intro.play .in-rays i{animation:inRay 1.6s cubic-bezier(.2,.8,.2,1) calc(.45s + var(--d)) both}
.intro.play .in-ring{animation:inRing 1.4s cubic-bezier(.2,.8,.2,1) .55s both}
.intro.play .in-logo{animation:inLogo 1s cubic-bezier(.34,1.56,.64,1) .5s both}
.intro.play .in-word span{animation:inLetter .7s cubic-bezier(.2,.9,.2,1) calc(1.05s + var(--i) * 55ms) both}
.intro.play .in-sub{animation:inSub .8s ease 1.75s both}
.intro.zoom .in-stage{animation:inZoom .8s cubic-bezier(.6,0,.9,.4) both}
.intro.zoom .in-stripes i{animation:inStripe .8s cubic-bezier(.7,0,.3,1) calc(var(--o) * 12ms) both}
@keyframes inLine{0%{transform:scaleX(0);opacity:0}40%{opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes inRay{0%{transform:rotate(var(--a)) scaleY(0);opacity:0}35%{opacity:.9}100%{transform:rotate(var(--a)) scaleY(1);opacity:0}}
@keyframes inRing{0%{transform:scale(.2);opacity:0}30%{opacity:1}100%{transform:scale(2.6);opacity:0}}
@keyframes inLogo{0%{transform:scale(.4) rotate(-12deg);opacity:0;filter:drop-shadow(0 0 0 rgba(0,174,239,0))}100%{transform:scale(1) rotate(0);opacity:1;filter:drop-shadow(0 0 28px rgba(0,174,239,.55)) drop-shadow(0 0 60px rgba(57,181,74,.25))}}
@keyframes inLetter{0%{transform:translateY(110%);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes inSub{to{opacity:1;transform:none}}
@keyframes inZoom{0%{transform:scale(1);opacity:1;filter:blur(0)}100%{transform:scale(7);opacity:0;filter:blur(8px)}}
@keyframes inStripe{0%{transform:scaleY(0)}45%{transform:scaleY(1)}100%{transform:scaleY(1) translateY(-120%)}}
.in-sound{position:absolute;left:24px;bottom:24px;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;cursor:pointer}
.in-sound .ic{width:20px;height:20px}
.intro.choose .in-sound{display:none}
.in-tap{all:unset;position:absolute;inset:0;z-index:3;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;color:rgba(255,255,255,.75);font:600 15px var(--body);letter-spacing:.08em}
.in-tap img{height:150px;opacity:.9;filter:drop-shadow(0 0 24px rgba(0,174,239,.35));animation:tapPulse 2.2s ease-in-out infinite}
.in-tap span{animation:inFade 1s ease .3s both}
.intro.waiting .in-stage,.intro.waiting .in-skip{visibility:hidden}
@keyframes tapPulse{50%{transform:scale(1.04);filter:drop-shadow(0 0 40px rgba(0,174,239,.6))}}
.in-skip{position:absolute;right:24px;bottom:24px;padding:10px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font:600 14px var(--body);cursor:pointer;backdrop-filter:blur(10px)}
.in-skip:hover{background:rgba(255,255,255,.18)}
.intro.choose .in-stage,.intro.choose .in-stripes{display:none}
.in-profiles{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:24px 16px;animation:inFade .6s ease both}
.in-profiles h1{font:700 clamp(28px,5vw,52px)/1.1 var(--display);letter-spacing:-.02em;margin:0;text-align:center}
.in-plist{display:flex;gap:clamp(18px,4vw,42px);flex-wrap:wrap;justify-content:center}
.in-prof{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;color:rgba(255,255,255,.7);transition:color .25s;animation:inPop .6s cubic-bezier(.34,1.56,.64,1) both}
.in-prof.other{animation-delay:.12s}
.in-av{width:clamp(110px,16vw,160px);aspect-ratio:1;border-radius:22px;overflow:hidden;display:grid;place-items:center;border:3px solid transparent;transition:transform .3s var(--ease),border-color .25s,box-shadow .3s}
.in-av .in-img{width:100%;height:100%;border-radius:0;display:grid;place-items:center;font:800 clamp(40px,6vw,58px) var(--display);color:#fff;object-fit:cover}
.in-prof.other .in-av{background:rgba(255,255,255,.06);border:2px dashed rgba(255,255,255,.3)}
.in-prof.other .in-av .ic{width:40px;height:40px;color:rgba(255,255,255,.6)}
.in-prof b{font:600 clamp(16px,2vw,20px) var(--body)}
.in-prof small{font-size:12.5px;color:rgba(255,255,255,.45);margin-top:-8px}
.in-prof:hover,.in-prof:focus-visible{color:#fff}
.in-prof:hover .in-av,.in-prof:focus-visible .in-av{border-color:#fff;transform:scale(1.06);box-shadow:0 0 0 6px rgba(0,174,239,.25),0 20px 50px -10px rgba(0,174,239,.5)}
.in-hint{margin:0;color:rgba(255,255,255,.5);font-size:14px;text-align:center}
.in-manage{all:unset;cursor:pointer;padding:10px 22px;border:1px solid rgba(255,255,255,.4);color:rgba(255,255,255,.7);font:600 13px var(--body);letter-spacing:.18em;text-transform:uppercase}
.in-manage:hover{color:#fff;border-color:#fff}
.intro.leaving{animation:inOut .9s cubic-bezier(.6,0,.2,1) .25s both}
.intro.leaving .in-profiles h1,.intro.leaving .in-hint,.intro.leaving .in-manage,.intro.leaving .in-prof.other{animation:none;transition:opacity .2s;opacity:0}
.intro.leaving #inMe{position:relative;z-index:2;animation:none}
.intro.leaving #inMe .in-av{transition:transform .85s cubic-bezier(.6,0,.2,1),opacity .5s ease .35s,filter .5s ease .35s;transform:translate(var(--zx),var(--zy)) scale(4.5);opacity:0;filter:blur(6px)}
.intro.leaving #inMe b,.intro.leaving #inMe small{opacity:0}
@keyframes inOut{to{opacity:0;visibility:hidden}}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes inPop{from{opacity:0;transform:scale(.8) translateY(20px)}to{opacity:1;transform:none}}
/* fiche de livre en grand */
.sheet-wrap.big .panel{top:50%;left:50%;right:auto;bottom:auto;width:min(860px,calc(100% - 32px));max-height:calc(100% - 48px);transform:translate(-50%,-50%);animation:bigIn .45s var(--spring) both;overflow:hidden}
.sheet-wrap.big.closing .panel{animation:bigOut .25s ease both}
@keyframes bigIn{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes bigOut{to{opacity:0;transform:translate(-50%,-48%) scale(.96)}}
.sheet-wrap.big .panel-h{position:absolute;top:0;right:0;z-index:3;padding:14px}
.sheet-wrap.big .panel-h h2{display:none}
.sheet-wrap.big .panel-h .icon-btn{background:rgba(0,0,0,.45);color:#fff;border-color:rgba(255,255,255,.3)}
.sheet-wrap.big .panel-b{padding:0 0 22px;gap:16px}
.sheet-wrap.big .panel-b>:not(.bd-hero){margin:0 26px}
@media(max-width:700px){.sheet-wrap.big .panel{top:auto;left:0;bottom:0;width:100%;max-height:94%;transform:none;border-radius:26px 26px 0 0;animation:sheetUp .4s var(--ease) both}}
.bd-hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(120deg,var(--cv1),var(--cv2));padding:34px 28px 26px}
.bd-bg{position:absolute;inset:-20%;width:140%;height:140%;object-fit:cover;filter:blur(36px) saturate(1.5);opacity:.55}
.bd-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,12,20,.15),rgba(3,12,20,.72))}
.bd-in{position:relative;z-index:1;display:grid;grid-template-columns:170px minmax(0,1fr);gap:26px;align-items:end}
.bd-cover{width:170px;box-shadow:0 30px 50px -20px rgba(0,0,0,.7);transform:rotate(-2deg)}
.bd-txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.bd-txt h2{margin:0;font-size:clamp(24px,3.4vw,38px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.bd-by{margin:0;opacity:.85}
.bd-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;opacity:.9}.bd-meta .ok{color:#8CF0A6}.bd-meta .ic{width:14px;height:14px;vertical-align:-2px}
.bd-meta .stars{font-size:14px}
.bd-act{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.bd-act .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
@media(max-width:560px){.bd-in{grid-template-columns:110px minmax(0,1fr);gap:16px}.bd-cover{width:110px}}
/* bandeau qui tourne */
.nf-car{position:relative;min-height:300px;border-radius:26px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.55)}
.nf-car .nf-hero{position:absolute;inset:0;box-shadow:none;border-radius:0;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s;animation:none}
.nf-car .nf-hero.on{opacity:1;visibility:visible}
.nf-car .nf-hero.on .nf-hero-bg img{animation:kenburns 9s ease-out both}
.nf-car .nf-hero.on .nf-hero-cover{animation:heroCover .9s var(--spring) both}
.nf-car .nf-hero.on .nf-hero-txt>*{animation:rise .7s var(--ease) both}
.nf-car .nf-hero.on .nf-hero-txt>:nth-child(2){animation-delay:.08s}.nf-car .nf-hero.on .nf-hero-txt>:nth-child(3){animation-delay:.14s}.nf-car .nf-hero.on .nf-hero-txt>:nth-child(4){animation-delay:.2s}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.18) translate(-2%,-2%)}}
@keyframes heroCover{from{opacity:0;transform:rotate(-10deg) translateY(30px) scale(.9)}to{opacity:1;transform:rotate(-3deg)}}
.nf-dots{position:absolute;right:20px;bottom:16px;z-index:3;display:flex;gap:6px}
.nf-dots button{all:unset;cursor:pointer;width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.45);transition:width .3s var(--ease),background .3s}
.nf-dots button.on{width:26px;background:#fff}
@media(max-width:640px){.nf-car{min-height:420px}}
/* top 10 */
.t10-badge{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:34px;height:34px;margin-right:10px;border-radius:6px;background:#E50914;color:#fff;font:800 8px/1 var(--body);letter-spacing:.06em;vertical-align:middle}
.t10-badge b{font-size:15px;letter-spacing:-.02em}
.nf-track.t10{grid-auto-columns:220px;gap:6px}
.t10-card{all:unset;cursor:pointer;scroll-snap-align:start;display:grid;grid-template-columns:96px 124px;align-items:end}
.t10-n{font:900 170px/.78 var(--display);letter-spacing:-.08em;color:var(--bg,#fff);-webkit-text-stroke:4px var(--ink-3);text-align:right;margin-right:-14px;user-select:none;transition:-webkit-text-stroke-color .3s}
.t10-card .cover{width:124px;position:relative;z-index:1;transition:transform .35s var(--ease)}
.t10-card .cover .cv-title{font-size:12.5px}
.t10-card:hover .cover,.t10-card:focus-visible .cover{transform:translateY(-6px) scale(1.04)}
.t10-card:hover .t10-n{-webkit-text-stroke-color:var(--accent)}
@media(max-width:700px){.nf-track.t10{grid-auto-columns:176px}.t10-card{grid-template-columns:76px 100px}.t10-card .cover{width:100px}.t10-n{font-size:132px}}
/* aperçu au survol */
.hov{position:fixed;z-index:80;width:300px;border-radius:16px;overflow:hidden;background:var(--glass-strong);border:1px solid var(--line-2);box-shadow:0 30px 70px -20px rgba(0,0,0,.6);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);animation:hovIn .28s var(--ease) both;cursor:pointer}
.hov.out{animation:hovOut .18s ease both}
@keyframes hovIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes hovOut{to{opacity:0;transform:scale(.85)}}
.hov-top{position:relative;height:150px;overflow:hidden;background:linear-gradient(120deg,var(--cv1),var(--cv2));display:grid;place-items:center}
.hov-bg{position:absolute;inset:-20%;width:140%;height:140%;object-fit:cover;filter:blur(20px);opacity:.6}
.hov-cover{width:82px;position:relative;box-shadow:0 14px 30px -10px rgba(0,0,0,.6)}.hov-cover .cv-title{font-size:10px}.hov-cover .cv-cat{font-size:7px}
.hov-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.hov-btns{display:flex;gap:8px;align-items:center}
.hov-btn{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);color:var(--ink)}
.hov-btn.main{background:var(--ink);color:var(--bg,#fff);border-color:var(--ink)}
.hov-btn:hover{border-color:var(--accent)}.hov-btn .ic{width:16px;height:16px}
.hov-av{margin-left:auto;font-size:12px;font-weight:700;color:var(--warn)}.hov-av.ok{color:var(--green)}
.hov-t{font-size:15px;line-height:1.2}.hov-m{font-size:12px;color:var(--ink-3)}
.hov-r{margin:2px 0 0;font-size:12.5px;line-height:1.45;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* avatars illustrés */
.ava-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px}
.ava-pick{all:unset;cursor:pointer;border-radius:22px;transition:transform .2s var(--ease)}
.ava-pick:hover,.ava-pick:focus-visible{transform:scale(1.08)}.ava-pick:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ava{display:grid;place-items:center;aspect-ratio:1;border-radius:22px;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.ava span{font-size:46px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
/* série, objectif, année */
.perso{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.perso>*{border-radius:16px;padding:12px;background:var(--glass-strong);border:1px solid var(--line)}
.perso b{display:block;font-size:14.5px}.perso small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.streak{display:flex;gap:10px;align-items:center}
.flame{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink-3);flex:none}
.streak.hot .flame{background:linear-gradient(160deg,#FFB443,#FF5A1F);color:#fff;box-shadow:0 8px 20px -8px #FF5A1F;animation:flicker 1.8s ease-in-out infinite}
.flame .ic{width:20px;height:20px}
@keyframes flicker{50%{transform:scale(1.08) rotate(-3deg)}}
.goal{all:unset;box-sizing:border-box;cursor:pointer;border-radius:16px;padding:12px;background:var(--glass-strong);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:4px}
.goal .meter{margin-bottom:4px}.goal .ic{width:14px;height:14px;vertical-align:-2px;display:inline-block}
.goal:hover,.wrap-btn:hover{border-color:var(--accent)}
.wrap-btn{all:unset;box-sizing:border-box;cursor:pointer;grid-column:1/-1;border-radius:16px;padding:12px 14px;overflow:hidden;box-shadow:0 8px 22px -12px rgba(3,38,61,.6);display:flex;gap:12px;align-items:center;background:linear-gradient(120deg,#03263D,#0A6FA8 55%,#1E8E3E)!important;color:#fff;border:0!important}
.wrap-btn>span{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center}.wrap-btn .ic{width:20px;height:20px}
.wrap-btn small{color:rgba(255,255,255,.75)!important}
/* assistant IA */
.ai-cta{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:18px;color:#fff;background:linear-gradient(120deg,#3B1C7A,#6B3FD6 55%,#0A6FA8);box-shadow:0 14px 30px -18px rgba(59,28,122,.8);transition:transform .25s var(--spring)}
.ai-cta:hover{transform:translateY(-2px)}.ai-cta>.ic:first-child{width:26px;height:26px;flex:none}.ai-cta>.ic:last-child{width:18px;height:18px;margin-left:auto;opacity:.8}
.ai-cta span{display:flex;flex-direction:column;gap:2px}.ai-cta small{font-size:13px;color:rgba(255,255,255,.85)}
.ai-log{display:flex;flex-direction:column;gap:12px;max-height:min(52vh,520px);overflow:auto;padding:4px 2px}
.ai-msg{max-width:88%;font-size:14.5px;line-height:1.5}.ai-msg p{margin:0}
.ai-msg.me{align-self:flex-end;background:var(--accent);color:#fff;padding:10px 14px;border-radius:18px 18px 4px 18px}
.ai-msg.bot{display:flex;gap:10px;align-items:flex-start}.ai-msg.bot>div{display:flex;flex-direction:column;gap:8px;background:var(--glass-strong);border:1px solid var(--line);padding:10px 14px;border-radius:18px 18px 18px 4px;min-width:0}
.ai-msg.err>div{border-color:var(--warn);background:var(--warn-soft)}
.ai-av{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6B3FD6,#0A6FA8)}.ai-av .ic{width:16px;height:16px}
.ai-book{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--solid)}
.ai-book:hover{border-color:var(--accent)}.ai-book b{display:block;font-size:14px}.ai-book small{display:block;font-size:12px;color:var(--ink-3)}.ai-book em{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.ai-sugg{display:flex;flex-wrap:wrap;gap:8px}.ai-sugg .chip{cursor:pointer;padding:0 12px}.ai-sugg .chip:hover{border-color:var(--accent)}
.ai-form{display:flex;gap:8px;align-items:flex-end}.ai-form textarea{flex:1;resize:none}.ai-form .btn{height:48px;width:48px;padding:0;justify-content:center}
.typing p{display:flex;gap:4px;padding:6px 0}.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:taPulse 1s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
/* import Excel */
.im-sum{display:flex;gap:8px;flex-wrap:wrap}.im-table{max-height:300px;overflow:auto;margin:0 0 10px!important}.im-table th,.im-table td{padding:8px 6px!important;font-size:12.5px}.im-table td:nth-child(2){white-space:nowrap}.im-table td:nth-child(3){word-break:break-all}.im-table tr.skip{opacity:.55}
.im-drop{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;padding:28px 16px;border-radius:16px;border:2px dashed var(--line-2);color:var(--ink-2)}
.check-line{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2);cursor:pointer}.check-line input{margin-top:3px;width:18px;height:18px;flex:none}
/* tableau de bord direction */
.heat{border-collapse:separate;border-spacing:3px}.heat td.hc{padding:0}.heat td.hc span{display:grid;place-items:center;min-width:46px;height:38px;border-radius:8px;font-weight:650;font-size:13px}
.heat-legend{display:flex;gap:4px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--ink-3)}.heat-legend i{width:22px;height:12px;border-radius:4px;display:block}.heat-legend span{margin:0 4px}
.mbars{display:flex;gap:8px;align-items:stretch;height:200px;padding-top:6px}.mbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.mbar b{width:min(36px,80%);background:var(--accent);border-radius:4px 4px 0 0;transition:height .8s var(--ease)}.mbar .mv{font-size:12px;font-weight:650;color:var(--ink-2)}.mbar .ml{font-size:12px;color:var(--ink-3)}
/* avis écrits */
.rv-box{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;border:1px solid var(--line-2);background:var(--glass-strong)}
.rv-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.rv-txt{margin:0;font-style:italic;color:var(--ink-2)}
.rv-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rv-list{display:flex;flex-direction:column;gap:10px}.rv-item{padding:12px 14px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line)}
.rv-item p{margin:6px 0 0;font-size:14px;line-height:1.5}.rv-who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rv-prompt{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:18px;border:1px dashed var(--accent);background:var(--accent-soft)}
.rv-prompt b{display:block}.rv-prompt span{font-size:13.5px;color:var(--ink-2)}.rv-prompt .ta-cover .mini-cover{width:38px;height:54px}
.quote-card{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:300px;display:flex;gap:12px;padding:14px;border-radius:18px;background:var(--glass-strong);border:1px solid var(--line);scroll-snap-align:start;transition:transform .25s var(--spring)}
.quote-card:hover{transform:translateY(-3px)}.quote-card .mini-cover{width:44px;height:62px}.quote-card>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.q-t{font-size:14px;line-height:1.45;font-style:italic}.q-b{font-size:12.5px;font-weight:650;display:flex;gap:6px;align-items:center}.q-w{font-size:12px;color:var(--ink-3)}
.mod-list{display:flex;flex-direction:column;gap:12px}.mod-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--glass-strong)}
.mod-row .mini-cover{width:44px;height:62px}.mod-main{display:flex;flex-direction:column;gap:8px;min-width:0}.mod-main .t{font-weight:650}
.mod-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mod-motif{flex:1 1 220px;min-width:0;height:34px}
/* clubs */
.club-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.club-card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:14px;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--glass-strong);transition:transform .25s var(--spring),border-color .2s}
.club-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.club-cv{width:78px;flex:none;padding:8px 8px 8px 12px}.club-cv .cv-title{font-size:11px}.club-cv.none{height:112px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}.club-cv.none .ic{width:30px;height:30px}
.club-in{display:flex;flex-direction:column;gap:4px;min-width:0}.club-in b{font-size:16px}.club-in .s{font-size:12.5px;color:var(--ink-3)}
.club-rdv{display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:650;color:var(--accent)}.club-rdv .ic{width:14px;height:14px}
.club-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.club-hero{position:relative;overflow:hidden;border-radius:26px;color:#fff;background:linear-gradient(135deg,var(--cv1,#0A6FA8),#04192A)}
.club-hero .bd-bg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(30px) brightness(.45);transform:scale(1.1)}
.club-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,14,24,.85),rgba(2,14,24,.35))}
.club-hero-in{position:relative;z-index:1;display:flex;gap:24px;padding:26px;align-items:center}.club-hero-in>.cover,.club-hero-in>.club-cv{width:150px;flex:none}
.club-hero-txt{display:flex;flex-direction:column;gap:10px;min-width:0}.club-hero-txt h2{margin:0;font:800 clamp(24px,3vw,34px) var(--display)}.club-hero-txt p{margin:0;color:rgba(255,255,255,.85)}
.club-facts{display:flex;flex-direction:column;gap:6px;font-size:14px;color:rgba(255,255,255,.88)}.club-facts span{display:flex;gap:8px;align-items:center}.club-facts .ic{width:16px;height:16px;flex:none}.club-facts [data-book]{cursor:pointer;text-decoration:underline}
.club-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.club-hero .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.club-q{display:flex;flex-direction:column;gap:10px;padding:6px 0}.club-q h3{margin:0;font-size:17px}.club-q.big h3{font-size:21px}
.ans-list{display:flex;flex-direction:column;gap:8px}.ans{padding:10px 12px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line)}.ans p{margin:4px 0 0;font-size:14px}
.ans.pending{border-style:dashed;opacity:.85}.ans-act{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:6px}
.ans-form{display:flex;gap:8px;align-items:flex-end}.ans-form textarea{flex:1}
.vote-list{display:flex;flex-direction:column;gap:8px}.vote-opt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:14px;border:1.5px solid var(--line)}
.vote-opt.on{border-color:var(--accent);background:var(--accent-soft)}.vote-opt:disabled{cursor:default}.vote-in{display:flex;flex-direction:column;gap:6px;min-width:0}.vote-in b{font-size:14px}
.club-members{display:flex;flex-wrap:wrap;gap:10px}.cm{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:76px;text-align:center;font-size:12px}
.cm .avatar{width:46px;height:46px}.cm.done .avatar{box-shadow:0 0 0 3px var(--green)}.cm i{position:absolute;top:30px;right:12px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}.cm i .ic{width:11px;height:11px}
#clubBack .ic{transform:rotate(180deg)}
.nf-alert.club{cursor:pointer;border-color:var(--accent);background:var(--accent-soft)}.nf-alert.club .ic{color:var(--accent)}
@media (max-width:700px){.club-hero-in{flex-direction:column;align-items:flex-start;padding:20px}.club-hero-in>.cover{width:110px}.quote-card{width:250px}.rv-prompt{flex-wrap:wrap}}
.etat-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.etat-pick button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--glass-strong);text-align:left;transition:all .2s var(--ease)}
.etat-pick b{font-size:14px}.etat-pick small{font-size:11.5px;color:var(--ink-3);line-height:1.3}
.ep-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--line)}.ep-ic .ic{width:16px;height:16px}
.etat-pick [data-etat=bon][aria-pressed=true]{border-color:var(--green);background:var(--green-soft)}.etat-pick [data-etat=bon][aria-pressed=true] .ep-ic{background:var(--green);color:#fff}
.etat-pick [data-etat=abime][aria-pressed=true]{border-color:var(--warn);background:var(--warn-soft)}.etat-pick [data-etat=abime][aria-pressed=true] .ep-ic{background:var(--warn);color:#fff}
.etat-pick [data-etat=perdu][aria-pressed=true]{border-color:var(--danger);background:var(--danger-soft)}.etat-pick [data-etat=perdu][aria-pressed=true] .ep-ic{background:var(--danger);color:#fff}
.rem-act{display:flex;gap:6px}.rem-row.sent{opacity:.6}.rem-row.sent .rem-act .btn.primary{background:var(--green)}
.po-body{display:flex;flex-direction:column;gap:14px}
.po-group{border:1px solid var(--line);border-radius:16px;padding:10px;background:var(--glass)}.po-group.empty-g{opacity:.7}
.po-h{display:flex;gap:10px;align-items:center;padding:4px 6px 8px}
.po-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto 76px;gap:10px;align-items:center;padding:8px 6px;border-top:1px solid var(--line);cursor:pointer}
.po-row:not(.on){opacity:.65}.po-art b{display:block;font-size:14px}.po-art small{font-size:12px;color:var(--ink-3)}
.po-q{height:36px;text-align:center;padding:0 6px}
@media (max-width:700px){.etat-pick small{display:none}.po-row{grid-template-columns:auto minmax(0,1fr) 64px}.po-row .pill{display:none}}
.kiosk{position:fixed;inset:0;z-index:200;overflow:auto;padding:22px clamp(16px,3vw,40px) 30px;background:radial-gradient(1200px 600px at 10% -10%,#0A6FA8 0%,transparent 60%),radial-gradient(900px 500px at 100% 0%,#1E8E3E55 0%,transparent 60%),#04192A;color:#fff;-webkit-tap-highlight-color:transparent}
body.kiosk-on{overflow:hidden}
.k-head{display:flex;align-items:center;gap:16px}.k-head img{height:64px;width:auto;filter:drop-shadow(0 6px 16px rgba(0,0,0,.4))}
.k-head h1{margin:0;font:800 clamp(26px,3vw,38px) var(--display);letter-spacing:-.02em}.k-head p{margin:2px 0 0;color:rgba(255,255,255,.75);font-size:16px}
.k-clock{margin-left:auto;text-align:right;display:flex;flex-direction:column}.k-clock b{font:800 30px var(--display)}.k-clock span{font-size:13px;color:rgba(255,255,255,.7);text-transform:capitalize}
.k-full{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff}
.k-search{position:sticky;top:-22px;z-index:3;margin:20px 0 14px;display:flex;align-items:center;gap:12px;padding:0 18px;height:66px;border-radius:20px;background:#fff;color:#0B2235;box-shadow:0 20px 40px -20px rgba(0,0,0,.6)}
.k-search .ic{width:26px;height:26px;color:#0A6FA8;flex:none}.k-search input{flex:1;min-width:0;border:0;outline:0;background:none;font:600 22px var(--body);color:#0B2235;height:100%}
.k-search button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#EEF3F7;color:#0B2235}
.k-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.k-cats{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;padding-bottom:4px;scrollbar-width:none}
.k-cats button,.k-toggle{flex:none;height:46px;padding:0 18px;border-radius:14px;background:rgba(255,255,255,.1);color:#fff;font:650 15px var(--body);border:1px solid rgba(255,255,255,.14)}
.k-cats button[aria-pressed=true]{background:#fff;color:#0B2235}
.k-toggle{display:inline-flex;align-items:center;gap:8px}.k-toggle .ic{width:18px;height:18px;opacity:0}.k-toggle[aria-pressed=true]{background:#1E8E3E;border-color:#1E8E3E}.k-toggle[aria-pressed=true] .ic{opacity:1}
.k-count{margin:18px 0 12px;font-size:16px;color:rgba(255,255,255,.8)}.k-count b{color:#fff;font-size:20px}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px 18px}
.k-card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .25s var(--spring)}
.k-card:active{transform:scale(.97)}.k-card .cover{width:100%;box-shadow:0 18px 30px -16px rgba(0,0,0,.8)}
.k-t{font-size:15.5px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.k-a{font-size:13px;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-ok,.k-no{font-size:13px;font-weight:700}.k-ok{color:#7EE29A}.k-no{color:#FFB4A8}
.k-empty{grid-column:1/-1;padding:60px 20px;text-align:center;font-size:18px;color:rgba(255,255,255,.75)}
.k-foot{margin-top:34px;text-align:center;font-size:13px;color:rgba(255,255,255,.55)}
.k-detail{position:fixed;inset:0;z-index:5;background:rgba(2,12,20,.72);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;animation:kFade .25s ease both}
@keyframes kFade{from{opacity:0}}@keyframes kIn{from{opacity:0;transform:scale(.94)}}
.k-d-in{position:relative;width:min(860px,100%);max-height:calc(100vh - 40px);overflow:auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding:30px;border-radius:26px;background:linear-gradient(160deg,#0B2E47,#06192A);border:1px solid rgba(255,255,255,.12);box-shadow:0 40px 80px -30px #000;animation:kIn .4s var(--spring) both}
.k-d-cover{width:100%}.k-d-txt{display:flex;flex-direction:column;gap:12px;min-width:0}.k-d-txt h2{margin:0;font:800 clamp(26px,3vw,36px)/1.1 var(--display)}
.k-d-by{margin:0;color:rgba(255,255,255,.7);font-size:16px}
.k-d-st{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;font-size:15px}.k-d-st .ic{width:28px;height:28px;flex:none}.k-d-st b{display:block;font-size:17px}.k-d-st span{color:rgba(255,255,255,.85)}
.k-d-st span b{display:inline;font-size:inherit}
.empty>.ic{width:18px;height:18px;display:inline-block;vertical-align:-3px}
.k-d-st.ok{background:rgba(30,142,62,.25);border:1px solid #2EAF55}.k-d-st.no{background:rgba(200,60,40,.2);border:1px solid #D9654F}
.k-d-res{margin:0;font-size:16px;line-height:1.55;color:rgba(255,255,255,.88)}.k-d-help{margin:0;font-size:14px;color:rgba(255,255,255,.6)}
.k-close{position:absolute;top:14px;right:14px;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;z-index:2}
@media (max-width:700px){.k-d-in{grid-template-columns:1fr;padding:22px}.k-d-cover{width:160px}.k-clock{display:none}.k-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.k-search input{font-size:18px}}
.genre.sm{padding:8px 14px;border-radius:12px;font-size:13.5px}
.cls-add{display:flex;gap:8px;margin-top:10px}.cls-add input{flex:1;min-width:0}
/* espace enseignant */
.cls-title{margin:0;font-size:22px;letter-spacing:-.02em}
.cls-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:40px 22px}
.cls-empty h2{margin:0}.cls-empty p{margin:0;max-width:480px;color:var(--ink-2)}
.cons-list{display:flex;flex-direction:column;gap:10px}
.cons-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--glass-strong)}
.cons-row .mini-cover{width:42px;height:60px}
.cons-row.done{opacity:.65}
.cons-main{min-width:0;display:flex;flex-direction:column;gap:4px}.cons-main .t{font-weight:650}
.cons-msg{font-size:13.5px;color:var(--ink-2)}
.cons-meta{display:flex;gap:12px;flex-wrap:wrap}.cons-meta .ic{width:13px;height:13px;vertical-align:-2px;display:inline-block}
.cons-stats{display:flex;gap:16px}.cons-stats div{display:flex;flex-direction:column;align-items:flex-end}.cons-stats b{font:800 20px var(--display)}.cons-stats span{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.cons-act{display:flex;gap:6px;align-items:center}
.icon-btn.sm{width:34px;height:34px;border-radius:11px}.icon-btn.sm .ic{width:16px;height:16px}
.cons-old{margin-top:12px}.cons-old summary{cursor:pointer;color:var(--ink-2);font-weight:600;font-size:13.5px;margin-bottom:10px}
.cs-res{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto;margin-top:6px}
.cs-item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--glass-strong)}
.cs-item:hover{border-color:var(--accent)}.cs-item.on{cursor:default;border-color:var(--accent);background:var(--accent-soft)}
.cs-item span{flex:1;min-width:0}.cs-item b{display:block;font-size:14px}.cs-item small{display:block;font-size:12px;color:var(--ink-3)}
.cs-item .link{margin:0}
.cs-prev{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.stu-head{display:flex;gap:16px;align-items:center}.stu-head h2{margin:0 0 4px}

.stu-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stu-stats>div{padding:12px 14px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line)}

.toolbar>.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.toolbar>.seg button{white-space:nowrap;flex:none}
/* lecture donnée par l'enseignant (espace élève) */
.task-alert{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:18px;cursor:pointer;color:#fff;background:linear-gradient(120deg,#03263D,#0A6FA8 60%,#1A7F86);box-shadow:0 14px 30px -18px rgba(3,38,61,.8);transition:transform .25s var(--spring)}
.task-alert:hover{transform:translateY(-2px)}
.task-alert.soon{background:linear-gradient(120deg,#5A2A00,#B35C00 60%,#D98A00)}
.task-alert>.ic{width:18px;height:18px;flex:none;opacity:.8}
.ta-cover .mini-cover{width:48px;height:68px}
.ta-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ta-txt b{font-size:17px}.ta-txt p{margin:0;font-size:14px;color:rgba(255,255,255,.88)}
.ta-kick{font:750 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:#FFD45C;display:flex;align-items:center;gap:6px}.ta-kick .ic{width:14px;height:14px}
