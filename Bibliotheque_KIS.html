/* ============================================================ calculs */
let D = null;
function derive() {
  const T = todayISO(); const p = params();
  const livres = new Map(S.livres.map(b => [b.id, { ...b, sortis: 0, total: 0 }]));
  const membres = new Map(S.membres.map(m => [m.id, { ...m, cours: 0, retard: 0, dues: 0 }]));
  const emprunts = S.emprunts.map(e => {
    const prevu = e.prevu || addDays(e.date, p.duree);
    const end = e.retour || T;
    const jours = Math.max(0, diffDays(end, prevu));
    const statut = e.retour ? (jours > 0 ? "rendu-retard" : "rendu") : (T > prevu ? "retard" : "cours");
    const amende = jours * p.amende + (+e.frais || 0);
    const b = livres.get(e.livre), m = membres.get(e.membre);
    if (b) { b.total++; if (!e.retour) b.sortis++; }
    if (m) { if (!e.retour) m.cours++; if (statut === "retard") m.retard++; if (!e.paye) m.dues += amende; }
    return { ...e, prevu, jours, statut, amende, b, m };
  }).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (a.id < b.id ? 1 : -1));
  /* exemplaires mis de côté pour une réservation : ils ne sont plus disponibles pour les autres */
  const res = (S.reservations || []).filter(r => r.statut === "attente" || r.statut === "prete").map(r => ({ ...r, expiree: r.statut === "prete" && r.expire_le < T, b: livres.get(r.livre), m: membres.get(r.membre) })).filter(r => r.b);
  livres.forEach(b => { b.reserves = 0; b.attente = 0; });
  res.forEach(r => { if (r.statut === "attente") r.b.attente++; else if (!r.expiree) r.b.reserves++; });
  if (isReader() && store.dispo) livres.forEach(b => { const d = store.dispo.get(b.id) || {}; b.sortis = d.sortis || 0; b.reserves = d.reserves || 0; b.attente = d.attente || 0; b.total = d.total || 0; });
  livres.forEach(b => { b.dispo = (Number(b.ex) || 0) - b.sortis - b.reserves; });
  const fournitures = S.fournitures.map(f => {
    let ent = 0, sor = 0; S.mouvements.forEach(m => { if (m.article === f.id) { if (m.type === "entree") ent += +m.qte || 0; else sor += +m.qte || 0; } });
    const stock = (+f.initial || 0) + ent - sor;
    return { ...f, ent, sor, stock, valeur: stock * (+f.prix || 0), etat: stock <= 0 ? "rupture" : stock <= (+f.seuil || 0) ? "faible" : "ok" };
  }).sort((a, b) => a.article.localeCompare(b.article, "fr"));
  D = { T, p, livres, membres, emprunts, fournitures, res, fmap: new Map(fournitures.map(f => [f.id, f])) };
  return D;
}
function params() { return { ...DEFAULT_PARAMS, ...(S.params || {}) }; }
/* numéros de membre : A001 … A999, puis B001 … */
const memRank = id => { const m = /^([A-Z])(\d{3})$/.exec(id || ""); return m ? (m[1].charCodeAt(0) - 65) * 999 + +m[2] : 0; };
const memNum = r => String.fromCharCode(65 + Math.floor((r - 1) / 999)) + pad((r - 1) % 999 + 1, 3);
const nextMemberId = arr => memNum(Math.max(0, ...arr.map(x => memRank(x.id))) + 1);
/* anciens numéros (MEM-001…) → A001… ; les emprunts suivent */
function renumberMembers(data) {
  const old = (data.membres || []).filter(m => !memRank(m.id)); if (!old.length) return false;
  let r = Math.max(0, ...data.membres.map(m => memRank(m.id))); const map = new Map();
  old.sort((a, b) => String(a.id).localeCompare(String(b.id))).forEach(m => { map.set(m.id, memNum(++r)); m.id = map.get(m.id); });
  (data.emprunts || []).forEach(e => { if (map.has(e.membre)) e.membre = map.get(e.membre); });
  return true;
}
const nextId = (arr, prefix, len) => { let n = 0; arr.forEach(x => { const m = String(x.id).match(/(\d+)$/); if (m) n = Math.max(n, +m[1]); }); return prefix + pad(n + 1, len); };
const catColor = c => { const i = params().categories.indexOf(c); return `var(--c${(i < 0 ? hash(c) : i) % 9 + 1})`; };
const STAT = { cours: ["En cours", "info"], retard: ["En retard", "bad"], rendu: ["Rendu", "ok"], "rendu-retard": ["Rendu en retard", "warn"] };
const pill = (txt, tone) => `<span class="pill ${tone}">${esc(txt)}</span>`;
const bookAvail = b => b.dispo <= 0 ? ["Indisponible", "bad"] : (b.dispo === 1 && b.ex > 1) ? ["Dernier exemplaire", "warn"] : ["Disponible", "ok"];
const etatPill = f => f.etat === "rupture" ? pill("Rupture", "bad") : f.etat === "faible" ? pill("Stock faible", "warn") : pill("En stock", "ok");
const avatar = m => { const ph = PHOTOS.get(m.id); return ph ? `<img class="avatar" src="${esc(ph)}" alt="">` : `<span class="avatar" style="background:linear-gradient(135deg,var(--c${hash(m.id) % 9 + 1}),var(--c${(hash(m.id) + 3) % 9 + 1}))">${esc(initials(m.nom))}</span>`; };

function smooth(pts) {

  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const t = .18; let c1y = p1[1] + (p2[1] - p0[1]) * t, c2y = p2[1] - (p3[1] - p1[1]) * t;
    const lo = Math.min(p1[1], p2[1]), hi = Math.max(p1[1], p2[1]); c1y = Math.max(lo, Math.min(hi, c1y)); c2y = Math.max(lo, Math.min(hi, c2y));
    d += ` C${p1[0] + (p2[0] - p0[0]) * t},${c1y} ${p2[0] - (p3[0] - p1[0]) * t},${c2y} ${p2[0]},${p2[1]}`;
  }
  return d;
}

  const y = v => Tp + (H - Tp - B) * (1 - v / top);

  let g = ticks.map(t => `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join("");
  g += labels.map((l, i) => { const wd = parse(l).getDay(); return (wd === 0 || wd === 6) ? `<rect x="${L + i * slot}" y="${Tp}" width="${slot}" height="${H - Tp - B}" fill="var(--line)" opacity=".45"/>` : ""; }).join("");
  g += labels.map((l, i) => i % 5 === 4 || i === 0 ? `<text class="axis" x="${L + i * slot + slot / 2}" y="${H - 6}" text-anchor="middle">${fmtShort(l)}</text>` : "").join("");
  const bw = Math.max(3, slot * .3), gap = 1.5;
  const bars = labels.map((l, i) => series.map((s, si) => { const v = s.values[i]; if (!v) return "";
    const x = L + i * slot + slot / 2 + (si ? gap / 2 : -bw - gap / 2), yy = y(v), h = y(0) - yy;
    return `<rect class="bar" x="${x}" y="${yy}" width="${bw}" height="${h}" rx="${Math.min(3, bw / 2)}" fill="${s.color}" style="--d:${i}"/>`; }).join("")).join("");
  const hits = labels.map((l, i) => `<rect class="hit" x="${L + i * slot}" y="${Tp}" width="${slot}" height="${H - Tp - B}" fill="transparent" data-i="${i}"/>`).join("");
  return `<div class="chart-wrap" data-chart='${esc(JSON.stringify({ labels, series: series.map(s => ({ n: s.name, c: s.color, v: s.values })) }))}'>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Emprunts et retours par jour sur 30 jours (week-ends grisés)">${g}${bars}<line class="cross" x1="0" x2="0" y1="${Tp}" y2="${H - B}" stroke="var(--line-2)" stroke-dasharray="3 4" opacity="0"/>${hits}</svg><div class="tip"></div></div>`;
}

  const r = 62, C = 2 * Math.PI * r; let acc = 0;
  const segs = items.map(it => { const len = total ? it.value / total * C : 0; const gap = items.length > 1 ? Math.min(3, len * .3) : 0;
    const s = `<circle class="seg" cx="80" cy="80" r="${r}" fill="none" stroke="${it.color}" stroke-width="20" stroke-linecap="butt" stroke-dasharray="0 ${C}" stroke-dashoffset="${-acc}" data-dash="${Math.max(0, len - gap)} ${C}" data-off="${-acc}" transform="rotate(-90 80 80)"><title>${esc(it.label)} : ${it.value}</title></circle>`;
    acc += len; return s; }).join("");
  return `<div class="donut-box"><svg viewBox="0 0 160 160" role="img" aria-label="Répartition par catégorie"><circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--line)" stroke-width="20"/>${segs}
    <text class="donut-center" x="80" y="82" text-anchor="middle">${nf(total)}</text><text class="donut-center-s" x="80" y="100" text-anchor="middle">${unit}</text></svg>
    <div class="d-legend">${items.map(it => `<div><i style="background:${it.color}"></i><span>${esc(it.label)}</span><b>${nf(it.value)}</b></div>`).join("")}</div></div>`;
}
function bindCharts(root) {
  $$(".chart-wrap", root).forEach(w => {
    const data = JSON.parse(w.dataset.chart), tip = $(".tip", w), cross = $(".cross", w), svg = $("svg", w);
    $$(".hit", w).forEach(h => {
      h.addEventListener("pointerenter", () => {
        const i = +h.dataset.i, cx = +h.getAttribute("x") + +h.getAttribute("width") / 2, sc = svg.getBoundingClientRect().width / 640;
        cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("opacity", 1);
        tip.innerHTML = `<div style="color:var(--ink-3);margin-bottom:3px">${fmtLong(data.labels[i])}</div>` + data.series.map(s => `<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.c};margin-right:6px"></i>${s.n} <b>${s.v[i]}</b></div>`).join("");
        tip.style.left = Math.max(70, Math.min(w.clientWidth - 70, cx * sc)) + "px"; tip.style.top = "40px"; tip.style.opacity = 1;

}

/* ---------- rapport ---------- */
/* ============================================================ rapports (aperçu + PDF) */
const REPORTS = [
  { id: "biblio", label: "Bibliothèque", sub: "Activité du mois", icon: "book", monthly: true },
  { id: "fourn", label: "Fournitures", sub: "Stock du mois", icon: "box", monthly: true },
  { id: "retards", label: "Retards et amendes", sub: "Situation à ce jour", icon: "clock" },
  { id: "inventaire", label: "Inventaire des livres", sub: "Catalogue à ce jour", icon: "list" },
];
function monthBounds(m) { const s = m + "-01"; const e = parse(s); e.setMonth(e.getMonth() + 1); e.setDate(0); return [s, iso(e)]; }
function monthOptions() { const out = []; const d = parse(todayISO().slice(0, 8) + "01"); for (let i = 0; i < 24; i++) { out.push(iso(d).slice(0, 7)); d.setMonth(d.getMonth() - 1); } return out; }
const monthLabel = m => { const d = parse(m + "-01"); return MOIS[d.getMonth()] + " " + d.getFullYear(); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const ST_TXT = { rupture: "Rupture", faible: "Stock faible", ok: "En stock" };

function reportModel(kind, m) {
  const p = params(), T = todayISO(), E = D.emprunts;
  const base = { kind, school: p.ecole, year: p.annee, edited: fmtD(T), signatures: false };
  if (kind === "biblio" || kind === "fourn") {
    const [s, e] = monthBounds(m); const inM = d => d && d >= s && d <= e;
    base.period = `${cap(monthLabel(m))} · du ${fmtD(s)} au ${fmtD(e)}`; base.signatures = true;
    if (kind === "biblio") {
      const loansM = E.filter(x => inM(x.date));
      const k = [
        ["Emprunts", loansM.length], ["Retours", E.filter(x => inM(x.retour)).length],
        ["Retours en retard", E.filter(x => inM(x.retour) && x.retour > x.prevu).length],
        ["Sortis en fin de mois", E.filter(x => x.date <= e && !(x.retour && x.retour <= e)).length],
        ["En retard en fin de mois", E.filter(x => x.prevu < e && x.date <= e && !(x.retour && x.retour <= e)).length],
        ["Membres inscrits", S.membres.filter(x => (x.inscription || "") <= e).length], ["Nouveaux membres", S.membres.filter(x => inM(x.inscription)).length],
        ["Lecteurs actifs", new Set(loansM.map(x => x.membre)).size], ["Amendes du mois", fc(E.filter(x => inM(x.retour)).reduce((a, x) => a + x.amende, 0))],
        ["dont encaissées", fc(E.filter(x => inM(x.retour) && x.paye).reduce((a, x) => a + x.amende, 0))]];
      const cats = p.categories.map(c => { const bs = S.livres.filter(b => b.categorie === c); const ids = new Set(bs.map(b => b.id)); const ex = bs.reduce((a, b) => a + (+b.ex || 0), 0);
        const em = loansM.filter(x => ids.has(x.livre)).length, so = E.filter(x => ids.has(x.livre) && x.date <= e && !(x.retour && x.retour <= e)).length;
        return { c, t: bs.length, ex, em, so }; }).filter(r => r.t);
      const tot = cats.reduce((a, r) => ({ t: a.t + r.t, ex: a.ex + r.ex, em: a.em + r.em, so: a.so + r.so }), { t: 0, ex: 0, em: 0, so: 0 });
      const cnt = {}; loansM.forEach(x => cnt[x.livre] = (cnt[x.livre] || 0) + 1);
      const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 10);
      const byClass = {}; loansM.forEach(x => { const c = x.m ? x.m.classe : "—"; (byClass[c] = byClass[c] || { n: 0, mem: new Set() }).n++; byClass[c].mem.add(x.membre); });
      const classes = Object.entries(byClass).sort((a, b) => b[1].n - a[1].n);
      return { ...base, title: "Rapport mensuel de la bibliothèque", sections: [
        { title: "Activité du mois", kpis: k },
        { title: "Fonds et emprunts par catégorie", table: { head: ["Catégorie", "Titres", "Exemplaires", "Emprunts du mois", "Part", "Sortis (fin de mois)", "Disponibles"], align: ["l", "c", "c", "c", "c", "c", "c"],
          body: cats.map(r => [r.c, r.t, r.ex, r.em, (tot.em ? Math.round(r.em / tot.em * 100) : 0) + " %", r.so, r.ex - r.so]),

/* ============================================================ ISBN, recherche sur Internet et scan */
const isbnDigits = s => String(s || "").toUpperCase().replace(/[^0-9X]/g, "");
/* renvoie l'ISBN-13 valide (978/979…) ou "" ; accepte un ISBN-10 */
function cleanIsbn(s) {
  const d = isbnDigits(s);
  if (/^97[89]\d{10}$/.test(d)) { const sum = [...d.slice(0, 12)].reduce((a, c, i) => a + c * (i % 2 ? 3 : 1), 0); return (10 - sum % 10) % 10 === +d[12] ? d : ""; }
  if (/^\d{9}[\dX]$/.test(d)) {
    const sum = [...d].reduce((a, c, i) => a + (c === "X" ? 10 : +c) * (10 - i), 0); if (sum % 11) return "";
    const b = "978" + d.slice(0, 9); const s13 = [...b].reduce((a, c, i) => a + c * (i % 2 ? 3 : 1), 0); return b + (10 - s13 % 10) % 10;
  }
  return "";
}
const sameIsbn = (a, b) => { const x = cleanIsbn(a) || isbnDigits(a), y = cleanIsbn(b) || isbnDigits(b); return !!x && x === y; };
const bookByIsbn = isbn => S.livres.find(b => b.isbn && sameIsbn(b.isbn, isbn));

/* couverture : copiée dans le fichier sur ordinateur (fonctionne hors connexion), sinon simple lien */
/* ---------- couvertures : copie durable ----------
   En ligne : copie réduite (≈ 15 Ko) dans le stockage Supabase « couvertures ».
   Logiciel de bureau : image enregistrée dans le fichier de données.
   Navigateur seul (sans serveur) : simple lien, pour ne pas saturer la mémoire du navigateur. */
const COVER_W = 200;
const coverSrc = url => { url = String(url || "").replace(/^http:/, "https:").replace("&edge=curl", "");
  if (/covers\.openlibrary\.org/.test(url) && !/default=false/.test(url)) url += (url.includes("?") ? "&" : "?") + "default=false"; return url; };
const isOurCover = url => /^data:image\//.test(url || "") || /\/storage\/v1\/object\/public\/couvertures\//.test(url || "");
async function fetchImage(url) {
  /* certaines images refusent d'être lues par une page web : on passe alors par un relais public (wsrv.nl) */
  const tries = [url, "https://wsrv.nl/?url=" + encodeURIComponent(url.replace(/^https?:\/\//, "")) + "&w=400&output=jpg"];
  for (const u of tries) {
    try { const r = await fetch(u, { mode: "cors", credentials: "omit" }); if (!r.ok) continue; const b = await r.blob(); if (b.size > 600 && /^image\//.test(b.type)) return b; } catch {}
  }
  throw new Error("Couverture inaccessible");
}

  const img = await new Promise((res, rej) => { const i = new Image(), u = URL.createObjectURL(blob); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = () => { URL.revokeObjectURL(u); rej(new Error("Image illisible")); }; i.src = u; });
  if (img.naturalWidth < 40 || img.naturalHeight < 50) throw new Error("Image trop petite");
  const w = Math.min(COVER_W, img.naturalWidth), h = Math.round(img.naturalHeight * w / img.naturalWidth);
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.imageSmoothingQuality = "high"; x.drawImage(img, 0, 0, w, h);
  return new Promise(res => c.toBlob(res, "image/jpeg", .8));
}
const blobToDataURL = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });

  if (store.mode === "cloud") {
    const path = `livres/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}.jpg`;
    const st = auth.sb.storage.from("couvertures");
    const { error } = await st.upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000", upsert: false });
    if (error) throw error;

const CAT_HINTS = [
  [/afric|congo|camara|kourouma|senghor|achebe|ngugi|ba,? mariama|oyono|beti|mabanckou/, ["Littérature africaine"]],
  [/juvenile|jeunesse|children|enfant|conte|fairy|album|bande dessin|comic/, ["Jeunesse"]],
  [/math|algebr|g[ée]om[ée]tr|arithm|calcul|statisti/, ["Mathématiques"]],
  [/comput|informati|programm|internet|logiciel|software|code\b|python|java/, ["Informatique"]],
  [/histor|g[ée]ograph|geograph|world war|guerre|civilisation|atlas/, ["Histoire-Géo"]],
  [/dictionar|dictionn|encyclop|reference|r[ée]f[ée]rence|grammaire|grammar/, ["Référence", "Langues"]],
  [/language|langue|english|anglais|fran[cç]ais|swahili|lingala|linguisti|vocabula/, ["Langues"]],
  [/scien|biolog|chimi|chemis|physi|nature|m[ée]decin|medic|astronom|ecolog|environnement/, ["Sciences"]],
  [/fiction|roman|novel|po[ée]s|poetry|th[ée][aâ]tre|drama|litt[ée]rature|literature/, ["Roman"]],

function guessCategory(r) {
  const cats = params().categories, txt = norm([...(r.cats || []), r.titre, r.auteur].join(" "));
  for (const [re, names] of CAT_HINTS) if (re.test(txt)) { const c = names.find(n => cats.includes(n)); if (c) return c; }

}
async function searchBooks(q) {
  const isbn = cleanIsbn(q);
  const enc = encodeURIComponent;
  const [g, o] = await Promise.allSettled([
    netJSON(`https://www.googleapis.com/books/v1/volumes?q=${isbn ? "isbn:" + isbn : enc(q)}&maxResults=12&printType=books`),
    netJSON(`https://openlibrary.org/search.json?${isbn ? "isbn=" + isbn : "q=" + enc(q)}&limit=10&fields=key,title,subtitle,author_name,first_publish_year,publisher,isbn,cover_i,subject,number_of_pages_median`),
  ]);
  if (g.status === "rejected" && o.status === "rejected") throw g.reason;
  const out = [];
  ((g.value && g.value.items) || []).forEach(it => {
    const v = it.volumeInfo || {}; const ids = v.industryIdentifiers || [];
    const i13 = (ids.find(x => x.type === "ISBN_13") || {}).identifier, i10 = (ids.find(x => x.type === "ISBN_10") || {}).identifier;
    if (!v.title) return;
    out.push({ titre: v.title + (v.subtitle && v.title.length < 40 ? " : " + v.subtitle : ""), auteur: (v.authors || []).slice(0, 3).join(", "), editeur: v.publisher || "",
      annee: (v.publishedDate || "").slice(0, 4), isbn: cleanIsbn(i13 || i10 || "") || (isbn || ""), img: (v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail)) || "",
      cats: v.categories || [], resume: (v.description || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(), pages: v.pageCount || "", src: "Google Livres" });
  });
  ((o.value && o.value.docs) || []).forEach(d => {
    if (!d.title) return;
    const i = isbn || (d.isbn || []).map(cleanIsbn).find(Boolean) || "";
    out.push({ titre: d.title + (d.subtitle && d.title.length < 40 ? " : " + d.subtitle : ""), auteur: (d.author_name || []).slice(0, 3).join(", "), editeur: (d.publisher || [])[0] || "",
      annee: d.first_publish_year ? String(d.first_publish_year) : "", isbn: i, img: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : "",
      cats: (d.subject || []).slice(0, 12), resume: "", pages: d.number_of_pages_median || "", src: "Open Library" });
  });
  /* fusion des doublons : on complète la fiche Google avec Open Library */
  const seen = new Map(), res = [];
  out.forEach(r => {
    const k = r.isbn || norm(r.titre + "|" + r.auteur.split(",")[0]); const prev = seen.get(k);
    if (prev) { ["auteur", "editeur", "annee", "img", "resume", "pages"].forEach(f => { if (!prev[f] && r[f]) prev[f] = r[f]; }); prev.cats = prev.cats.concat(r.cats); return; }
    seen.set(k, r); res.push(r);
  });
  return res.slice(0, 16);
}

  if (sheetEl && sheetEl.onIsbn) return sheetEl.onIsbn(isbn);
  if (!D) derive();
  const b = bookByIsbn(isbn);
  if (b) { beep(); return bookDetail(b.id); }
  if (!can("biblio")) return toast("Aucun livre du catalogue avec l'ISBN " + isbn, true);
  bookSheet(null, { isbn });
}
async function scanAndOpen() { const i = await scanISBN("Scanner un livre"); if (i) handleIsbn(i); }
/* douchette USB : elle « tape » les chiffres très vite puis Entrée */
const wedge = { buf: "", last: 0 };
document.addEventListener("keydown", e => {
  if (scanning || document.body.classList.contains("locked")) return;
  const a = document.activeElement, inField = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
  const now = performance.now(); if (now - wedge.last > 60) wedge.buf = ""; wedge.last = now;
  if (/^[0-9Xx]$/.test(e.key)) { wedge.buf += e.key; return; }
  if (e.key !== "Enter" || wedge.buf.length < 10) return;
  const typed = wedge.buf, isbn = cleanIsbn(typed); wedge.buf = ""; if (!isbn) return;
  if (inField && (a.id === "b-isbn" || a.id === "lk-q")) return;   // ces champs gèrent eux-mêmes l'ISBN
  if (inField && a.value.endsWith(typed)) { a.value = a.value.slice(0, -typed.length); a.dispatchEvent(new Event("input", { bubbles: true })); }
  e.preventDefault(); e.stopPropagation(); handleIsbn(isbn);
}, true);

    items = [...B, ...M, ...A]; sel = Math.min(sel, Math.max(0, items.length - 1));

    $$("[data-pi]", palEl).forEach(b => { b.onclick = () => run(+b.dataset.pi); b.onpointermove = () => { if (sel !== +b.dataset.pi) { sel = +b.dataset.pi; $$("[data-pi]", palEl).forEach(x => x.setAttribute("aria-selected", +x.dataset.pi === sel)); } }; });

    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % Math.max(1, items.length); $$("[data-pi]", palEl).forEach(x => x.setAttribute("aria-selected", +x.dataset.pi === sel)); $(`[data-pi="${sel}"]`, palEl)?.scrollIntoView({ block: "nearest" }); }

  });
  draw(); setTimeout(() => input.focus(), 30);
}

async function saveFile(name, text, mime = "text/html") {
  const blob = text instanceof Blob ? text : new Blob([text], { type: mime + ";charset=utf-8" });
  if (store.mode === "db") {
    let dl = null; try { dl = await window.claude.use("downloads"); } catch {}
    if (!dl) return toast("Le téléchargement n'est pas disponible ici.", true);
    try { const r = await dl.save({ filename: name, data: blob }); if (r && r.status === "saved") toast("Fichier enregistré : " + name); } catch (e) { if (e && e.code !== "cancelled" && e.code !== "declined") toast("Le fichier n'a pas pu être enregistré.", true); }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast("Fichier enregistré : " + name);
}

  if (kind === "json") return saveFile(`bibliotheque-kis-sauvegarde-${T}.json`, JSON.stringify({ app: "bibliotheque-kis", version: 1, exportedAt: new Date().toISOString(), params: params(), ...Object.fromEntries(COLS.map(c => [c, S[c]])) }, null, 1), "application/json");
  const t = {
    livres: [["Code", "Titre", "Auteur", "Catégorie", "Éditeur", "Année", "ISBN", "Rayon", "Exemplaires", "Disponibles", "Emprunts"], ...[...D.livres.values()].map(b => [b.id, b.titre, b.auteur, b.categorie, b.editeur, b.annee, b.isbn, b.rayon, b.ex, b.dispo, b.total])],
    membres: [["ID", "Nom", "Type", "Classe", "Sexe", "Inscription", "Emprunts en cours", "En retard", "Amendes dues (FC)"], ...[...D.membres.values()].map(m => [m.id, m.nom, m.type, m.classe, m.sexe, fmtD(m.inscription), m.cours, m.retard, m.dues])],
    emprunts: [["N°", "Date", "ID membre", "Membre", "Code livre", "Livre", "À rendre le", "Rendu le", "Statut", "Jours de retard", "Amende (FC)", "Payée"], ...D.emprunts.map(e => [e.id, fmtD(e.date), e.membre, e.m ? e.m.nom : "", e.livre, e.b ? e.b.titre : "", fmtD(e.prevu), e.retour ? fmtD(e.retour) : "", STAT[e.statut][0], e.jours, e.amende, e.paye ? "Oui" : "Non"])],
    fournitures: [["Code", "Article", "Catégorie", "Unité", "Stock initial", "Entrées", "Sorties", "Stock actuel", "Seuil", "Prix (FC)", "Valeur (FC)", "Fournisseur"], ...D.fournitures.map(f => [f.id, f.article, f.categorie, f.unite, f.initial, f.ent, f.sor, f.stock, f.seuil, f.prix, f.valeur, f.fournisseur])],
  }[kind];
  saveFile(`${kind}-${T}.csv`, csv(t), "text/csv");
}
function importBackup(file) {
  if (!file) return; const r = new FileReader();
  r.onload = () => { let data; try { data = JSON.parse(r.result); } catch { return toast("Ce fichier n'est pas une sauvegarde valide.", true); }
    if (!data || !COLS.some(c => Array.isArray(data[c]))) return toast("Ce fichier ne contient pas de données de bibliothèque.", true);
    renumberMembers(data);
    confirmSheet("Restaurer cette sauvegarde ?", `${(data.livres || []).length} livres, ${(data.membres || []).length} membres et ${(data.emprunts || []).length} emprunts remplaceront les données actuelles.`, "Restaurer", () => bulkReplace(data, "Restauration…")); };
  r.readAsText(file);
}

    <p style="font-size:12.5px;color:var(--ink-3)">Les exemples sont fictifs. Vous pourrez les effacer à tout moment dans Réglages.</p></div></div>`;
}
function bindWelcome() {
  $("#eyebrow").textContent = "Kivu International School"; $("#viewTitle").textContent = "Bibliothèque"; $("#primaryBtn").hidden = true;
  $("#wSample").onclick = () => bulkReplace(makeSample(), "Chargement des exemples…");
  $("#wEmpty").onclick = () => saveParams({ ...DEFAULT_PARAMS });
}
function progressOverlay(label) {
  openSheet(label, `<p style="margin:0;color:var(--ink-2)">Gardez cette page ouverte.</p><div class="progress"><b id="pg"></b></div><div id="pgT" style="font:700 14px var(--display)">0 %</div>`, null);
  return { set: k => { const b = $("#pg"), t = $("#pgT"); if (b) b.style.width = Math.round(k * 100) + "%"; if (t) t.textContent = Math.round(k * 100) + " %"; }, close: () => closeSheet() };
}
function toast(msg, err) {
  const el = document.createElement("div"); el.className = "toast" + (err ? " err" : "");
  el.innerHTML = `<span class="ic">${ic(err ? "alert" : "check")}</span><span>${esc(msg)}</span>`;
  $("#toasts").appendChild(el); setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 300); }, err ? 4200 : 2600);
}
function isDark() { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
$("#themeBtn").addEventListener("click", () => { document.documentElement.dataset.theme = isDark() ? "light" : "dark"; try { localStorage.setItem("kis-theme", document.documentElement.dataset.theme); } catch {} syncChrome(); });
try { const t = localStorage.getItem("kis-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
$("#openPalette").addEventListener("click", openPalette);
addEventListener("resize", () => syncNav());
setInterval(() => { if (D && D.T !== todayISO()) render(); }, 60000);

$("#railLogo").src = LOGO;
$("#fab").innerHTML = ic("plus") + "<span>Ajouter</span>"; $("#fab").addEventListener("click", addMenu);
applyPerms();
buildNav(); render(); initStore();
</script>
