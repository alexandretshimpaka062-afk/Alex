        $("#dupBox", el).innerHTML = d ? `<div class="warn-box">${ic("alert")}<div><b>${esc(d.article)}</b> existe déjà. <button type="button" class="link" id="goMv">Enregistrer plutôt une entrée de stock</button></div></div>` : "";
        const g = $("#goMv", el); if (g) g.onclick = () => moveSheet(d.id, "entree"); });
      wireForm(el, { view: "fournitures",
        save: () => { const article = val("s-art"); if (!article) return fieldErr(el, "s-art", "Indiquez le nom de l'article.");
          const obj = { ...f, id: f.id || nextId(S.fournitures, "FOU-", 3), article, categorie: val("s-cat") || "Divers", unite: val("s-unite"), initial: +val("s-init") || 0, seuil: +val("s-seuil") || 0, prix: +val("s-prix") || 0, fournisseur: val("s-four") };
          put("fournitures", obj); toast(isNew ? article + " ajouté au stock" : "Article modifié"); return obj.id; },
        reset: () => { ["s-art", "s-prix"].forEach(i => $("#" + i, el).value = ""); $("#s-init", el).value = 0; $("#dupBox", el).innerHTML = ""; $("#s-art", el).focus(); },
        onDelete: () => { if (S.mouvements.some(x => x.article === f.id)) return toast("Cet article a des mouvements enregistrés : il ne peut pas être supprimé.", true);
          confirmSheet("Supprimer " + f.article + " ?", "L'article sera retiré du stock.", "Supprimer", () => { del("fournitures", f.id); toast("Article supprimé"); }); } });
    });
}
function moveSheet(pre, preType) {
  if (!guard("fourn")) return;
  if (!S.fournitures.length) return supplySheet();
  let type = preType || "sortie";
  if (!pre) pre = (D.fournitures.find(f => f.stock > 0) || D.fournitures[0]).id;
  openSheet("Mouvement de stock", `
    <div class="seg big" role="group"><button type="button" data-mt="sortie" aria-pressed="${type === "sortie"}">${ic("up")} Sortie (distribution)</button><button type="button" data-mt="entree" aria-pressed="${type === "entree"}">${ic("down")} Entrée (achat)</button></div>
    <div class="f"><label for="mv-a">${req("Article")}</label><select id="mv-a">${D.fournitures.map(f => `<option value="${esc(f.id)}" ${f.id === pre ? "selected" : ""}>${esc(f.article)} · ${f.stock} en stock</option>`).join("")}</select></div>
    <div class="f2">${numField("mv-q", req("Quantité"), 1, 1)}<div class="f"><label for="mv-d">Date</label><input id="mv-d" type="date" value="${todayISO()}"></div></div>
    <div class="f"><label for="mv-t" id="mvTL">Bénéficiaire</label><input id="mv-t" list="dlTiers" autocomplete="off" placeholder="Classe, service…">${dlist("dlTiers", [...S.mouvements.map(x => x.tiers), ...params().classes])}</div>
    <div class="f"><label for="mv-n">Remarque</label><input id="mv-n" autocomplete="off"></div>
    <div class="recap" id="mvRecap"></div>
    <p class="form-note"><button class="link" type="button" id="newArt">${ic("plus")} L'article n'existe pas encore ? Créez-le</button></p>`,
    formFoot(true),
    el => {
      const recap = () => { const f = D.fmap.get(val("mv-a")), q = Math.max(0, +val("mv-q") || 0), after = f.stock + (type === "entree" ? q : -q);
        $("#mvRecap", el).innerHTML = `<div>Stock actuel : <b>${f.stock} ${esc(f.unite.toLowerCase())}</b> → après ce mouvement : <b style="color:var(--${after < 0 ? "danger" : after <= f.seuil ? "warn" : "green"})">${after}</b></div>${after >= 0 && after <= f.seuil ? `<div style="color:var(--warn);font-weight:600">Le stock sera au seuil d'alerte (${f.seuil}).</div>` : ""}`; };
      const setType = t => { type = t; $$("[data-mt]", el).forEach(x => x.setAttribute("aria-pressed", x.dataset.mt === t)); $("#mvTL", el).textContent = t === "entree" ? "Fournisseur" : "Bénéficiaire"; $("#mv-t", el).placeholder = t === "entree" ? "Nom du fournisseur" : "Classe, service…"; recap(); };
      $$("[data-mt]", el).forEach(b => b.onclick = () => setType(b.dataset.mt));
      $("#mv-a", el).addEventListener("change", recap); $("#mv-q", el).addEventListener("input", recap);
      $("#newArt", el).onclick = () => supplySheet();
      setType(type);
      wireForm(el, { view: "fournitures",
        save: () => { const art = val("mv-a"), q = +val("mv-q"), f = D.fmap.get(art);
          if (!(q >= 1)) return fieldErr(el, "mv-q", "Indiquez une quantité d'au moins 1.");
          if (type === "sortie" && q > f.stock) return fieldErr(el, "mv-q", `Stock insuffisant : ${f.stock} ${f.unite.toLowerCase()} disponible(s).`);
          put("mouvements", { id: nextId(S.mouvements, "MVT-", 4), date: val("mv-d") || todayISO(), article: art, type, qte: q, tiers: val("mv-t"), note: val("mv-n") });
          toast((type === "entree" ? "Entrée" : "Sortie") + " enregistrée · " + q + " " + f.unite.toLowerCase()); derive(); return art; },
        reset: () => { $("#mv-q", el).value = 1; $("#mv-n", el).value = ""; $("#mv-a", el).innerHTML = D.fournitures.map(f => `<option value="${esc(f.id)}">${esc(f.article)} · ${f.stock} en stock</option>`).join(""); recap(); $("#mv-a", el).focus(); } });
    });
}
/* menu « Ajouter » disponible partout */

    <div class="rows">${[...navViews(), ...(store.mode === "cloud" && can("comptes") ? [{ id: "comptes", label: "Comptes", icon: "key" }] : [])].filter(v => !["accueil", "livres", "emprunts", "membres", "espace"].includes(v.id) && (v.id !== "reglages" || can("admin"))).map(v => `<button class="row" type="button" style="grid-template-columns:auto 1fr auto;text-align:left" data-go-more="${v.id}"><span class="k-ic" style="width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)">${ic(v.icon)}</span><span class="t">${v.label}</span>${ic("arrow")}</button>`).join("")}</div>

    el => { $$("[data-go-more]", el).forEach(b => b.onclick = () => { closeSheet(); go(b.dataset.goMore); }); const o = $("#moreOut", el); if (o) o.onclick = signOut; const me = $("#moreMe", el); if (me) me.onclick = profileSheet; });

/* ============================================================ palette ⌘K */
let palEl = null;
function openPalette() {
  if (palEl || !store.ready || !D) return;
  palEl = document.createElement("div"); palEl.className = "palette";
  palEl.innerHTML = `<div class="backdrop"></div><div class="pal" role="dialog" aria-label="Recherche"><div class="pal-in">${ic("search")}<input id="palQ" placeholder="Livre, membre, action…" autocomplete="off"><kbd style="font:600 11px var(--mono);color:var(--ink-3)">esc</kbd></div><div class="pal-list" id="palList"></div></div>`;
  document.body.appendChild(palEl);
  $(".backdrop", palEl).onclick = closePalette;
  const input = $("#palQ", palEl); let items = [], sel = 0;
  const actions = [["Ajouter…", "plus", () => addMenu(), can("biblio") || can("fourn")], ["Nouvel emprunt", "plus", () => loanSheet(), can("biblio")], ["Enregistrer un retour", "ret", () => returnPicker(), can("biblio")], ["Ajouter un livre", "book", () => bookSheet(), can("biblio")], ["Ajouter un membre", "users", () => memberSheet(), can("biblio")], ["Mouvement de stock", "box", () => moveSheet(), can("fourn")], ...navViews().filter(v => v.id !== "reglages" || can("admin")).map(v => ["Aller à : " + v.label, v.icon, () => go(v.id), true])].filter(a => a[3]);
  const draw = () => {
    const q = norm(input.value); items = [];
    const A = actions.filter(a => !q || norm(a[0]).includes(q)).slice(0, q ? 4 : 6).map(a => ({ g: "Actions", html: `${ic(a[1])}<span class="t">${a[0]}</span>`, run: a[2] }));
    const B = q ? [...D.livres.values()].filter(b => norm(b.titre + " " + b.auteur + " " + b.id + " " + b.isbn).includes(q)).slice(0, 6).map(b => { const [l, t] = bookAvail(b); return { g: "Livres", html: `${miniCover(b)}<div><div class="t">${esc(b.titre)}</div><div class="s">${esc(b.auteur)} · ${esc(b.rayon || "")}</div></div><span class="end">${pill(b.dispo + "/" + b.ex, t)}</span>`, run: () => bookDetail(b.id) }; }) : [];
    const M = q && !isReader() ? [...D.membres.values()].filter(m => norm(m.nom + " " + m.classe + " " + m.id).includes(q)).slice(0, 6).map(m => ({ g: "Membres", html: `${avatar(m)}<div><div class="t">${esc(m.nom)}</div><div class="s">${esc(m.classe)}</div></div>${m.retard ? `<span class="end">${pill("En retard", "bad")}</span>` : ""}`, run: () => memberDetail(m.id) })) : [];
    items = [...B, ...M, ...A]; sel = Math.min(sel, Math.max(0, items.length - 1));
    let g = ""; $("#palList", palEl).innerHTML = items.map((it, i) => (it.g !== g ? `<div class="pal-group">${g = it.g}</div>` : "") + `<button class="pal-item" type="button" data-pi="${i}" aria-selected="${i === sel}">${it.html}</button>`).join("") || '<div class="empty">Aucun résultat.</div>';
    $$("[data-pi]", palEl).forEach(b => { b.onclick = () => run(+b.dataset.pi); b.onpointermove = () => { if (sel !== +b.dataset.pi) { sel = +b.dataset.pi; $$("[data-pi]", palEl).forEach(x => x.setAttribute("aria-selected", +x.dataset.pi === sel)); } }; });
  };
  const run = i => { const it = items[i]; if (!it) return; closePalette(); it.run(); };
  input.addEventListener("input", () => { sel = 0; draw(); });
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % Math.max(1, items.length); $$("[data-pi]", palEl).forEach(x => x.setAttribute("aria-selected", +x.dataset.pi === sel)); $(`[data-pi="${sel}"]`, palEl)?.scrollIntoView({ block: "nearest" }); }
    if (e.key === "Enter") { e.preventDefault(); run(sel); }
  });
  draw(); setTimeout(() => input.focus(), 30);
}
function closePalette() { if (palEl) { palEl.remove(); palEl = null; } }

/* ============================================================ fichiers */
async function saveFile(name, text, mime = "text/html") {
  const blob = text instanceof Blob ? text : new Blob([text], { type: mime + ";charset=utf-8" });
  if (store.mode === "db") {
    let dl = null; try { dl = await window.claude.use("downloads"); } catch {}
    if (!dl) return toast("Le téléchargement n'est pas disponible ici.", true);
    try { const r = await dl.save({ filename: name, data: blob }); if (r && r.status === "saved") toast("Fichier enregistré : " + name); } catch (e) { if (e && e.code !== "cancelled" && e.code !== "declined") toast("Le fichier n'a pas pu être enregistré.", true); }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast("Fichier enregistré : " + name);
}
function csv(rows) { return "﻿" + rows.map(r => r.map(v => { const s = String(v ?? ""); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(";")).join("\r\n"); }
function exportData(kind) {
  const T = todayISO();
  if (kind === "json") return saveFile(`bibliotheque-kis-sauvegarde-${T}.json`, JSON.stringify({ app: "bibliotheque-kis", version: 1, exportedAt: new Date().toISOString(), params: params(), ...Object.fromEntries(COLS.map(c => [c, S[c]])) }, null, 1), "application/json");
  const t = {
    livres: [["Code", "Titre", "Auteur", "Catégorie", "Éditeur", "Année", "ISBN", "Rayon", "Exemplaires", "Disponibles", "Emprunts"], ...[...D.livres.values()].map(b => [b.id, b.titre, b.auteur, b.categorie, b.editeur, b.annee, b.isbn, b.rayon, b.ex, b.dispo, b.total])],
    membres: [["ID", "Nom", "Type", "Classe", "Sexe", "Inscription", "Emprunts en cours", "En retard", "Amendes dues (FC)"], ...[...D.membres.values()].map(m => [m.id, m.nom, m.type, m.classe, m.sexe, fmtD(m.inscription), m.cours, m.retard, m.dues])],
    emprunts: [["N°", "Date", "ID membre", "Membre", "Code livre", "Livre", "À rendre le", "Rendu le", "Statut", "Jours de retard", "Amende (FC)", "Payée"], ...D.emprunts.map(e => [e.id, fmtD(e.date), e.membre, e.m ? e.m.nom : "", e.livre, e.b ? e.b.titre : "", fmtD(e.prevu), e.retour ? fmtD(e.retour) : "", STAT[e.statut][0], e.jours, e.amende, e.paye ? "Oui" : "Non"])],
    fournitures: [["Code", "Article", "Catégorie", "Unité", "Stock initial", "Entrées", "Sorties", "Stock actuel", "Seuil", "Prix (FC)", "Valeur (FC)", "Fournisseur"], ...D.fournitures.map(f => [f.id, f.article, f.categorie, f.unite, f.initial, f.ent, f.sor, f.stock, f.seuil, f.prix, f.valeur, f.fournisseur])],
  }[kind];
  saveFile(`${kind}-${T}.csv`, csv(t), "text/csv");
}
function importBackup(file) {
  if (!file) return; const r = new FileReader();
  r.onload = () => { let data; try { data = JSON.parse(r.result); } catch { return toast("Ce fichier n'est pas une sauvegarde valide.", true); }
    if (!data || !COLS.some(c => Array.isArray(data[c]))) return toast("Ce fichier ne contient pas de données de bibliothèque.", true);
    renumberMembers(data);
    confirmSheet("Restaurer cette sauvegarde ?", `${(data.livres || []).length} livres, ${(data.membres || []).length} membres et ${(data.emprunts || []).length} emprunts remplaceront les données actuelles.`, "Restaurer", () => bulkReplace(data, "Restauration…")); };
  r.readAsText(file);
}

function progressOverlay(label) {
  openSheet(label, `<p style="margin:0;color:var(--ink-2)">Gardez cette page ouverte.</p><div class="progress"><b id="pg"></b></div><div id="pgT" style="font:700 14px var(--display)">0 %</div>`, null);
  return { set: k => { const b = $("#pg"), t = $("#pgT"); if (b) b.style.width = Math.round(k * 100) + "%"; if (t) t.textContent = Math.round(k * 100) + " %"; }, close: () => closeSheet() };
}
function toast(msg, err) {
  const el = document.createElement("div"); el.className = "toast" + (err ? " err" : "");
  el.innerHTML = `<span class="ic">${ic(err ? "alert" : "check")}</span><span>${esc(msg)}</span>`;
  $("#toasts").appendChild(el); setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 300); }, err ? 4200 : 2600);
}
function isDark() { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
$("#themeBtn").addEventListener("click", () => { document.documentElement.dataset.theme = isDark() ? "light" : "dark"; try { localStorage.setItem("kis-theme", document.documentElement.dataset.theme); } catch {} syncChrome(); });
try { const t = localStorage.getItem("kis-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
$("#openPalette").addEventListener("click", openPalette);
addEventListener("resize", () => syncNav());
setInterval(() => { if (D && D.T !== todayISO()) render(); }, 60000);

$("#railLogo").src = LOGO;
$("#fab").innerHTML = ic("plus") + "<span>Ajouter</span>"; $("#fab").addEventListener("click", addMenu);
applyPerms();
buildNav(); render(); initStore();
</script>
